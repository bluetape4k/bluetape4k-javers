<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">javers-exposed-ddd command and projection sequence</title>
  <desc id="desc">Sequence diagram replacing the README Mermaid source with an SVG and PNG asset.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#56708C"/></marker>
    <style>
      .canvas{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;fill:#22344A;font-weight:400}
      .subtitle,.note{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;fill:#536476;font-weight:400}
      .actor{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;fill:#22344A;font-weight:400}
      .msg{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#34465B;font-weight:400}
      .box{filter:url(#shadow);stroke-width:2}.life{stroke:#C9D5E2;stroke-width:2;stroke-dasharray:6 7}
      .line{fill:none;stroke:#56708C;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#56708C;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .label-bg{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="760"/>
  <rect class="frame" x="34" y="28" width="1532" height="704" rx="28"/>
  <text class="title" x="72" y="84">javers-exposed-ddd command and projection sequence</text>
  <text class="subtitle" x="76" y="116">Preserves the README Mermaid flow: command persistence, JaVers commit, Kafka event, Redis projection, and read lookup.</text>
  <g transform="translate(70,152)">
    <g transform="translate(0,0)"><rect class="box" width="140" height="58" rx="12" fill="#E8F3FF" stroke="#75A9E8"/><text class="actor" x="70" y="35" text-anchor="middle">Client</text></g>
    <g transform="translate(180,0)"><rect class="box" width="190" height="58" rx="12" fill="#EAF7EF" stroke="#69B888"/><text class="actor" x="95" y="35" text-anchor="middle">OrderCommandHandler</text></g>
    <g transform="translate(420,0)"><rect class="box" width="170" height="58" rx="12" fill="#FFFFFF" stroke="#DB7890"/><text class="actor" x="85" y="26" text-anchor="middle">Exposed</text><text class="msg" x="85" y="45" text-anchor="middle">order table</text></g>
    <g transform="translate(640,0)"><rect class="box" width="210" height="58" rx="12" fill="#FCE7F3" stroke="#DB7890"/><text class="actor" x="105" y="26" text-anchor="middle">ExposedCdo</text><text class="msg" x="105" y="45" text-anchor="middle">SnapshotRepository</text></g>
    <g transform="translate(900,0)"><rect class="box" width="150" height="58" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/><text class="actor" x="75" y="35" text-anchor="middle">Kafka topic</text></g>
    <g transform="translate(1090,0)"><rect class="box" width="210" height="58" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><text class="actor" x="105" y="26" text-anchor="middle">Projection</text><text class="msg" x="105" y="45" text-anchor="middle">event consumer</text></g>
    <g transform="translate(1340,0)"><rect class="box" width="120" height="58" rx="12" fill="#F1ECFF" stroke="#8A72D6"/><text class="actor" x="60" y="26" text-anchor="middle">Redis</text><text class="msg" x="60" y="45" text-anchor="middle">summary</text></g>
  </g>
  <g>
    <path class="life" d="M140 210 V675"/><path class="life" d="M345 210 V675"/><path class="life" d="M575 210 V675"/><path class="life" d="M815 210 V675"/><path class="life" d="M1045 210 V675"/><path class="life" d="M1265 210 V675"/><path class="life" d="M1470 210 V675"/>
    <path class="line" d="M140 250 H345"/><rect class="label-bg" x="188" y="230" width="112" height="24" rx="8"/><text class="msg" x="244" y="247" text-anchor="middle">PlaceOrderCommand</text>
    <path class="line" d="M345 310 H575"/><rect class="label-bg" x="408" y="290" width="104" height="24" rx="8"/><text class="msg" x="460" y="307" text-anchor="middle">insert/update Order</text>
    <path class="line" d="M345 370 H815"/><rect class="label-bg" x="520" y="350" width="120" height="24" rx="8"/><text class="msg" x="580" y="367" text-anchor="middle">JaVers commit</text>
    <path class="line" d="M345 430 H1045"/><rect class="label-bg" x="640" y="410" width="96" height="24" rx="8"/><text class="msg" x="688" y="427" text-anchor="middle">OrderPlaced</text>
    <path class="line" d="M1265 490 H1045"/><rect class="label-bg" x="1115" y="470" width="84" height="24" rx="8"/><text class="msg" x="1157" y="487" text-anchor="middle">poll event</text>
    <path class="line" d="M1265 550 H1470"/><rect class="label-bg" x="1310" y="530" width="116" height="24" rx="8"/><text class="msg" x="1368" y="547" text-anchor="middle">upsert summary</text>
    <path class="line" d="M140 610 H1330 V640 H1470"/><rect class="label-bg" x="612" y="590" width="132" height="24" rx="8"/><text class="msg" x="678" y="607" text-anchor="middle">findSummary(orderId)</text>
    <path class="dash" d="M1470 670 H140"/><rect class="label-bg" x="740" y="650" width="110" height="24" rx="8"/><text class="msg" x="795" y="667" text-anchor="middle">OrderSummary</text>
  </g>
</svg>
