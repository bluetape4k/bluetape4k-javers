<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="760" viewBox="0 0 1450 760" role="img" aria-labelledby="title desc">
  <title id="title">javers-exposed architecture</title>
  <desc id="desc">Exposed-backed JaVers snapshot repository architecture.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#56708C"/></marker>
    <style>
      .canvas{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title,.layer-title,.card-title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;fill:#22344A;font-weight:400}
      .title{font-size:44px}.layer-title{font-size:25px}.card-title{font-size:23px}
      .subtitle,.detail,.small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476;font-weight:400}
      .subtitle{font-size:16px}.detail{font-size:14px}.small{font-size:12px}
      .layer{fill:#F1F5F9;stroke:#D7E2EC;stroke-width:2}.card{filter:url(#shadow);stroke-width:2}
      .line{fill:none;stroke:#56708C;stroke-width:2.4;marker-end:url(#arrow)}
      .line-schema{fill:none;stroke:#D9AA4D;stroke-width:2.4;marker-end:url(#arrow)}
      .line-db{fill:none;stroke:#DB7890;stroke-width:2.4;marker-end:url(#arrow)}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1450" height="760"/>
  <rect class="frame" x="34" y="28" width="1382" height="704" rx="28"/>
  <text class="title" x="72" y="84">javers-exposed architecture</text>
  <text class="subtitle" x="76" y="116">JaVers commits are encoded by the repository and persisted through Exposed JDBC tables.</text>

  <rect class="layer" x="72" y="152" width="1306" height="126" rx="18"/>
  <text class="layer-title" x="104" y="190">Application</text>
  <g transform="translate(360,184)">
    <rect class="card" width="260" height="70" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="card-title" x="130" y="30" text-anchor="middle">Kotlin service</text>
    <text class="detail" x="130" y="52" text-anchor="middle">commit and query aggregate state</text>
  </g>
  <g transform="translate(790,184)">
    <rect class="card" width="260" height="70" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="card-title" x="130" y="30" text-anchor="middle">JaVers runtime</text>
    <text class="detail" x="130" y="52" text-anchor="middle">JaversRepository contract</text>
  </g>

  <rect class="layer" x="72" y="320" width="1306" height="148" rx="18"/>
  <text class="layer-title" x="104" y="356">Repository</text>
  <g transform="translate(220,358)">
    <rect class="card" width="310" height="78" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
    <text class="card-title" x="155" y="28" text-anchor="middle">ExposedCdo</text>
    <text class="card-title" x="155" y="50" text-anchor="middle">SnapshotRepository</text>
    <text class="detail" x="155" y="68" text-anchor="middle">saveSnapshot, loadSnapshots</text>
  </g>
  <g transform="translate(600,358)">
    <rect class="card" width="300" height="78" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="150" y="28" text-anchor="middle">AbstractCdo</text>
    <text class="card-title" x="150" y="50" text-anchor="middle">SnapshotRepository</text>
    <text class="detail" x="150" y="68" text-anchor="middle">encode/decode, JQL fallback</text>
  </g>
  <g transform="translate(970,358)">
    <rect class="card" width="250" height="78" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="card-title" x="125" y="30" text-anchor="middle">ensureSchema()</text>
    <text class="detail" x="125" y="52" text-anchor="middle">SchemaUtils.create</text>
  </g>

  <rect class="layer" x="72" y="510" width="1306" height="140" rx="18"/>
  <text class="layer-title" x="104" y="546">SQL storage</text>
  <g transform="translate(240,548)">
    <path class="card" d="M0 12 C0 4 280 4 280 12 L280 72 C280 84 0 84 0 72 Z" fill="#FFFFFF" stroke="#DB7890"/>
    <path d="M0 12 C0 24 280 24 280 12" fill="none" stroke="#DB7890" stroke-width="2"/>
    <text class="card-title" x="140" y="38" text-anchor="middle">javers_commit</text>
    <text class="detail" x="140" y="62" text-anchor="middle">commit metadata and sequence</text>
  </g>
  <g transform="translate(590,548)">
    <path class="card" d="M0 12 C0 4 300 4 300 12 L300 72 C300 84 0 84 0 72 Z" fill="#FFFFFF" stroke="#DB7890"/>
    <path d="M0 12 C0 24 300 24 300 12" fill="none" stroke="#DB7890" stroke-width="2"/>
    <text class="card-title" x="150" y="38" text-anchor="middle">javers_snapshot</text>
    <text class="detail" x="150" y="62" text-anchor="middle">encoded CdoSnapshot rows</text>
  </g>
  <g transform="translate(980,548)">
    <rect class="card" width="240" height="84" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="120" y="36" text-anchor="middle">Exposed Database</text>
    <text class="detail" x="120" y="60" text-anchor="middle">H2, PostgreSQL, MySQL</text>
  </g>

  <path class="line" d="M620 219 H790"/>
  <path class="line" d="M920 254 V300 H375 V358"/>
  <path class="line" d="M530 397 H600"/>
  <path class="line-schema" d="M375 436 V486 H1095 V548"/>
  <path class="line-db" d="M375 436 V500 H380 V548"/>
  <path class="line-db" d="M375 436 V500 H740 V548"/>
  <path class="line-db" d="M520 590 H590"/>
  <path class="line-db" d="M890 590 H980"/>

  <g transform="translate(76,678)">
    <rect class="pill" width="1298" height="34" rx="10"/>
    <text class="small" x="649" y="22" text-anchor="middle">Graphviz evidence: javers-exposed-architecture-01.dot, .plain, and -sketch.svg. Final SVG keeps the same source-derived nodes and routes.</text>
  </g>
</svg>
