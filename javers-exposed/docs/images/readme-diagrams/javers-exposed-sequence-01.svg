<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">javers-exposed persistence sequence</title>
  <desc id="desc">Sequence diagram for saving and loading JaVers snapshots through Exposed JDBC.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#56708C"/></marker>
    <style>
      .canvas{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title,.actor{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;fill:#22344A;font-weight:400}
      .title{font-size:43px}.actor{font-size:22px}
      .subtitle,.msg{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;fill:#536476;font-weight:400}
      .subtitle{font-size:15px}.msg{font-size:13px}
      .box{filter:url(#shadow);stroke-width:2}.life{stroke:#C9D5E2;stroke-width:2;stroke-dasharray:6 7}
      .line{fill:none;stroke:#56708C;stroke-width:2.2;marker-end:url(#arrow)}.dash{fill:none;stroke:#56708C;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .label-bg{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="720"/>
  <rect class="frame" x="34" y="28" width="1532" height="664" rx="28"/>
  <text class="title" x="72" y="84">javers-exposed persistence sequence</text>
  <text class="subtitle" x="76" y="116">Commit writes store metadata and encoded snapshots; query reads decode state by global id and version.</text>

  <g transform="translate(80,152)">
    <g transform="translate(0,0)"><rect class="box" width="160" height="58" rx="12" fill="#E8F3FF" stroke="#75A9E8"/><text class="actor" x="80" y="35" text-anchor="middle">Application</text></g>
    <g transform="translate(235,0)"><rect class="box" width="150" height="58" rx="12" fill="#EAF7EF" stroke="#69B888"/><text class="actor" x="75" y="35" text-anchor="middle">JaVers</text></g>
    <g transform="translate(460,0)"><rect class="box" width="250" height="58" rx="12" fill="#FCE7F3" stroke="#DB7890"/><text class="actor" x="125" y="26" text-anchor="middle">ExposedCdo</text><text class="msg" x="125" y="45" text-anchor="middle">SnapshotRepository</text></g>
    <g transform="translate(785,0)"><rect class="box" width="190" height="58" rx="12" fill="#F1ECFF" stroke="#8A72D6"/><text class="actor" x="95" y="26" text-anchor="middle">Exposed</text><text class="msg" x="95" y="45" text-anchor="middle">transaction</text></g>
    <g transform="translate(1050,0)"><rect class="box" width="170" height="58" rx="12" fill="#FFFFFF" stroke="#DB7890"/><text class="actor" x="85" y="26" text-anchor="middle">CommitTable</text><text class="msg" x="85" y="45" text-anchor="middle">metadata</text></g>
    <g transform="translate(1270,0)"><rect class="box" width="170" height="58" rx="12" fill="#FFFFFF" stroke="#DB7890"/><text class="actor" x="85" y="26" text-anchor="middle">SnapshotTable</text><text class="msg" x="85" y="45" text-anchor="middle">state rows</text></g>
  </g>
  <g>
    <path class="life" d="M160 210 V635"/><path class="life" d="M390 210 V635"/><path class="life" d="M665 210 V635"/><path class="life" d="M960 210 V635"/><path class="life" d="M1215 210 V635"/><path class="life" d="M1435 210 V635"/>
    <path class="line" d="M160 250 H390"/><rect class="label-bg" x="220" y="230" width="112" height="24" rx="8"/><text class="msg" x="276" y="247" text-anchor="middle">commit aggregate</text>
    <path class="line" d="M390 305 H665"/><rect class="label-bg" x="482" y="285" width="96" height="24" rx="8"/><text class="msg" x="530" y="302" text-anchor="middle">persist(commit)</text>
    <path class="line" d="M665 360 H960"/><rect class="label-bg" x="742" y="340" width="146" height="24" rx="8"/><text class="msg" x="815" y="357" text-anchor="middle">transaction(database)</text>
    <path class="line" d="M960 415 H1215"/><rect class="label-bg" x="1010" y="395" width="156" height="24" rx="8"/><text class="msg" x="1088" y="412" text-anchor="middle">insert metadata if absent</text>
    <path class="line" d="M960 470 H1435"/><rect class="label-bg" x="1115" y="450" width="142" height="24" rx="8"/><text class="msg" x="1186" y="467" text-anchor="middle">insert encoded snapshot</text>
    <path class="line" d="M160 540 H390"/><rect class="label-bg" x="220" y="520" width="120" height="24" rx="8"/><text class="msg" x="280" y="537" text-anchor="middle">query snapshots</text>
    <path class="line" d="M390 590 H665"/><rect class="label-bg" x="462" y="570" width="134" height="24" rx="8"/><text class="msg" x="529" y="587" text-anchor="middle">loadSnapshots(id)</text>
    <path class="dash" d="M1435 625 H665"/><rect class="label-bg" x="982" y="605" width="136" height="24" rx="8"/><text class="msg" x="1050" y="622" text-anchor="middle">decode ordered state</text>
  </g>
</svg>
