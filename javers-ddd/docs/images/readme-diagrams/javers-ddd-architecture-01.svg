<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">javers-ddd architecture</title>
  <desc id="desc">DDD helper module architecture showing aggregate roots, domain events, aggregate repository, and publisher adapters.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#56708C"/></marker>
    <style>
      .canvas{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;fill:#22344A;font-weight:400}
      .subtitle,.detail{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;fill:#536476;font-weight:400}
      .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;fill:#22344A;font-weight:400}
      .member{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#34465B;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}.line{fill:none;stroke:#56708C;stroke-width:2.4;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#8A72D6;stroke-width:2.3;stroke-dasharray:8 7;marker-end:url(#arrow)}
      .label-bg{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1320" height="760"/>
  <rect class="frame" x="34" y="28" width="1252" height="704" rx="28"/>
  <text class="title" x="72" y="84">javers-ddd architecture</text>
  <text class="subtitle" x="76" y="116">Aggregate save/load helpers with immediate domain event publication adapters.</text>
  <g transform="translate(82,190)"><rect class="card" x="0" y="0" width="245" height="122" rx="12" fill="#E8F3FF" stroke="#75A9E8"/><text class="label" x="122" y="30" text-anchor="middle">AggregateRoot&lt;ID&gt;</text><line x1="18" y1="44" x2="227" y2="44" stroke="#75A9E8" stroke-width="1.5"/><text class="member" x="24" y="68">+ id: ID</text><text class="member" x="24" y="92">domain object marker</text></g>
  <g transform="translate(472,170)"><rect class="card" x="0" y="0" width="300" height="166" rx="12" fill="#FCE7F3" stroke="#DB7890"/><text class="label" x="150" y="30" text-anchor="middle">AggregateRepository</text><line x1="18" y1="44" x2="282" y2="44" stroke="#DB7890" stroke-width="1.5"/><text class="member" x="24" y="68">+ save(aggregate, author)</text><text class="member" x="24" y="92">+ save(aggregate, author, event)</text><text class="member" x="24" y="116">+ load(id), loadHistory(id)</text><text class="member" x="24" y="140"># persist(aggregate), findById(id)</text></g>
  <g transform="translate(922,190)"><rect class="card" x="0" y="0" width="250" height="122" rx="12" fill="#EAF7EF" stroke="#69B888"/><text class="label" x="125" y="30" text-anchor="middle">DomainEvent</text><line x1="18" y1="44" x2="232" y2="44" stroke="#69B888" stroke-width="1.5"/><text class="member" x="24" y="68">+ aggregateId</text><text class="member" x="24" y="90">+ occurredOn, attributes</text></g>
  <g transform="translate(488,430)"><rect class="card" x="0" y="0" width="270" height="118" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/><text class="label" x="135" y="30" text-anchor="middle">DomainEventPublisher</text><line x1="18" y1="44" x2="252" y2="44" stroke="#D9AA4D" stroke-width="1.5"/><text class="member" x="24" y="70">+ publish(event)</text><text class="member" x="24" y="94">+ publishAll(events)</text></g>
  <g transform="translate(110,608)"><rect class="card" x="0" y="0" width="270" height="70" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><text class="label" x="135" y="31" text-anchor="middle">Spring adapter</text><text class="detail" x="135" y="53" text-anchor="middle">ApplicationEventPublisher</text></g>
  <g transform="translate(520,608)"><rect class="card" x="0" y="0" width="200" height="70" rx="12" fill="#F1ECFF" stroke="#8A72D6"/><text class="label" x="100" y="31" text-anchor="middle">Kafka adapter</text><text class="detail" x="100" y="53" text-anchor="middle">Spring Kafka</text></g>
  <g transform="translate(872,608)"><rect class="card" x="0" y="0" width="200" height="70" rx="12" fill="#EEF6D9" stroke="#8BA84D"/><text class="label" x="100" y="31" text-anchor="middle">NATS adapter</text><text class="detail" x="100" y="53" text-anchor="middle">NATS client</text></g>
  <path class="line" d="M327 251 H472"/><rect class="label-bg" x="354" y="231" width="84" height="24" rx="8"/><text class="member" x="396" y="248" text-anchor="middle">audited by</text>
  <path class="line" d="M772 251 H922"/><rect class="label-bg" x="808" y="231" width="80" height="24" rx="8"/><text class="member" x="848" y="248" text-anchor="middle">commit data</text>
  <path class="line" d="M622 336 V430"/><rect class="label-bg" x="540" y="374" width="164" height="24" rx="8"/><text class="member" x="622" y="391" text-anchor="middle">publishes after save</text>
  <path class="dash" d="M245 608 V530 H488"/><path class="dash" d="M620 608 V548"/><path class="dash" d="M972 608 V530 H758"/>
</svg>
