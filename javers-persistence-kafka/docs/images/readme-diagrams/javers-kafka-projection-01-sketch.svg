<svg xmlns="http://www.w3.org/2000/svg" width="940" height="280" viewBox="0 0 940 280" role="img" aria-labelledby="title desc">
  <title id="title">Kafka audit projection graph sketch</title>
  <desc id="desc">Graphviz-oriented sketch for the Kafka audit projection README diagram.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#56708C"/>
    </marker>
    <style>
      .bg{fill:#F7FAFC}.node{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}.title{font-family:"Architects Daughter","Comic Mono",cursive;font-size:28px;fill:#22344A}.label{font-family:"Comic Mono",monospace;font-size:14px;fill:#536476}.edge{fill:none;stroke:#56708C;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="940" height="280"/>
  <text class="title" x="32" y="48">Kafka audit projection graph sketch</text>
  <g transform="translate(40,102)"><rect class="node" width="115" height="54" rx="10"/><text class="label" x="57.5" y="33" text-anchor="middle">Application</text></g>
  <g transform="translate(190,102)"><rect class="node" width="95" height="54" rx="10"/><text class="label" x="47.5" y="33" text-anchor="middle">JaVers</text></g>
  <g transform="translate(320,102)"><rect class="node" width="150" height="54" rx="10"/><text class="label" x="75" y="33" text-anchor="middle">Kafka repo</text></g>
  <g transform="translate(505,102)"><rect class="node" width="135" height="54" rx="10"/><text class="label" x="67.5" y="33" text-anchor="middle">Kafka topic</text></g>
  <g transform="translate(675,102)"><rect class="node" width="190" height="54" rx="10"/><text class="label" x="95" y="33" text-anchor="middle">Projector -> read repo</text></g>
  <path class="edge" d="M155 129 H190"/><path class="edge" d="M285 129 H320"/><path class="edge" d="M470 129 H505"/><path class="edge" d="M640 129 H675"/>
</svg>
