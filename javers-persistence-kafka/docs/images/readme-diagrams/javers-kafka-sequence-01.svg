<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" role="img" aria-labelledby="title desc">
  <title id="title">Kafka persistence sequence</title>
  <desc id="desc">Sequence diagram for JaVers Kafka write-only snapshot publication.</desc>
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#56708C"/></marker><style>.canvas{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}.title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:40px;fill:#22344A}.subtitle,.msg{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;fill:#536476}.actor{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:22px;fill:#22344A}.box{filter:url(#shadow);stroke-width:2}.life{stroke:#C9D5E2;stroke-width:2;stroke-dasharray:6 7}.line{fill:none;stroke:#56708C;stroke-width:2.3;marker-end:url(#arrow)}.label-bg{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}</style></defs>
  <rect class="canvas" width="1240" height="520"/><rect class="frame" x="32" y="28" width="1176" height="464" rx="26"/>
  <text class="title" x="70" y="84">Kafka persistence sequence</text><text class="subtitle" x="74" y="114">Write-only JaVers repository publishes encoded snapshots to a Kafka audit event stream.</text>
  <g transform="translate(82,150)"><rect class="box" width="150" height="58" rx="12" fill="#E8F3FF" stroke="#75A9E8"/><text class="actor" x="75" y="35" text-anchor="middle">Application</text></g>
  <g transform="translate(310,150)"><rect class="box" width="150" height="58" rx="12" fill="#EAF7EF" stroke="#69B888"/><text class="actor" x="75" y="35" text-anchor="middle">JaVers</text></g>
  <g transform="translate(548,150)"><rect class="box" width="250" height="58" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/><text class="actor" x="125" y="35" text-anchor="middle">Kafka repository</text></g>
  <g transform="translate(886,150)"><rect class="box" width="150" height="58" rx="12" fill="#FFFFFF" stroke="#D9AA4D"/><text class="actor" x="75" y="35" text-anchor="middle">Kafka topic</text></g>
  <g transform="translate(1080,150)"><rect class="box" width="120" height="58" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><text class="actor" x="60" y="28" text-anchor="middle">Consumer</text><text class="msg" x="60" y="46" text-anchor="middle">audit stream</text></g>
  <path class="life" d="M157 208 V430"/><path class="life" d="M385 208 V430"/><path class="life" d="M673 208 V430"/><path class="life" d="M961 208 V430"/><path class="life" d="M1140 208 V430"/>
  <path class="line" d="M157 250 H385"/><rect class="label-bg" x="206" y="230" width="130" height="24" rx="8"/><text class="msg" x="271" y="247" text-anchor="middle">commit aggregate</text>
  <path class="line" d="M385 310 H673"/><rect class="label-bg" x="486" y="290" width="86" height="24" rx="8"/><text class="msg" x="529" y="307" text-anchor="middle">saveSnapshot</text>
  <path class="line" d="M673 370 H961"/><rect class="label-bg" x="760" y="350" width="114" height="24" rx="8"/><text class="msg" x="817" y="367" text-anchor="middle">ProducerRecord</text>
  <path class="line" d="M961 420 H1140"/><rect class="label-bg" x="996" y="400" width="110" height="24" rx="8"/><text class="msg" x="1051" y="417" text-anchor="middle">consume event</text>
</svg>
