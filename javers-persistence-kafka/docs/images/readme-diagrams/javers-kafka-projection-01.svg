<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Kafka audit projection</title>
  <desc id="desc">CQRS diagram showing write-only Kafka publication and explicit replay into a read-capable CdoSnapshotRepository.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#56708C"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#8D6CC8"/>
    </marker>
    <marker id="arrow-pink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#C85F7F"/>
    </marker>
    <style>
      .canvas{fill:#F7FAFC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Mono",cursive;font-size:42px;fill:#22344A}
      .subtitle,.detail,.label,.legend{font-family:"Comic Mono",monospace;font-size:15px;fill:#536476}
      .actor{font-family:"Architects Daughter","Comic Mono",cursive;font-size:24px;fill:#22344A}
      .box{filter:url(#shadow);stroke-width:2}
      .band{fill:#FAFCFE;stroke:#DCE7F1;stroke-width:1.5;stroke-dasharray:8 8}
      .band-title{font-family:"Architects Daughter","Comic Mono",cursive;font-size:22px;fill:#44566A}
      .flow{fill:none;stroke:#56708C;stroke-width:2.6;marker-end:url(#arrow-blue)}
      .replay{fill:none;stroke:#8D6CC8;stroke-width:2.6;marker-end:url(#arrow-purple)}
      .query{fill:none;stroke:#C85F7F;stroke-width:2.6;marker-end:url(#arrow-pink)}
      .label-bg{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
      .chip{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4}
    </style>
  </defs>

  <rect class="canvas" width="1280" height="720"/>
  <rect class="frame" x="32" y="28" width="1216" height="664" rx="26"/>
  <text class="title" x="72" y="86">Kafka audit projection</text>
  <text class="subtitle" x="76" y="118">Kafka stays the write stream; a separate projector materializes snapshots into an existing read repository.</text>

  <rect class="band" x="70" y="160" width="1140" height="190" rx="18"/>
  <text class="band-title" x="92" y="198">Write stream</text>
  <rect class="band" x="70" y="390" width="1140" height="190" rx="18"/>
  <text class="band-title" x="92" y="428">Read projection</text>

  <g transform="translate(110,226)">
    <rect class="box" width="170" height="72" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="actor" x="85" y="34" text-anchor="middle">Application</text>
    <text class="detail" x="85" y="55" text-anchor="middle">write side</text>
  </g>
  <g transform="translate(345,226)">
    <rect class="box" width="150" height="72" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="actor" x="75" y="44" text-anchor="middle">JaVers</text>
  </g>
  <g transform="translate(560,226)">
    <rect class="box" width="220" height="72" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="actor" x="110" y="34" text-anchor="middle">Kafka repository</text>
    <text class="detail" x="110" y="55" text-anchor="middle">write-only</text>
  </g>
  <g transform="translate(846,226)">
    <rect class="box" width="190" height="72" rx="12" fill="#FFFFFF" stroke="#D9AA4D"/>
    <text class="actor" x="95" y="34" text-anchor="middle">Kafka topic</text>
    <text class="detail" x="95" y="55" text-anchor="middle">snapshot stream</text>
  </g>

  <g transform="translate(176,484)">
    <rect class="box" width="350" height="78" rx="12" fill="#F5EDFF" stroke="#A179D8"/>
    <text class="actor" x="175" y="33" text-anchor="middle">KafkaCdoSnapshotProjector</text>
    <text class="detail" x="175" y="57" text-anchor="middle">decode, replay, skip duplicates</text>
  </g>
  <g transform="translate(612,484)">
    <rect class="box" width="278" height="78" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="actor" x="139" y="33" text-anchor="middle">CdoSnapshotRepository</text>
    <text class="detail" x="139" y="57" text-anchor="middle">Redis / Exposed / Caffeine</text>
  </g>
  <g transform="translate(980,484)">
    <rect class="box" width="170" height="78" rx="12" fill="#FBEAF0" stroke="#D87391"/>
    <text class="actor" x="85" y="33" text-anchor="middle">Application</text>
    <text class="detail" x="85" y="57" text-anchor="middle">read side</text>
  </g>

  <path class="flow" d="M280 262 H345"/>
  <rect class="label-bg" x="286" y="235" width="54" height="24" rx="8"/>
  <text class="label" x="313" y="252" text-anchor="middle">commit</text>

  <path class="flow" d="M495 262 H560"/>
  <rect class="label-bg" x="502" y="235" width="52" height="24" rx="8"/>
  <text class="label" x="528" y="252" text-anchor="middle">save</text>

  <path class="flow" d="M780 262 H846"/>
  <rect class="label-bg" x="790" y="235" width="47" height="24" rx="8"/>
  <text class="label" x="813" y="252" text-anchor="middle">send</text>

  <path class="replay" d="M941 298 V409 H351 V484"/>
  <rect class="label-bg" x="577" y="383" width="166" height="24" rx="8"/>
  <text class="label" x="660" y="400" text-anchor="middle">poll partition + offset</text>

  <path class="replay" d="M526 523 H612"/>
  <rect class="label-bg" x="533" y="496" width="72" height="24" rx="8"/>
  <text class="label" x="569" y="513" text-anchor="middle">project</text>

  <path class="query" d="M980 523 H890"/>
  <rect class="label-bg" x="912" y="496" width="46" height="24" rx="8"/>
  <text class="label" x="935" y="513" text-anchor="middle">read</text>

  <g transform="translate(94,614)">
    <rect class="chip" width="250" height="38" rx="12"/>
    <text class="legend" x="125" y="24" text-anchor="middle">wire value: encoded snapshot</text>
  </g>
  <g transform="translate(368,614)">
    <rect class="chip" width="270" height="38" rx="12"/>
    <text class="legend" x="135" y="24" text-anchor="middle">idempotency: globalId + commitId</text>
  </g>
  <g transform="translate(662,614)">
    <rect class="chip" width="240" height="38" rx="12"/>
    <text class="legend" x="120" y="24" text-anchor="middle">offset commit after batch</text>
  </g>
  <g transform="translate(926,614)">
    <rect class="chip" width="262" height="38" rx="12"/>
    <text class="legend" x="131" y="24" text-anchor="middle">Kafka repositories stay write-only</text>
  </g>
</svg>
