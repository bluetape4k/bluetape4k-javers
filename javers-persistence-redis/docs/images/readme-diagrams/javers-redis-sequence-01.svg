<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="title desc">
  <title id="title">Redis persistence sequence</title>
  <desc id="desc">Sequence diagram for JaVers Redis persistence through Lettuce or Redisson repositories.</desc>
  <defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#56708C"/></marker><style>.canvas{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}.title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:40px;fill:#22344A}.subtitle,.msg{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;fill:#536476}.actor{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:22px;fill:#22344A}.box{filter:url(#shadow);stroke-width:2}.life{stroke:#C9D5E2;stroke-width:2;stroke-dasharray:6 7}.line{fill:none;stroke:#56708C;stroke-width:2.3;marker-end:url(#arrow)}.dash{fill:none;stroke:#56708C;stroke-width:2.3;stroke-dasharray:7 6;marker-end:url(#arrow)}.label-bg{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}</style></defs>
  <rect class="canvas" width="1180" height="520"/><rect class="frame" x="32" y="28" width="1116" height="464" rx="26"/>
  <text class="title" x="70" y="84">Redis persistence sequence</text><text class="subtitle" x="74" y="114">JaVers commits and history reads through Lettuce or Redisson-backed snapshot storage.</text>
  <g transform="translate(90,150)"><rect class="box" width="160" height="58" rx="12" fill="#E8F3FF" stroke="#75A9E8"/><text class="actor" x="80" y="35" text-anchor="middle">Application</text></g>
  <g transform="translate(360,150)"><rect class="box" width="160" height="58" rx="12" fill="#EAF7EF" stroke="#69B888"/><text class="actor" x="80" y="35" text-anchor="middle">JaVers</text></g>
  <g transform="translate(630,150)"><rect class="box" width="230" height="58" rx="12" fill="#E9F7F6" stroke="#45A7A1"/><text class="actor" x="115" y="27" text-anchor="middle">Redis repository</text><text class="msg" x="115" y="46" text-anchor="middle">Lettuce / Redisson</text></g>
  <g transform="translate(980,150)"><rect class="box" width="130" height="58" rx="12" fill="#FFFFFF" stroke="#45A7A1"/><text class="actor" x="65" y="35" text-anchor="middle">Redis</text></g>
  <path class="life" d="M170 208 V440"/><path class="life" d="M440 208 V440"/><path class="life" d="M745 208 V440"/><path class="life" d="M1045 208 V440"/>
  <path class="line" d="M170 250 H440"/><rect class="label-bg" x="238" y="230" width="132" height="24" rx="8"/><text class="msg" x="304" y="247" text-anchor="middle">commit aggregate</text>
  <path class="line" d="M440 310 H745"/><rect class="label-bg" x="530" y="290" width="126" height="24" rx="8"/><text class="msg" x="593" y="307" text-anchor="middle">save/load snapshots</text>
  <path class="line" d="M745 370 H1045"/><rect class="label-bg" x="836" y="350" width="118" height="24" rx="8"/><text class="msg" x="895" y="367" text-anchor="middle">encoded payloads</text>
  <path class="dash" d="M1045 420 H440"/><rect class="label-bg" x="672" y="400" width="142" height="24" rx="8"/><text class="msg" x="743" y="417" text-anchor="middle">history/head restore</text>
</svg>
