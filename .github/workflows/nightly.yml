name: Nightly

on:
  schedule:
    - cron: '0 19 * * *'  # 매일 UTC 19:00 (KST 04:00)
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 0. Gradle Wrapper 검증 ────────────────────────────────────────────────
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  # ── 1. 전체 빌드 + Detekt ─────────────────────────────────────────────────
  build:
    name: Build & Detekt
    runs-on: ubuntu-latest
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build (compile only)
        run: ./gradlew build -x test --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Detekt static analysis
        run: ./gradlew detekt --parallel

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: 'build/reports/detekt/*.xml'
          retention-days: 14

  # ── 2. javers-core (Docker 불필요) ────────────────────────────────────────
  test-javers-core:
    name: Test / javers-core
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test javers-core
        run: ./gradlew :javers-core:test --no-daemon --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :javers-core:koverXmlReport --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-javers-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-javers-core
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── 3. javers-persistence-redis (Testcontainers) ─────────────────────────
  test-persistence-redis:
    name: Test / javers-persistence-redis
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test javers-persistence-redis
        run: ./gradlew :javers-persistence-redis:test --no-daemon --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :javers-persistence-redis:koverXmlReport --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-persistence-redis
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-persistence-redis
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── 4. javers-persistence-kafka (Testcontainers) ─────────────────────────
  test-persistence-kafka:
    name: Test / javers-persistence-kafka
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test javers-persistence-kafka
        run: ./gradlew :javers-persistence-kafka:test --no-daemon --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :javers-persistence-kafka:koverXmlReport --no-daemon
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-persistence-kafka
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-persistence-kafka
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── 5. 커버리지 집계 ──────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs:
      - test-javers-core
      - test-persistence-redis
      - test-persistence-kafka
    if: always()
    steps:
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 30

  # ── 6. 결과 집계 ──────────────────────────────────────────────────────────
  nightly-status:
    name: Nightly Status
    runs-on: ubuntu-latest
    needs:
      - build
      - test-javers-core
      - test-persistence-redis
      - test-persistence-kafka
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Nightly results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Nightly failed"
            exit 1
          fi
          echo "Nightly passed"
