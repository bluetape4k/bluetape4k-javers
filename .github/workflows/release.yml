name: Publish Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 0.2.0). Must match an existing tag.'
        required: true
        type: string
      diagnoseSigning:
        description: 'Run signing diagnostics before publishing'
        required: false
        default: false
        type: boolean
      catalogRef:
        description: 'bluetape4k-dependencies catalog ref to use during release'
        required: false
        default: ''
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="$TAG_NAME"
          else
            VERSION="$INPUT_VERSION"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION"

  publish:
    name: Publish RELEASE to Maven Central Portal
    needs: resolve-version
    runs-on: ubuntu-latest
    environment: maven-central-release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          fetch-depth: 0

      - name: Checkout central manual site
        uses: actions/checkout@v7
        with:
          repository: bluetape4k/bluetape4k.github.io
          ref: develop
          path: .manual-site
          fetch-depth: 1

      - name: Validate current manual and module inventory
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          MANUAL_VERSION="${VERSION%%-*}"
          SITE_ROOT="$GITHUB_WORKSPACE/.manual-site"
          TOOL_ROOT="$SITE_ROOT/scripts/manual/repositories/bluetape4k-javers"
          MANUAL_ROOT="$SITE_ROOT/docs/manual/bluetape4k-javers"
          CURRENT_ROOT="$MANUAL_ROOT/current"
          if [[ -f "$TOOL_ROOT/current_manual_contract_test.rb" && -f "$CURRENT_ROOT/manifest.yaml" ]]; then
            BLUETAPE4K_JAVERS_ROOT="$GITHUB_WORKSPACE" \
            BLUETAPE4K_JAVERS_CURRENT_ROOT="$CURRENT_ROOT" \
            BLUETAPE4K_JAVERS_CURRENT_MANIFEST="$CURRENT_ROOT/manifest.yaml" \
              ruby -I "$TOOL_ROOT" "$TOOL_ROOT/current_manual_contract_test.rb"
            BLUETAPE4K_JAVERS_RELEASE_WORKFLOW="$GITHUB_WORKSPACE/.github/workflows/release.yml" \
              ruby -I "$TOOL_ROOT" "$TOOL_ROOT/release_workflow_contract_test.rb"
            ruby "$TOOL_ROOT/current_manual_contract.rb" \
              --version "$MANUAL_VERSION" \
              --manual-root "$CURRENT_ROOT" \
              --manifest "$CURRENT_ROOT/manifest.yaml"
            ruby "$TOOL_ROOT/export_manifest.rb" --check \
              "$CURRENT_ROOT/manifest.yaml" \
              "$CURRENT_ROOT/generated/manifest.json"
          elif [[ "$MANUAL_VERSION" == "0.3.0" ]]; then
            echo "::notice::Using the legacy manual validator for immutable release tag $VERSION."
            TARGET_SHA="$(git rev-parse "${VERSION}^{commit}")"
            LEGACY_MANUAL_METADATA="$(ruby -ryaml -e '
              manifest = YAML.safe_load(File.read(".manual-site/docs/manual/bluetape4k-javers/manifest.yaml"))
              release_tag = manifest.fetch("releaseTag")
              release_commit = manifest.fetch("releaseCommit")
              abort("legacy manual manifest must pin releaseTag and releaseCommit") if
                [release_tag, release_commit].any? { |value| !value.is_a?(String) || value.empty? }
              puts [release_tag, release_commit].join("\t")
            ')"
            IFS=$'\t' read -r LEGACY_MANUAL_TAG LEGACY_MANUAL_SHA <<< "$LEGACY_MANUAL_METADATA"
            if [[ -z "$LEGACY_MANUAL_TAG" || -z "$LEGACY_MANUAL_SHA" ]]; then
              echo "::error::Legacy manual manifest did not provide pinned release coordinates."
              exit 1
            fi
            LEGACY_INPUT="$RUNNER_TEMP/release-manual-inventory-input.json"
            ruby -rjson -e '
              manifest = JSON.parse(File.read(".manual-site/docs/manual/bluetape4k-javers/generated/manifest.json"))
              File.write(ARGV.fetch(0), JSON.pretty_generate(manifest.fetch("modules")) + "\n")
            ' "$LEGACY_INPUT"
            ruby "$TOOL_ROOT/release_inventory.rb" \
              "$VERSION" "$TARGET_SHA" "$LEGACY_INPUT" \
              build/manual/release-module-inventory.json 7
            ruby "$TOOL_ROOT/validate_release_manuals.rb" \
              --code-root "$GITHUB_WORKSPACE" \
              --manual-root "$MANUAL_ROOT" \
              --manifest "$MANUAL_ROOT/manifest.yaml" \
              --inventory "$GITHUB_WORKSPACE/build/manual/release-module-inventory.json" \
              --tag "$LEGACY_MANUAL_TAG" \
              --sha "$LEGACY_MANUAL_SHA"
          else
            echo "::error::No supported manual validation contract is available for immutable release tag $VERSION."
            exit 1
          fi
          git diff --check

      - name: Resolve dependencies catalog ref
        id: catalog
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CATALOG_REF: ${{ github.event.inputs.catalogRef || '' }}
        run: |
          set -euo pipefail
          DEFAULT_CATALOG_REF=$(sed -nE 's/^[[:space:]]*\.orElse\("([^"]+)"\).*/\1/p' settings.gradle.kts | head -1)

          if [[ -z "$DEFAULT_CATALOG_REF" ]]; then
            echo "::error::Could not resolve checked-in bluetape4k-dependencies catalog default from settings.gradle.kts"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_CATALOG_REF" ]]; then
            SELECTED_CATALOG_REF="$INPUT_CATALOG_REF"
            CATALOG_SOURCE="workflow_dispatch input catalogRef"
          else
            SELECTED_CATALOG_REF="$DEFAULT_CATALOG_REF"
            CATALOG_SOURCE="checked-in settings.gradle.kts default"
          fi

          if [[ ! "$SELECTED_CATALOG_REF" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "::error::Catalog ref must be an immutable Git commit SHA: $SELECTED_CATALOG_REF"
            exit 1
          fi

          echo "BLUETAPE4K_DEPENDENCIES_CATALOG_REF=$SELECTED_CATALOG_REF" >> "$GITHUB_ENV"
          {
            echo "ref=$SELECTED_CATALOG_REF"
            echo "source=$CATALOG_SOURCE"
          } >> "$GITHUB_OUTPUT"

          echo "catalogRef=$SELECTED_CATALOG_REF"
          echo "catalogSource=$CATALOG_SOURCE"
          echo "checkedInDefault=$DEFAULT_CATALOG_REF"

      - name: Verify dependencies catalog aliases
        shell: bash
        run: |
          set -euo pipefail
          catalog_file="$RUNNER_TEMP/bluetape4k-libs.versions.toml"
          catalog_url="https://raw.githubusercontent.com/bluetape4k/bluetape4k-dependencies/${BLUETAPE4K_DEPENDENCIES_CATALOG_REF}/gradle/libs.versions.toml"
          required_aliases=(
            "bluetape4k-bom"
            "bluetape4k-exposed-bom"
            "exposed-bom"
            "exposed-plugin"
          )

          echo "Fetching bluetape4k-dependencies catalog: $catalog_url"
          curl -fsSL "$catalog_url" -o "$catalog_file"

          for alias in "${required_aliases[@]}"; do
            if ! grep -Eq "^[[:space:]]*${alias}[[:space:]]*=" "$catalog_file"; then
              echo "::error::Catalog ref '${BLUETAPE4K_DEPENDENCIES_CATALOG_REF}' is missing required alias: ${alias}"
              exit 1
            fi
          done

          echo "Verified catalog aliases from ${BLUETAPE4K_DEPENDENCIES_CATALOG_REF}:"
          grep -E '^[[:space:]]*(bluetape4k-bom|bluetape4k-exposed-bom|exposed-bom|exposed-plugin)[[:space:]]*=' "$catalog_file"

      - name: Verify gradle.properties matches tag
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          BASE=$(grep -E '^baseVersion=' gradle.properties | cut -d= -f2)
          SNAP=$(grep -E '^snapshotVersion=' gradle.properties | cut -d= -f2 || echo "")
          RELEASE_VERSION="${VERSION%%-*}"
          echo "tag=$VERSION releaseVersion=$RELEASE_VERSION baseVersion=$BASE snapshotVersion='$SNAP'"
          if [[ "$BASE" != "$RELEASE_VERSION" ]]; then
            echo "::error::gradle.properties baseVersion ($BASE) does not match stable release version ($RELEASE_VERSION)"
            exit 1
          fi
          if [[ -n "$SNAP" ]]; then
            echo "::error::snapshotVersion must be empty for release. Got: '$SNAP'"
            exit 1
          fi

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Diagnose signing inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnoseSigning }}
        shell: bash
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          python3 <<'PY'
          import base64, os

          raw_key = os.environ.get("SIGNING_KEY", "")
          key_id = os.environ.get("SIGNING_KEY_ID", "")
          password = os.environ.get("SIGNING_PASSWORD", "")

          print(f"SIGNING_KEY_ID set={bool(key_id)} length={len(key_id)}")
          print(f"SIGNING_PASSWORD set={bool(password)} length={len(password)}")
          print(f"SIGNING_KEY set={bool(raw_key)} length={len(raw_key)}")

          if raw_key.lstrip().startswith("-----BEGIN"):
              normalized_key = raw_key.replace("\\n", "\n")
              source = "armored"
          elif "\\n" in raw_key:
              normalized_key = raw_key.replace("\\n", "\n")
              source = "escaped_newlines"
          else:
              try:
                  normalized_key = base64.b64decode(raw_key.strip()).decode("utf-8")
                  source = "base64"
              except Exception:
                  normalized_key = raw_key
                  source = "raw"

          print(f"SIGNING_KEY source={source} normalized_length={len(normalized_key)}")
          print(f"SIGNING_KEY armored={'BEGIN PGP PRIVATE KEY BLOCK' in normalized_key}")
          PY

      - name: Validate publication POMs
        run: |
          ./gradlew generatePomFileForBluetapeJaversPublication \
            --no-daemon --no-configuration-cache --no-build-cache
          ruby scripts/publication/validate_poms.rb

      - name: Publish to Central Portal
        run: >
          ./gradlew publishAggregationToCentralPortal
          --no-daemon
          --no-configuration-cache
          --no-build-cache
          --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

  github-release:
    name: Create GitHub Release
    needs: [resolve-version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          fetch-depth: 0

      - name: Resolve previous tag
        id: prev_tag
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          PREV=$(git tag --list --sort=-v:refname \
            | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$' \
            | grep -vx "$VERSION" \
            | head -1 || true)
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV:-(none)}"

      - name: Compose release notes
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          PREV_TAG: ${{ steps.prev_tag.outputs.previous }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"

          awk -v ver="$VERSION" '
            BEGIN { inblock=0 }
            /^## \[/ {
              if (inblock) exit
              if (index($0, "[" ver "]") > 0) { inblock=1; next }
            }
            inblock { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "::error::CHANGELOG.md must contain an exact section for [$VERSION]."
            exit 1
          fi

          if [[ -n "$PREV_TAG" ]]; then
            CONTRIBUTORS=$(git shortlog -sne "${PREV_TAG}..${VERSION}" \
              | sed -E 's/^[[:space:]]*[0-9]+[[:space:]]+//' \
              | sort -u || true)
            if [[ -n "$CONTRIBUTORS" ]]; then
              {
                printf '\n## Contributors\n\n'
                printf 'Thanks to everyone who contributed to this release.\n\n'
                while IFS= read -r line; do
                  printf -- '- %s\n' "$line"
                done <<< "$CONTRIBUTORS"
              } >> "$NOTES_FILE"
            fi

            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$REPO" "$PREV_TAG" "$VERSION" >> "$NOTES_FILE"
          else
            printf '\n**Full Changelog**: https://github.com/%s/commits/%s\n' \
              "$REPO" "$VERSION" >> "$NOTES_FILE"
          fi

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "--- Release notes preview (head 60 lines) ---"
          head -60 "$NOTES_FILE"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [[ "$VERSION" =~ -[A-Za-z0-9.]+$ ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$NOTES_FILE" \
            $PRERELEASE_FLAG
