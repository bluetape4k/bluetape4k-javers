        with:
          name: coverage-javers-spring-boot4-autoconfigure
          path: javers-spring-boot4-autoconfigure/build/reports/kover/report.xml
          if-no-files-found: error
          retention-days: 7

  # 12. javers-persistence-redis tests (Testcontainers Redis)
  test-persistence-redis:
    name: Test / javers-persistence-redis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['javers-redis'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test javers-persistence-redis
        run: >-
          python3 .github/scripts/run_with_attempt_receipt.py
          --name javers-persistence-redis-test
          --max-attempts 5
          --receipt build/reports/ci-attempts/javers-persistence-redis-test.json
          --
          ./gradlew :javers-persistence-redis:test --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
      - name: Generate Kover XML report
        run: ./gradlew :javers-persistence-redis:koverXmlReport --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-persistence-redis
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/ci-attempts/**
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-persistence-redis
          path: javers-persistence-redis/build/reports/kover/report.xml
          if-no-files-found: error
          retention-days: 7

  # 13. javers-persistence-kafka tests (Testcontainers Kafka)
  test-persistence-kafka:
    name: Test / javers-persistence-kafka
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['javers-kafka'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test javers-persistence-kafka
        run: >-
          python3 .github/scripts/run_with_attempt_receipt.py
          --name javers-persistence-kafka-test
          --max-attempts 5
          --receipt build/reports/ci-attempts/javers-persistence-kafka-test.json
          --
          ./gradlew :javers-persistence-kafka:test --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
      - name: Generate Kover XML report
        run: ./gradlew :javers-persistence-kafka:koverXmlReport --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-persistence-kafka
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/ci-attempts/**
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-persistence-kafka
          path: javers-persistence-kafka/build/reports/kover/report.xml
          if-no-files-found: error
          retention-days: 7

  # 14. Status gate
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
      - test-javers-core
      - test-javers-ddd
      - test-examples-javers-exposed-ddd
      - test-examples-javers-ktor
      - test-examples-javers-spring-boot4
      - test-javers-exposed
      - test-javers-spring-boot4-autoconfigure
      - test-persistence-redis
      - test-persistence-kafka
    if: >
      always() && (
        needs.changes.outputs.javers-core == 'true' ||
        needs.changes.outputs.javers-ddd == 'true' ||
        needs.changes.outputs.examples-javers-exposed-ddd == 'true' ||
        needs.changes.outputs.examples-javers-ktor == 'true' ||
        needs.changes.outputs.examples-javers-spring-boot4 == 'true' ||
        needs.changes.outputs.javers-exposed == 'true' ||
        needs.changes.outputs.javers-spring-boot4-autoconfigure == 'true' ||
        needs.changes.outputs.javers-redis == 'true' ||
        needs.changes.outputs.javers-kafka == 'true'
      )
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Test coverage artifact validator
        run: python3 .github/scripts/validate_kover_artifacts_test.py

      - name: Validate coverage artifacts
        env:
          JAVERS_CORE_CHANGED: ${{ needs.changes.outputs.javers-core }}
          JAVERS_DDD_CHANGED: ${{ needs.changes.outputs.javers-ddd }}
          EXAMPLES_EXPOSED_DDD_CHANGED: ${{ needs.changes.outputs.examples-javers-exposed-ddd }}
          EXAMPLES_KTOR_CHANGED: ${{ needs.changes.outputs.examples-javers-ktor }}
          EXAMPLES_SPRING_BOOT4_CHANGED: ${{ needs.changes.outputs.examples-javers-spring-boot4 }}
          JAVERS_EXPOSED_CHANGED: ${{ needs.changes.outputs.javers-exposed }}
          JAVERS_SPRING_BOOT4_AUTOCONFIGURE_CHANGED: ${{ needs.changes.outputs.javers-spring-boot4-autoconfigure }}
          JAVERS_REDIS_CHANGED: ${{ needs.changes.outputs.javers-redis }}
          JAVERS_KAFKA_CHANGED: ${{ needs.changes.outputs.javers-kafka }}
        run: |
          set -euo pipefail

          expected_artifacts=()
          [[ "${JAVERS_CORE_CHANGED}" == "true" ]] && expected_artifacts+=(coverage-javers-core)
          [[ "${JAVERS_DDD_CHANGED}" == "true" ]] && expected_artifacts+=(coverage-javers-ddd)
          [[ "${EXAMPLES_EXPOSED_DDD_CHANGED}" == "true" ]] && expected_artifacts+=(coverage-examples-javers-exposed-ddd)
          [[ "${EXAMPLES_KTOR_CHANGED}" == "true" ]] && expected_artifacts+=(coverage-examples-javers-ktor)
          [[ "${EXAMPLES_SPRING_BOOT4_CHANGED}" == "true" ]] && expected_artifacts+=(coverage-examples-javers-spring-boot4)
          [[ "${JAVERS_EXPOSED_CHANGED}" == "true" ]] && expected_artifacts+=(coverage-javers-exposed)
          [[ "${JAVERS_SPRING_BOOT4_AUTOCONFIGURE_CHANGED}" == "true" ]] && expected_artifacts+=(coverage-javers-spring-boot4-autoconfigure)
          [[ "${JAVERS_REDIS_CHANGED}" == "true" ]] && expected_artifacts+=(coverage-persistence-redis)
          [[ "${JAVERS_KAFKA_CHANGED}" == "true" ]] && expected_artifacts+=(coverage-persistence-kafka)

          python3 .github/scripts/validate_kover_artifacts.py \
            coverage-artifacts "${expected_artifacts[@]}"

      - name: Aggregate Kover coverage summary
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 30

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - catalog-governance
      - gitleaks
      - benchmark-javers-exposed
      - build
      - coverage-report
      - changes
      - test-javers-core
      - test-javers-ddd
      - test-examples-javers-exposed-ddd
      - test-examples-javers-ktor
      - test-examples-javers-spring-boot4
      - test-javers-exposed
      - test-javers-spring-boot4-autoconfigure
      - test-persistence-redis
      - test-persistence-kafka
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          {
            echo "## CI coverage interpretation"
            echo "- Job results: \`$RESULTS\`"
            echo "- A path-filtered or conditionally skipped job is not runtime coverage proof."
            echo "- A green job after infrastructure retry retains first-attempt evidence in its Step Summary."
            echo "- Green status is not a claim that every module ran."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CI passed; skipped jobs remain explicitly non-coverage"
