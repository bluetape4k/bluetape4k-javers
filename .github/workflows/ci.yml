      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-persistence-kafka
          path: javers-persistence-kafka/build/reports/kover/report.xml
          if-no-files-found: error
          retention-days: 7

  # 11. Status gate
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - gitleaks
      - build
      - changes
      - test-javers-core
      - test-javers-ddd
      - test-examples-javers-exposed-ddd
      - test-examples-javers-ktor
      - test-examples-javers-spring-boot4
      - test-javers-exposed
      - test-persistence-redis
      - test-persistence-kafka
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed (skipped jobs treated as success)"
