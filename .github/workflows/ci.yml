name: CI

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  statuses: read
  packages: read

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.claude/**'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BLUETAPE4K_DEPENDENCIES_CATALOG_REF: '91f9ea9336b5ea991f5675323a1cf25ccfd6f5ed'

jobs:
  # 0. Secret scan
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_ASSET_URL=$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | jq -r '.assets[] | select(.name | test("linux_x64\\.tar\\.gz$")) | .browser_download_url')
          test -n "${GITLEAKS_ASSET_URL}"
          curl -sSfL "${GITLEAKS_ASSET_URL}" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  # 1. Gradle Wrapper validation
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.3.0

  # 2. Detect changed modules
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      benchmark-javers-exposed-benchmark: ${{ steps.filter.outputs.benchmark-javers-exposed-benchmark }}
      examples-javers-exposed-ddd: ${{ steps.filter.outputs.examples-javers-exposed-ddd }}
      examples-javers-ktor: ${{ steps.filter.outputs.examples-javers-ktor }}
      examples-javers-spring-boot4: ${{ steps.filter.outputs.examples-javers-spring-boot4 }}
      javers-core: ${{ steps.filter.outputs.javers-core }}
      javers-ddd: ${{ steps.filter.outputs.javers-ddd }}
      javers-exposed: ${{ steps.filter.outputs.javers-exposed }}
      javers-kafka: ${{ steps.filter.outputs.javers-kafka }}
      javers-redis: ${{ steps.filter.outputs.javers-redis }}
      javers-spring-boot4-autoconfigure: ${{ steps.filter.outputs.javers-spring-boot4-autoconfigure }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            benchmark-javers-exposed-benchmark:
              - 'benchmark/javers-exposed-benchmark/**'
            examples-javers-exposed-ddd:
              - 'examples/javers-exposed-ddd/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            examples-javers-ktor:
              - 'examples/javers-ktor/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            examples-javers-spring-boot4:
              - 'examples/javers-spring-boot4/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            javers-core:
              - 'javers-core/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            javers-ddd:
              - 'javers-ddd/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            javers-exposed:
              - 'javers-exposed/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            javers-kafka:
              - 'javers-persistence-kafka/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            javers-redis:
              - 'javers-persistence-redis/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            javers-spring-boot4-autoconfigure:
              - 'javers-spring-boot4-autoconfigure/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'

  # 3. Compile only
  catalog-governance:
    name: Central Catalog Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bluetape4k/bluetape4k-dependencies
          ref: ${{ env.BLUETAPE4K_DEPENDENCIES_CATALOG_REF }}
          path: .catalog/bluetape4k-dependencies
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify immutable catalog checkout
        run: test "$(git -C .catalog/bluetape4k-dependencies rev-parse HEAD)" = "$BLUETAPE4K_DEPENDENCIES_CATALOG_REF"
      - name: Check central catalog adoption
        run: |
          python3 .catalog/bluetape4k-dependencies/scripts/sync-shared-versions.py \
            --workspace "$(dirname "$GITHUB_WORKSPACE")" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --check \
            --summary
      - name: Resolve Gradle catalog from checked-out source
        env:
          BLUETAPE4K_DEPENDENCIES_CATALOG_PATH: ${{ github.workspace }}/.catalog/bluetape4k-dependencies/gradle/libs.versions.toml
        run: ./gradlew help --no-daemon

  build:
    name: Build (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-wrapper, catalog-governance]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test CI attempt receipt helper
        run: python3 .github/scripts/run_with_attempt_receipt_test.py
      - name: Build (compile only)
        run: >-
          python3 .github/scripts/run_with_attempt_receipt.py
          --name build
          --max-attempts 5
          --receipt build/reports/ci-attempts/build.json
          --
          ./gradlew build -x test --parallel --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload build attempt receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-attempts-build
          path: build/reports/ci-attempts/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify Kotlin public ABI
        run: |
          ./gradlew checkKotlinAbi --no-daemon --no-configuration-cache --no-build-cache --no-parallel
          ruby scripts/compatibility/public_abi_fixture_test.rb

      - name: Validate publication POMs
        run: |
          ruby scripts/publication/publication_pom_audit_test.rb
          ruby scripts/publication/publication_pom_integration_test.rb
          ./gradlew generatePomFileForBluetapeJaversPublication -PsnapshotVersion=-SNAPSHOT \
            --no-daemon --no-configuration-cache --no-build-cache
          ruby scripts/publication/validate_poms.rb
          ruby scripts/publication/bom_contract.rb \
            bom/build/publications/BluetapeJavers/pom-default.xml \
            docs/manual/en/modules/bluetape4k-javers-bom.md \
            docs/manual/ko/modules/bluetape4k-javers-bom.md

  # 4. benchmark-javers-exposed-benchmark smoke (PostgreSQL Testcontainers)
  benchmark-javers-exposed:
    name: Benchmark / javers-exposed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['benchmark-javers-exposed-benchmark'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Run javers-exposed benchmark smoke
        run: >-
          python3 .github/scripts/run_with_attempt_receipt.py
          --name benchmark-smoke
          --max-attempts 3
          --receipt benchmark/javers-exposed-benchmark/build/reports/ci-attempts/benchmark-smoke.json
          --
          bash -c 'rm -rf benchmark/javers-exposed-benchmark/build/reports/benchmarks && exec ./gradlew :benchmark-javers-exposed-benchmark:mainCommitMetadataSmokeBenchmark :benchmark-javers-exposed-benchmark:mainEnversComparisonSmokeBenchmark --no-daemon --no-configuration-cache --no-build-cache --no-parallel'
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
      - name: Enrich benchmark receipts
        run: >-
          ruby scripts/benchmark/enrich_benchmark_receipts.rb
          benchmark/javers-exposed-benchmark/build/reports/benchmarks
          "./gradlew :benchmark-javers-exposed-benchmark:mainCommitMetadataSmokeBenchmark
          :benchmark-javers-exposed-benchmark:mainEnversComparisonSmokeBenchmark
          --no-daemon --no-configuration-cache --no-build-cache --no-parallel"
      - name: Validate benchmark receipts
        run: ruby scripts/benchmark/benchmark_receipt.rb benchmark/javers-exposed-benchmark/build/reports/benchmarks
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-javers-exposed
          path: |
            benchmark/javers-exposed-benchmark/build/reports/benchmarks/
            benchmark/javers-exposed-benchmark/build/reports/ci-attempts/
          if-no-files-found: error
          retention-days: 7

  # 5. javers-core tests (no Docker needed)
  test-javers-core:
    name: Test / javers-core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
