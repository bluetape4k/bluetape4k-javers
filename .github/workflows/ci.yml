          --
          ./gradlew :javers-core:test --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        run: ./gradlew :javers-core:koverXmlReport --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-javers-core
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/ci-attempts/**
          retention-days: 7
      - name: Upload coverage report
        if: always()
