name: CI

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  statuses: read
  packages: read

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.claude/**'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # 0. Secret scan
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  # 1. Gradle Wrapper validation
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

  # 2. Detect changed modules
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      examples-javers-exposed-ddd: ${{ steps.filter.outputs.examples-javers-exposed-ddd }}
      examples-javers-ktor: ${{ steps.filter.outputs.examples-javers-ktor }}
      examples-javers-spring-boot4: ${{ steps.filter.outputs.examples-javers-spring-boot4 }}
      javers-core: ${{ steps.filter.outputs.javers-core }}
      javers-ddd: ${{ steps.filter.outputs.javers-ddd }}
      javers-exposed: ${{ steps.filter.outputs.javers-exposed }}
      javers-kafka: ${{ steps.filter.outputs.javers-kafka }}
      javers-redis: ${{ steps.filter.outputs.javers-redis }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            examples-javers-exposed-ddd:
              - 'examples/javers-exposed-ddd/**'
            examples-javers-ktor:
              - 'examples/javers-ktor/**'
            examples-javers-spring-boot4:
              - 'examples/javers-spring-boot4/**'
            javers-core:
              - 'javers-core/**'
            javers-ddd:
              - 'javers-ddd/**'
            javers-exposed:
              - 'javers-exposed/**'
            javers-kafka:
              - 'javers-persistence-kafka/**'
            javers-redis:
              - 'javers-persistence-redis/**'

  # 3. Compile only
  build:
    name: Build (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build (compile only)
        run: ./gradlew build -x test --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  # 4. javers-core tests (no Docker needed)
  test-javers-core:
    name: Test / javers-core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['javers-core'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true
      - name: Test javers-core
        run: |
          for attempt in 1 2 3; do
            ./gradlew :javers-core:test --no-daemon && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Generate Kover XML report
        run: ./gradlew :javers-core:koverXmlReport --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-javers-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-javers-core
          path: javers-core/build/reports/kover/report.xml
          if-no-files-found: error
          retention-days: 7

  # 5. javers-ddd tests (H2 + DDD helper adapters)
  test-javers-ddd:
    name: Test / javers-ddd
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['javers-ddd'] == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
