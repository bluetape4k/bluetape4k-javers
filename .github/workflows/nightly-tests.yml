  # ── 9. 커버리지 집계 ──────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report

    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test-javers-core
      - test-javers-ddd
      - test-examples-javers-exposed-ddd
      - test-examples-javers-ktor
      - test-examples-javers-spring-boot4
      - test-javers-exposed
      - test-persistence-redis
      - test-persistence-kafka
      - test-javers-spring-boot4-autoconfigure
    if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule == '15 19 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Test coverage artifact validator
        run: python3 .github/scripts/validate_kover_artifacts_test.py

      - name: Validate expected coverage artifacts
        run: |
          set -euo pipefail

          # Full nightly coverage must include every module covered by this job.
          expected_artifacts=(
            coverage-javers-core
            coverage-javers-ddd
            coverage-examples-javers-exposed-ddd
            coverage-examples-javers-ktor
            coverage-examples-javers-spring-boot4
            coverage-javers-exposed
            coverage-persistence-redis
            coverage-persistence-kafka
            coverage-javers-spring-boot4-autoconfigure
          )

          python3 .github/scripts/validate_kover_artifacts.py \
            coverage-artifacts "${expected_artifacts[@]}"

      - name: Aggregate Kover coverage summary
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 30

  # ── 10. 결과 집계 ─────────────────────────────────────────────────────────
  nightly-status:
    name: Nightly Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - benchmark-javers-exposed
      - build
      - test-javers-core
      - test-javers-ddd
      - test-examples-javers-exposed-ddd
      - test-examples-javers-ktor
      - test-examples-javers-spring-boot4
      - test-javers-exposed
      - test-persistence-redis
      - test-persistence-kafka
      - test-javers-spring-boot4-autoconfigure
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Nightly results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Nightly failed"
            exit 1
          fi
          echo "Nightly passed"
