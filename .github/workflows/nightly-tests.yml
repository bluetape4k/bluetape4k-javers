name: Nightly

on:
  schedule:
    - cron: '15 19 * * 1-6'  # Daily smoke, UTC 19:15 (KST 04:15) Mon-Sat
    - cron: '15 19 * * 0'    # Weekly full, UTC 19:15 (KST 04:15) Sunday
  workflow_dispatch:
    inputs:
      scope:
        description: 'Nightly scope to run'
        required: true
        type: choice
        default: full
        options:
          - smoke
          - full

permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 0. Gradle Wrapper 검증 ────────────────────────────────────────────────
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.3.0

  # ── 1. 전체 빌드 + Detekt ─────────────────────────────────────────────────
  build:
    name: Build & Detekt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper

      - name: Test CI attempt receipt helper
        run: python3 .github/scripts/run_with_attempt_receipt_test.py

      - name: Build (compile only)
        run: >-
          python3 .github/scripts/run_with_attempt_receipt.py
          --name nightly-build
          --max-attempts 5
          --receipt build/reports/ci-attempts/nightly-build.json
          --
          ./gradlew build -x test --parallel --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Detekt static analysis
        run: >-
          python3 .github/scripts/run_with_attempt_receipt.py
          --name nightly-detekt
          --max-attempts 5
          --receipt build/reports/ci-attempts/nightly-detekt.json
          --
          ./gradlew detekt --parallel --no-configuration-cache

      - name: Upload build attempt receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-ci-attempts-build
          path: build/reports/ci-attempts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: 'build/reports/detekt/*.xml'
          retention-days: 14

  # ── 2. benchmark-javers-exposed-benchmark (PostgreSQL Testcontainers) ───
  benchmark-javers-exposed:
    name: Benchmark / javers-exposed
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 19 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') }}

    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Run javers-exposed benchmark smoke
        run: >-
          python3 .github/scripts/run_with_attempt_receipt.py
          --name nightly-benchmark-smoke
          --max-attempts 3
          --receipt benchmark/javers-exposed-benchmark/build/reports/ci-attempts/nightly-benchmark-smoke.json
          --
          bash -c 'rm -rf benchmark/javers-exposed-benchmark/build/reports/benchmarks && exec ./gradlew :benchmark-javers-exposed-benchmark:mainCommitMetadataSmokeBenchmark :benchmark-javers-exposed-benchmark:mainEnversComparisonSmokeBenchmark --no-daemon --no-configuration-cache --no-build-cache --no-parallel'
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Enrich benchmark receipts
        run: >-
          ruby scripts/benchmark/enrich_benchmark_receipts.rb
          benchmark/javers-exposed-benchmark/build/reports/benchmarks
          "./gradlew :benchmark-javers-exposed-benchmark:mainCommitMetadataSmokeBenchmark
          :benchmark-javers-exposed-benchmark:mainEnversComparisonSmokeBenchmark
          --no-daemon --no-configuration-cache --no-build-cache --no-parallel"

      - name: Validate benchmark receipts
        run: ruby scripts/benchmark/benchmark_receipt.rb benchmark/javers-exposed-benchmark/build/reports/benchmarks

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-javers-exposed
          path: |
            benchmark/javers-exposed-benchmark/build/reports/benchmarks/
            benchmark/javers-exposed-benchmark/build/reports/ci-attempts/
          if-no-files-found: error
          retention-days: 14

  # ── 3. javers-core (Docker 불필요) ────────────────────────────────────────
  test-javers-core:
    name: Test / javers-core
    runs-on: ubuntu-latest
    timeout-minutes: 10
