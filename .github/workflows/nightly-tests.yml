  # ── 7. javers-exposed (Testcontainers DBs) ───────────────────────────────
  test-javers-exposed:
    name: Test / javers-exposed
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 19 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full') }}

