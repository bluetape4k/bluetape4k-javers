  # ── 8. 커버리지 집계 ──────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report

    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test-javers-core
      - test-javers-ddd
      - test-examples-javers-exposed-ddd
      - test-examples-javers-ktor
      - test-examples-javers-spring-boot4
      - test-javers-exposed
      - test-persistence-redis
      - test-persistence-kafka
    if: ${{ always() && ((github.event_name == 'schedule' && github.event.schedule == '15 19 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')) }}
    steps:
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Validate expected coverage artifacts
        shell: bash
        run: |
          set -euo pipefail

          # Full nightly coverage must include every module covered by this job.
          expected_artifacts=(
            coverage-javers-core
            coverage-javers-ddd
            coverage-examples-javers-exposed-ddd
            coverage-examples-javers-ktor
            coverage-examples-javers-spring-boot4
            coverage-javers-exposed
            coverage-persistence-redis
            coverage-persistence-kafka
          )

          missing_artifacts=()
          empty_artifacts=()

          for artifact in "${expected_artifacts[@]}"; do
            artifact_dir="coverage-artifacts/${artifact}"
            if [[ ! -d "${artifact_dir}" ]]; then
              missing_artifacts+=("${artifact}")
              continue
            fi

            if ! find "${artifact_dir}" -type f -name 'report.xml' -print -quit | grep -q .; then
              empty_artifacts+=("${artifact}")
            fi
          done

          if (( ${#missing_artifacts[@]} > 0 || ${#empty_artifacts[@]} > 0 )); then
            echo "::error title=Nightly coverage artifacts incomplete::Expected full-scope coverage artifacts are missing or empty."

            if (( ${#missing_artifacts[@]} > 0 )); then
              printf 'Missing artifacts:\n'
              printf '  - %s\n' "${missing_artifacts[@]}"
            fi

            if (( ${#empty_artifacts[@]} > 0 )); then
              printf 'Empty artifacts:\n'
              printf '  - %s\n' "${empty_artifacts[@]}"
            fi

            echo "Downloaded artifacts:"
            find coverage-artifacts -maxdepth 2 -type d -print 2>/dev/null | sort || true
            exit 1
          fi

          printf 'Validated %s expected full-scope coverage artifacts.\n' "${#expected_artifacts[@]}"

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 30

  # ── 9. 결과 집계 ──────────────────────────────────────────────────────────
  nightly-status:
    name: Nightly Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build
      - test-javers-core
      - test-javers-ddd
      - test-examples-javers-exposed-ddd
      - test-examples-javers-ktor
      - test-examples-javers-spring-boot4
      - test-javers-exposed
      - test-persistence-redis
      - test-persistence-kafka
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Nightly results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Nightly failed"
            exit 1
          fi
          echo "Nightly passed"
