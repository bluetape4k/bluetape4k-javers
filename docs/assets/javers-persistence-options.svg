<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">JaVers persistence options relationship diagram</title>
  <desc id="desc">Relationship diagram for bluetape4k JaVers core, Redis, Kafka, and planned Exposed persistence modules.</desc>
  <defs>
    <style>
      .title { font: 700 34px "Architects Daughter", "Comic Sans MS", cursive; fill: #1f2937; }
      .subtitle { font: 18px "Comic Mono", "SFMono-Regular", monospace; fill: #64748b; }
      .panel-title { font: 700 20px "Architects Daughter", "Comic Sans MS", cursive; fill: #1f2937; }
      .label { font: 15px "Comic Mono", "SFMono-Regular", monospace; fill: #334155; }
      .small { font: 13px "Comic Mono", "SFMono-Regular", monospace; fill: #475569; }
      .badge { font: 12px "Comic Mono", "SFMono-Regular", monospace; fill: #334155; }
      .box { stroke: #b8c2d6; stroke-width: 2; rx: 16; }
      .group { fill: #ffffff; stroke: #d8dee9; stroke-width: 2; rx: 24; }
      .line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 12; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 9 9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 9 9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 9 9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 9 9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#db2777"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 9 9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="1248" height="688" rx="28" fill="#fbfdff" stroke="#d8dee9" stroke-width="2"/>
  <text x="64" y="72" class="title">JaVers Persistence Options</text>
  <text x="64" y="104" class="subtitle">Current Redis/Kafka modules plus the Exposed JDBC target tracked by issue #3</text>

  <rect x="58" y="142" width="238" height="132" class="group"/>
  <text x="86" y="182" class="panel-title">Kotlin Services</text>
  <text x="86" y="214" class="label">JaVers audit/diff</text>
  <text x="86" y="240" class="small">import aligned artifacts</text>

  <rect x="372" y="128" width="294" height="176" class="group"/>
  <text x="406" y="166" class="panel-title">javers-core</text>
  <rect x="404" y="184" width="228" height="34" class="box" fill="#eef2ff"/>
  <text x="424" y="207" class="small">CdoSnapshotRepository SPI</text>
  <rect x="404" y="230" width="228" height="34" class="box" fill="#e0f2fe"/>
  <text x="424" y="253" class="small">AbstractCdoSnapshotRepository</text>
  <rect x="404" y="276" width="228" height="34" class="box" fill="#f1f5f9"/>
  <text x="424" y="299" class="small">JaversCodec encode/decode</text>

  <rect x="72" y="324" width="198" height="68" class="box" fill="#f1f5f9"/>
  <text x="94" y="354" class="label">BOM</text>
  <text x="94" y="378" class="small">version alignment</text>

  <rect x="766" y="98" width="392" height="138" class="group"/>
  <text x="796" y="135" class="panel-title">Redis Persistence</text>
  <text x="796" y="166" class="label">javers-persistence-redis</text>
  <text x="796" y="193" class="small">LettuceCdoSnapshotRepository</text>
  <text x="796" y="217" class="small">RedissonCdoSnapshotRepository</text>
  <rect x="1016" y="146" width="106" height="56" class="box" fill="#dcfce7"/>
  <text x="1044" y="171" class="small">Redis</text>
  <text x="1034" y="193" class="badge">read/write</text>

  <rect x="766" y="292" width="392" height="138" class="group"/>
  <text x="796" y="329" class="panel-title">Kafka Persistence</text>
  <text x="796" y="360" class="label">javers-persistence-kafka</text>
  <text x="796" y="387" class="small">KafkaCdoSnapshotRepository</text>
  <text x="796" y="411" class="small">write-only snapshot event stream</text>
  <rect x="1016" y="342" width="106" height="56" class="box" fill="#fef3c7"/>
  <text x="1038" y="367" class="small">Kafka</text>
  <text x="1035" y="389" class="badge">publish</text>

  <rect x="766" y="486" width="392" height="138" class="group"/>
  <text x="796" y="523" class="panel-title">Exposed Persistence</text>
  <text x="796" y="554" class="label">javers-exposed</text>
  <text x="796" y="581" class="small">Exposed JDBC repository target</text>
  <text x="796" y="605" class="small">tracked by issue #3</text>
  <rect x="1016" y="536" width="106" height="56" class="box" fill="#fce7f3"/>
  <text x="1042" y="561" class="small">SQL</text>
  <text x="1029" y="583" class="badge">planned</text>

  <path d="M296 208 H372" class="line" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <rect x="303" y="184" width="62" height="24" class="pill"/>
  <text x="315" y="201" class="badge">builds</text>

  <path d="M171 324 V274" class="line" stroke="#64748b" marker-end="url(#arrow-gray)"/>
  <rect x="184" y="288" width="64" height="24" class="pill"/>
  <text x="196" y="305" class="badge">imports</text>

  <path d="M666 184 H766" class="line" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <rect x="686" y="160" width="74" height="24" class="pill"/>
  <text x="698" y="177" class="badge">extends</text>

  <path d="M666 247 H716 V361 H766" class="line" stroke="#d97706" marker-end="url(#arrow-amber)"/>
  <rect x="678" y="286" width="74" height="24" class="pill"/>
  <text x="690" y="303" class="badge">extends</text>

  <path d="M666 293 H704 V555 H766" class="line" stroke="#db2777" marker-end="url(#arrow-pink)"/>
  <rect x="674" y="438" width="76" height="24" class="pill"/>
  <text x="686" y="455" class="badge">planned</text>

  <path d="M978 174 H1016" class="line" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <path d="M982 370 H1016" class="line" stroke="#d97706" marker-end="url(#arrow-amber)"/>
  <path d="M982 564 H1016" class="line" stroke="#db2777" marker-end="url(#arrow-pink)"/>

  <rect x="72" y="588" width="604" height="54" rx="18" fill="#ffffff" stroke="#d8dee9" stroke-width="2"/>
  <text x="96" y="622" class="small">Source truth: current repositories extend javers-core SPI; Exposed is the next JDBC module in issue #3.</text>
</svg>
