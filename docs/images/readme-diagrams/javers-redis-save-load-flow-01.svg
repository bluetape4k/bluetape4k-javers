<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1800" viewBox="0 0 1840 1800" role="img" aria-label="javers redis save load sequence">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="2" flood-color="#000814" flood-opacity="0.18"/></filter>
  <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b8def"/></marker>
  <marker id="arrowRose" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d66f7e"/></marker>
  <marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4fb8a8"/></marker>
  <marker id="arrowCyan" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#55c7e8"/></marker>
  <marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d0a24c"/></marker>
  <style>
    .title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:36px;fill:#f8fafc;font-weight:700}
    .subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15px;fill:#d5dfeb}
    .participant{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:21px;fill:#f8fafc;font-weight:700}
    .role{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#d5dfeb}
    .frameTitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;fill:#d5dfeb;font-weight:700}
    .message{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;font-weight:700}
    .badgeText{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#f8fafc;font-weight:700}
    .note{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;fill:#d5dfeb}
  </style>
</defs>

<rect width="1840" height="1800" rx="26" fill="#020617"/>
<rect class="frame" x="20" y="20" width="1800" height="1760" rx="24" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="title" x="54" y="64">javers-persistence-redis Save / Load Sequence</text>
<text class="subtitle" x="56" y="94">Lettuce commits snapshots and sequence metadata atomically; Redisson writes the same structures with best-effort ordering</text>

<rect class="card header" x="55" y="140" width="220" height="92" rx="14" fill="#223047" stroke="#5b8def" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="165" y="176" text-anchor="middle">JaVers</text><text class="role" x="165" y="203" text-anchor="middle">commit + query caller</text>
<rect class="card header" x="335" y="140" width="300" height="92" rx="14" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="485" y="176" text-anchor="middle">Redis Repository</text><text class="role" x="485" y="203" text-anchor="middle">Lettuce or Redisson adapter</text>
<rect class="card header" x="735" y="140" width="230" height="92" rx="14" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="850" y="176" text-anchor="middle">Snapshot Codec</text><text class="role" x="850" y="203" text-anchor="middle">default LZ4Fory</text>
<rect class="card header" x="1080" y="140" width="280" height="92" rx="14" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="1220" y="176" text-anchor="middle">Snapshot Storage</text><text class="role" x="1220" y="203" text-anchor="middle">LIST or RListMultimap</text>
<rect class="card header" x="1450" y="140" width="260" height="92" rx="14" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="1580" y="176" text-anchor="middle">Sequence Metadata</text><text class="role" x="1580" y="203" text-anchor="middle">CommitId to sequence</text>

<g stroke="#536377" stroke-width="2" stroke-dasharray="8 8">
  <line class="lifeline" x1="165" y1="232" x2="165" y2="1690"/><line class="lifeline" x1="485" y1="232" x2="485" y2="1690"/>
  <line class="lifeline" x1="850" y1="232" x2="850" y2="1690"/><line class="lifeline" x1="1220" y1="232" x2="1220" y2="1690"/><line class="lifeline" x1="1580" y1="232" x2="1580" y2="1690"/>
</g>
<rect class="activation" x="475" y="300" width="20" height="1390" rx="8" fill="#223047" stroke="#d66f7e" stroke-width="2"/>
<rect class="activation" x="840" y="390" width="20" height="1060" rx="8" fill="#223047" stroke="#4fb8a8" stroke-width="2"/>
<rect class="activation" x="1210" y="585" width="20" height="990" rx="8" fill="#223047" stroke="#55c7e8" stroke-width="2"/>
<rect class="activation" x="1570" y="665" width="20" height="990" rx="8" fill="#223047" stroke="#d0a24c" stroke-width="2"/>

<path class="connector" data-source="javers" data-target="repository" d="M 165,320 L 475,320" fill="none" stroke="#5b8def" stroke-width="4" marker-end="url(#arrowBlue)"/>
<g transform="translate(230 274)"><rect class="label" x="0" y="0" width="210" height="34" rx="17" fill="#172033" stroke="#5b8def" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#5b8def"/><text class="badgeText num" x="18" y="21" text-anchor="middle">1</text><text class="message" x="39" y="22" fill="#5b8def">persist(commit, sequence)</text></g>
<path class="connector" data-source="repository" data-target="codec" d="M 495,410 L 840,410" fill="none" stroke="#4fb8a8" stroke-width="4" marker-end="url(#arrowTeal)"/>
<g transform="translate(560 364)"><rect class="label" x="0" y="0" width="225" height="34" rx="17" fill="#172033" stroke="#4fb8a8" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#4fb8a8"/><text class="badgeText num" x="18" y="21" text-anchor="middle">2</text><text class="message" x="39" y="22" fill="#4fb8a8">encode all snapshots</text></g>
<path class="connector" data-source="codec" data-target="repository" d="M 840,485 L 495,485" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrowTeal)"/>
<g transform="translate(580 439)"><rect class="label" x="0" y="0" width="190" height="34" rx="17" fill="#172033" stroke="#4fb8a8" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#4fb8a8"/><text class="badgeText num" x="18" y="21" text-anchor="middle">3</text><text class="message" x="39" y="22" fill="#4fb8a8">encoded byte arrays</text></g>

<rect class="alt" x="425" y="535" width="1215" height="470" rx="18" fill="none" stroke="#536377" stroke-width="2" stroke-dasharray="10 8"/>
<rect x="441" y="547" width="430" height="34" rx="17" fill="#172033" stroke="#536377" stroke-width="2"/><text class="frameTitle" x="461" y="569">alt Lettuce persistCommit / persistProjectedSnapshot</text>
<path class="connector" data-source="repository" data-target="snapshot-storage" d="M 495,625 L 1210,625" fill="none" stroke="#55c7e8" stroke-width="4" marker-end="url(#arrowCyan)"/>
<g transform="translate(700 579)"><rect class="label" x="0" y="0" width="310" height="34" rx="17" fill="#172033" stroke="#55c7e8" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#55c7e8"/><text class="badgeText num" x="18" y="21" text-anchor="middle">4</text><text class="message" x="39" y="22" fill="#55c7e8">MULTI; LPUSH + HSET GlobalId</text></g>
<path class="connector" data-source="repository" data-target="sequence-metadata" d="M 495,705 L 1570,705" fill="none" stroke="#d0a24c" stroke-width="4" marker-end="url(#arrowAmber)"/>
<g transform="translate(865 659)"><rect class="label" x="0" y="0" width="330" height="34" rx="17" fill="#172033" stroke="#d0a24c" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#d0a24c"/><text class="badgeText num" x="18" y="21" text-anchor="middle">5</text><text class="message" x="39" y="22" fill="#d0a24c">HSET CommitId sequence; EXEC</text></g>
<path class="connector" data-source="sequence-metadata" data-target="repository" d="M 1570,775 L 495,775" fill="none" stroke="#d0a24c" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrowAmber)"/>
<g transform="translate(890 729)"><rect class="label" x="0" y="0" width="280" height="34" rx="17" fill="#172033" stroke="#d0a24c" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#d0a24c"/><text class="badgeText num" x="18" y="21" text-anchor="middle">6</text><text class="message" x="39" y="22" fill="#d0a24c">all writes accepted atomically</text></g>
<line class="branchDivider" x1="425" y1="815" x2="1640" y2="815" stroke="#536377" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="441" y="827" width="315" height="32" rx="16" fill="#172033" stroke="#536377" stroke-width="2"/><text class="frameTitle" x="461" y="848">else Redisson best-effort multi-structure writes</text>
<path class="connector" data-source="repository" data-target="snapshot-storage" d="M 495,905 L 1210,905" fill="none" stroke="#55c7e8" stroke-width="4" marker-end="url(#arrowCyan)"/>
<g transform="translate(710 859)"><rect class="label" x="0" y="0" width="290" height="34" rx="17" fill="#172033" stroke="#55c7e8" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#55c7e8"/><text class="badgeText num" x="18" y="21" text-anchor="middle">7</text><text class="message" x="39" y="22" fill="#55c7e8">put each encoded snapshot</text></g>
<path class="connector" data-source="repository" data-target="sequence-metadata" d="M 495,975 L 1570,975" fill="none" stroke="#d66f7e" stroke-width="4" marker-end="url(#arrowRose)"/>
<g transform="translate(875 929)"><rect class="label" x="0" y="0" width="310" height="34" rx="17" fill="#172033" stroke="#d66f7e" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#d66f7e"/><text class="badgeText num" x="18" y="21" text-anchor="middle">8</text><text class="message" x="39" y="22" fill="#d66f7e">fastPut only after snapshots</text></g>

<rect class="alt" x="85" y="1030" width="1585" height="650" rx="18" fill="none" stroke="#536377" stroke-width="2" stroke-dasharray="10 8"/>
<rect x="101" y="1042" width="205" height="34" rx="17" fill="#172033" stroke="#536377" stroke-width="2"/><text class="frameTitle" x="121" y="1064">load snapshots and head</text>
<path class="connector" data-source="javers" data-target="repository" d="M 165,1120 L 475,1120" fill="none" stroke="#5b8def" stroke-width="4" marker-end="url(#arrowBlue)"/>
<g transform="translate(230 1074)"><rect class="label" x="0" y="0" width="210" height="34" rx="17" fill="#172033" stroke="#5b8def" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#5b8def"/><text class="badgeText num" x="18" y="21" text-anchor="middle">9</text><text class="message" x="39" y="22" fill="#5b8def">loadSnapshots(GlobalId)</text></g>
<path class="connector" data-source="repository" data-target="snapshot-storage" d="M 495,1200 L 1210,1200" fill="none" stroke="#55c7e8" stroke-width="4" marker-end="url(#arrowCyan)"/>
<g transform="translate(700 1154)"><rect class="label" x="0" y="0" width="310" height="34" rx="17" fill="#172033" stroke="#55c7e8" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#55c7e8"/><text class="badgeText num" x="18" y="21" text-anchor="middle">10</text><text class="message" x="39" y="22" fill="#55c7e8">LRANGE or getAll(GlobalId)</text></g>
<path class="connector" data-source="snapshot-storage" data-target="repository" d="M 1210,1270 L 495,1270" fill="none" stroke="#55c7e8" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrowCyan)"/>
<g transform="translate(735 1224)"><rect class="label" x="0" y="0" width="240" height="34" rx="17" fill="#172033" stroke="#55c7e8" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#55c7e8"/><text class="badgeText num" x="18" y="21" text-anchor="middle">11</text><text class="message" x="39" y="22" fill="#55c7e8">stored byte arrays</text></g>
<path class="connector" data-source="repository" data-target="codec" d="M 495,1340 L 840,1340" fill="none" stroke="#4fb8a8" stroke-width="4" marker-end="url(#arrowTeal)"/>
<g transform="translate(575 1294)"><rect class="label" x="0" y="0" width="190" height="34" rx="17" fill="#172033" stroke="#4fb8a8" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#4fb8a8"/><text class="badgeText num" x="18" y="21" text-anchor="middle">12</text><text class="message" x="39" y="22" fill="#4fb8a8">decode each value</text></g>
<path class="connector" data-source="codec" data-target="repository" d="M 840,1410 L 495,1410" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrowTeal)"/>
<g transform="translate(565 1364)"><rect class="label" x="0" y="0" width="210" height="34" rx="17" fill="#172033" stroke="#4fb8a8" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#4fb8a8"/><text class="badgeText num" x="18" y="21" text-anchor="middle">13</text><text class="message" x="39" y="22" fill="#4fb8a8">decoded snapshots</text></g>
<path class="connector" data-source="repository" data-target="javers" d="M 475,1480 L 165,1480" fill="none" stroke="#5b8def" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/>
<g transform="translate(220 1434)"><rect class="label" x="0" y="0" width="235" height="34" rx="17" fill="#172033" stroke="#5b8def" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#5b8def"/><text class="badgeText num" x="18" y="21" text-anchor="middle">14</text><text class="message" x="39" y="22" fill="#5b8def">newest-first snapshots</text></g>
<path class="connector" data-source="javers" data-target="repository" d="M 165,1545 L 475,1545" fill="none" stroke="#5b8def" stroke-width="4" marker-end="url(#arrowBlue)"/>
<g transform="translate(240 1499)"><rect class="label" x="0" y="0" width="200" height="34" rx="17" fill="#172033" stroke="#5b8def" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#5b8def"/><text class="badgeText num" x="18" y="21" text-anchor="middle">15</text><text class="message" x="39" y="22" fill="#5b8def">loadHeadId()</text></g>
<path class="connector" data-source="repository" data-target="sequence-metadata" d="M 495,1605 L 1570,1605" fill="none" stroke="#d0a24c" stroke-width="4" marker-end="url(#arrowAmber)"/>
<g transform="translate(875 1559)"><rect class="label" x="0" y="0" width="310" height="34" rx="17" fill="#172033" stroke="#d0a24c" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#d0a24c"/><text class="badgeText num" x="18" y="21" text-anchor="middle">16</text><text class="message" x="39" y="22" fill="#d0a24c">read all CommitId sequences</text></g>
<path class="connector" data-source="repository" data-target="javers" d="M 475,1660 L 165,1660" fill="none" stroke="#d0a24c" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrowAmber)"/>
<g transform="translate(245 1614)"><rect class="label" x="0" y="0" width="190" height="34" rx="17" fill="#172033" stroke="#d0a24c" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#d0a24c"/><text class="badgeText num" x="18" y="21" text-anchor="middle">17</text><text class="message" x="39" y="22" fill="#d0a24c">head CommitId</text></g>

<rect x="90" y="1710" width="1660" height="52" rx="18" fill="#182331" stroke="#536377" stroke-width="2"/>
<text class="note" x="920" y="1732" text-anchor="middle">Lettuce encodes before locking and discards a failed transaction; Redisson can retain a snapshot prefix when a later write fails.</text>
<text class="note" x="920" y="1752" text-anchor="middle">Lettuce is the required adapter when commit or projection atomicity matters. Both return newest-first snapshots and restore the head by maximum sequence.</text>
</svg>
