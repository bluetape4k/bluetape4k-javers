<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1060" viewBox="0 0 1840 1060" role="img" aria-label="javers redis save load flow">
<defs>
<filter id="shadow" x="-15%" y="-15%" width="168%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#64748b" flood-opacity="0.12"/></filter>
<marker id="blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563eb" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#059669" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="amber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#d97706" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<style>
.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:40px;fill:#183247;font-weight:700}
.subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:16px;fill:#587086}
.lane{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:25px;fill:#183247;font-weight:700}
.label{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#183247;font-weight:700}
.body{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:14px;fill:#475569}
.small{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:14px;fill:#64748b}
.infra{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:21px;fill:#991b1b;font-weight:700}
</style>

<marker id="arrow06B6D4" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#06b6d4" stroke-dasharray="none" style="stroke-dasharray:none"/></marker></defs>
<rect width="1840" height="1060" rx="26" fill="#f7fafc"/>
<rect x="20" y="20" width="1800" height="1020" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text class="title" x="54" y="64">javers-persistence-redis Save / Load Flow</text>
<text class="subtitle" x="56" y="94">Snapshot writes, head metadata, newest-first reads, and codec failure boundary</text>

<rect x="70" y="130" width="1700" height="380" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="166">Save path</text>
<rect x="168" y="250" width="255" height="108" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="296" y="288" text-anchor="middle">JaVers commit</text>
<text class="body" x="196" y="318">produces CdoSnapshot</text>
<rect x="543" y="235" width="290" height="138" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="688" y="274" text-anchor="middle">Encode snapshot</text>
<text class="body" x="573" y="306">JaversCodecs.LZ4Fory</text>
<text class="body" x="573" y="325">custom ByteArray codec allowed</text>
<text class="body" x="573" y="344">failure aborts head advance</text>
<rect x="953" y="220" width="300" height="168" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1103" y="259" text-anchor="middle">Persist snapshot bytes</text>
<image data-bluetape4k-icon="redis/redis-icon" x="982" y="272" width="58" height="58" href="data:image/svg+xml;base64,"/>
<text class="infra" x="1056" y="300">Redis store</text>
<text class="body" x="983" y="346">Lettuce: LPUSH in MULTI/EXEC</text>
<text class="body" x="983" y="365">Redisson: multimap put</text>
<text class="body" x="983" y="384">keyed by GlobalId</text>
<rect x="1373" y="235" width="300" height="138" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1523" y="274" text-anchor="middle">Commit sequence</text>
<text class="body" x="1403" y="306">CommitId -> sequence</text>
<text class="body" x="1403" y="325">used by loadHeadId()</text>
<text class="body" x="1403" y="344">restores repository head</text>
<path d="M 423,304 L 543,304" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#blue)"/>
<path d="M 833,304 L 953,304" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#green)"/>
<path d="M 1253,304 L 1373,304" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#amber)"/>

<rect x="70" y="575" width="1700" height="380" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="611">Read path</text>
<rect x="168" y="700" width="255" height="108" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="296" y="738" text-anchor="middle">JaVers query</text>
<text class="body" x="196" y="768">get snapshots/history</text>
<rect x="543" y="685" width="290" height="138" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="688" y="724" text-anchor="middle">Load encoded rows</text>
<text class="body" x="573" y="756">Lettuce: LRANGE list</text>
<text class="body" x="573" y="775">Redisson: getAll multimap</text>
<text class="body" x="573" y="794">GlobalId scoped</text>
<rect x="953" y="685" width="300" height="138" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1103" y="724" text-anchor="middle">Newest first</text>
<text class="body" x="983" y="756">Lettuce list already LPUSH order</text>
<text class="body" x="983" y="775">Redisson reverses loaded entries</text>
<text class="body" x="983" y="794">contract parity verifies order</text>
<rect x="1373" y="700" width="300" height="108" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1523" y="738" text-anchor="middle">Decode result</text>
<text class="body" x="1403" y="768">ByteArray -> CdoSnapshot</text>
<path d="M 423,754 L 543,754" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#blue)"/>
<path d="M 833,754 L 953,754" fill="none" stroke="#06b6d4" stroke-width="1.8" marker-end="url(#arrow06B6D4)"/>
<path d="M 1253,754 L 1373,754" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#green)"/>
<text class="small" x="96" y="1008">Redis is the durable audit store in this module; SQL durability, projection replay, and cache invalidation belong to other modules or a future composite repository.</text>
</svg>
