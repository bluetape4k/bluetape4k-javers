<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1040" viewBox="0 0 1880 1040" role="img" aria-labelledby="title desc">
<title id="title">examples-javers-spring-boot4 wiring</title>
<desc id="desc">Explicit Spring Boot 4 application wiring for routes, command handler, order repository, Exposed database, and JaVers snapshot repository.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000814" flood-opacity="0.28"/></filter>
  <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b8def" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#55c7e8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4fb8a8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d0a24c" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d66f7e" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    .title{font-family:"Architects Daughter";font-size:52px;fill:#f8fafc}
    .subtitle,.body,.footer{font-family:"Comic Mono";fill:#d5dfeb}
    .subtitle{font-size:18px}.body{font-size:17px}.footer{font-size:15px}
    .lane{font-family:"Architects Daughter";font-size:30px;fill:#f8fafc}
    .label{font-family:"Architects Daughter";font-size:29px;fill:#f8fafc}
    .infra{font-family:"Architects Daughter";font-size:28px;fill:#f8fafc}
    .line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  </style>

<marker id="arrow4F46E5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#9b87d8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker></defs>

<rect width="1880" height="1040" rx="30" fill="#020617"/>
<rect x="24" y="24" width="1832" height="992" rx="26" fill="#172033" stroke="#536377" stroke-width="1.4"/>
<text class="title" x="60" y="82">examples-javers-spring-boot4 Wiring</text>
<text class="subtitle" x="62" y="116">The example wires Spring Boot 4, Exposed JDBC, JaVers, and the order repository explicitly.</text>

<rect x="70" y="152" width="390" height="770" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 7"/>
<text class="lane" x="100" y="196">1. HTTP API</text>
<rect class="card" x="112" y="280" width="306" height="122" rx="10" fill="#223047" stroke="#5b8def" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="265" y="318" text-anchor="middle">OrderController</text>
<text class="body" x="145" y="353">POST /orders</text>
<text class="body" x="145" y="376">GET /orders/{id}</text>
<rect class="card" x="106" y="540" width="318" height="126" rx="10" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="265" y="578" text-anchor="middle">Spring MVC</text>
<text class="body" x="136" y="612">Jakarta validation</text>
<text class="body" x="136" y="635">MockMvc integration</text>

<rect x="525" y="152" width="420" height="770" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 7"/>
<text class="lane" x="555" y="196">2. Application wiring</text>
<rect class="card" x="570" y="277" width="330" height="128" rx="10" fill="#223047" stroke="#9b87d8" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="735" y="317" text-anchor="middle">ExampleConfiguration</text>
<text class="body" x="625" y="351">Database bean</text>
<text class="body" x="625" y="374">JaVers + repository beans</text>
<rect class="card" x="575" y="555" width="320" height="142" rx="10" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="735" y="595" text-anchor="middle">Spring bean graph</text>
<text class="body" x="610" y="630">schema initializer</text>
<text class="body" x="610" y="653">OrderRepository bean</text>
<text class="body" x="610" y="676">CommandHandler bean</text>

<rect x="1010" y="152" width="390" height="770" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 7"/>
<text class="lane" x="1040" y="196">3. Order module</text>
<rect class="card" x="1030" y="280" width="350" height="122" rx="10" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="1205" y="318" text-anchor="middle">OrderCommandHandler</text>
<text class="body" x="1085" y="353">place order</text>
<text class="body" x="1085" y="376">mark paid</text>
<rect class="card" x="1030" y="562" width="350" height="136" rx="10" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="1205" y="602" text-anchor="middle">OrderRepository</text>
<text class="body" x="1084" y="637">persist command state</text>
<text class="body" x="1084" y="660">load current order</text>

<rect x="1465" y="152" width="345" height="770" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 7"/>
<text class="lane" x="1495" y="196">4. Storage / audit</text>
<g transform="translate(1538 550)">
  <rect class="card" x="8" y="0" width="220" height="132" rx="10" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#shadow)"/>
  <image data-bluetape4k-icon="libraries/exposed" x="34" y="28" width="58" height="58" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
  <text class="infra" x="150" y="76" text-anchor="middle">Exposed</text>
  <text class="infra" x="150" y="100" text-anchor="middle">DB</text>
  <text class="body" x="118" y="122" text-anchor="middle">example_order</text>
</g>
<rect class="card" x="1510" y="750" width="256" height="124" rx="10" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="1638" y="790" text-anchor="middle">JaVers audit</text>
<text class="body" x="1548" y="825">jv_commit</text>
<text class="body" x="1548" y="848">jv_snapshot</text>

<path class="line connector" d="M 265 540 L 265 402" stroke="#55c7e8" marker-end="url(#cyan)"/>
<path class="line connector" d="M 342,280 L 342,246 Q 342,234 354,234 L 1193,234 Q 1205,234 1205,246 L 1205,280" stroke="#5b8def" marker-end="url(#blue)"/>
<path class="line connector" d="M 418,375 L 480,375 Q 492,375 492,387 L 492,730 Q 492,742 504,742 L 1205,742 Q 1217,742 1217,730 L 1217,698" stroke="#5b8def" marker-end="url(#blue)"/>
<path class="line connector" d="M 735 405 L 735 555" stroke="#9b87d8" marker-end="url(#arrow4F46E5)"/>
<path class="line connector" d="M 895,590 L 968,590 Q 980,590 980,578 L 980,365 Q 980,353 992,353 L 1030,353" stroke="#9b87d8" marker-end="url(#arrow4F46E5)"/>
<path class="line connector" d="M 895 626 L 1030 626" stroke="#9b87d8" marker-end="url(#arrow4F46E5)"/>
<path class="line connector" d="M 1205 402 L 1205 562" stroke="#4fb8a8" marker-end="url(#green)"/>
<path class="line connector" d="M 1380 630 L 1538 630" stroke="#d0a24c" marker-end="url(#amber)"/>
<path class="line connector" d="M 1380,674 L 1424,674 Q 1438,674 1438,688 L 1438,798 Q 1438,812 1452,812 L 1510,812" stroke="#d66f7e" marker-end="url(#rose)"/>

<text class="footer" x="940" y="944" text-anchor="middle">Example boundary: no Redis projection, no Kafka publication, no production outbox.</text>
<text class="footer" x="940" y="970" text-anchor="middle">Tests run the REST API through Spring MVC MockMvc with the H2-backed bean graph.</text>
</svg>
