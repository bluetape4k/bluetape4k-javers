<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="860" viewBox="0 0 1560 860" role="img" aria-labelledby="title desc">
  <title id="title">javers-exposed Table ERD</title>
  <desc id="desc">Dense ERD for javers-exposed commit metadata and encoded CDO snapshot tables.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-14%" width="124%" height="136%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000814" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowJoin" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d5dfeb" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowSchema" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4fb8a8" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Comic Mono", monospace; fill: #d5dfeb; }
    .title { font-family: "Architects Daughter", cursive; font-size: 36px; fill: #f8fafc; }
    .subtitle { font-size: 14px; fill: #d5dfeb; }
    .table-title { font-family: "Architects Daughter", cursive; font-size: 22px; fill: #f8fafc; }
    .table-name { font-size: 12px; fill: #d5dfeb; }
    .head { font-size: 11px; fill: #d5dfeb; font-weight: 700; }
    .row { font-size: 12.5px; fill: #d5dfeb; }
    .note { font-size: 12px; fill: #d5dfeb; }
    .badge { font-size: 10px; fill: #f8fafc; font-weight: 700; }
    .footer { font-size: 12px; fill: #d5dfeb; }
    .frame { fill: #172033; stroke: #536377; stroke-width: 2; filter: url(#shadow); }
    .schema { fill: #223047; stroke: #4fb8a8; stroke-width: 2; }
    .commit { fill: #223047; stroke: #d0a24c; stroke-width: 2; }
    .snapshot { fill: #223047; stroke: #5b8def; stroke-width: 2; }
    .info { fill: #182331; stroke: #536377; stroke-width: 2; }
    .header { fill-opacity: 0.48; }
    .line { stroke: #536377; stroke-width: 1; opacity: 0.65; }
    .schema-line { stroke: #4fb8a8; stroke-width: 4; fill: none; marker-end: url(#arrowSchema); }
    .join-line { stroke: #d5dfeb; stroke-width: 4; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowJoin); }
    .pk { fill: #5b8def; }
    .ix { fill: #4fb8a8; }
    .join { fill: #536377; }
    .label-bg { fill: #172033; stroke: #536377; stroke-width: 1; }
  </style>

  <rect width="1560" height="860" fill="#020617"/>
  <rect class="frame" x="34" y="30" width="1492" height="790" rx="18"/>
  <text class="title" x="780" y="76" text-anchor="middle">javers-exposed Table ERD</text>
  <text class="subtitle" x="780" y="104" text-anchor="middle">Commit metadata, encoded CDO snapshots, logical join key, indexes, nullability, and query-use columns.</text>

  <g id="Schema" transform="translate(520 132)">
    <rect class="card schema" width="520" height="74" rx="10"/>
    <text class="table-title" x="260" y="28" text-anchor="middle">ExposedJaversSchema.tables</text>
    <text class="note" x="260" y="51" text-anchor="middle">CommitTableMapping + CdoSnapshotTableMapping</text>
  </g>

  <g id="CommitTable" transform="translate(72 250)">
    <rect class="card commit" width="620" height="386" rx="10"/>
    <rect class="commit header" width="620" height="62" rx="10"/>
    <text class="table-title" x="310" y="28" text-anchor="middle">CommitTableMapping</text>
    <text class="table-name" x="310" y="50" text-anchor="middle">javers_commit</text>
    <line class="line" x1="0" y1="62" x2="620" y2="62"/>
    <text class="head" x="26" y="88">KEY</text>
    <text class="head" x="90" y="88">COLUMN</text>
    <text class="head" x="260" y="88">TYPE</text>
    <text class="head" x="408" y="88">CONSTRAINT / USE</text>
    <line class="line" x1="0" y1="104" x2="620" y2="104"/>
    <line class="line" x1="78" y1="70" x2="78" y2="334"/>
    <line class="line" x1="248" y1="70" x2="248" y2="334"/>
    <line class="line" x1="396" y1="70" x2="396" y2="334"/>
    <rect class="pk" x="22" y="119" width="34" height="18" rx="9"/>
    <text class="badge" x="39" y="132" text-anchor="middle">PK</text>
    <text class="row" x="90" y="132">commit_id</text>
    <text class="row" x="260" y="132">VARCHAR(50)</text>
    <text class="row" x="408" y="132">NOT NULL; commit id unique key</text>
    <text class="row" x="90" y="166">author</text>
    <text class="row" x="260" y="166">VARCHAR(200)</text>
    <text class="row" x="408" y="166">NOT NULL; exact author filter</text>
    <text class="row" x="90" y="200">commit_date</text>
    <text class="row" x="260" y="200">DATETIME</text>
    <text class="row" x="408" y="200">NOT NULL; LocalDateTime range</text>
    <text class="row" x="90" y="234">commit_date_instant</text>
    <text class="row" x="260" y="234">VARCHAR(64)</text>
    <text class="row" x="408" y="234">NULL; Instant copy as text</text>
    <text class="row" x="90" y="268">properties</text>
    <text class="row" x="260" y="268">TEXT</text>
    <text class="row" x="408" y="268">NOT NULL; commit props JSON</text>
    <rect class="ix" x="22" y="289" width="34" height="18" rx="9"/>
    <text class="badge" x="39" y="302" text-anchor="middle">IX</text>
    <text class="row" x="90" y="302">sequence</text>
    <text class="row" x="260" y="302">LONG</text>
    <text class="row" x="408" y="302">NOT NULL DEFAULT 0; head restore</text>
    <line class="line" x1="0" y1="334" x2="620" y2="334"/>
    <text class="note" x="24" y="360">Indexes: PK javers_commit_commit_id_unique; IX ix_javers_commit_sequence.</text>
  </g>

  <g id="SnapshotTable" transform="translate(868 250)">
    <rect class="card snapshot" width="620" height="420" rx="10"/>
    <rect class="snapshot header" width="620" height="62" rx="10"/>
    <text class="table-title" x="310" y="28" text-anchor="middle">CdoSnapshotTableMapping</text>
    <text class="table-name" x="310" y="50" text-anchor="middle">javers_snapshot</text>
    <line class="line" x1="0" y1="62" x2="620" y2="62"/>
    <text class="head" x="26" y="88">KEY</text>
    <text class="head" x="90" y="88">COLUMN</text>
    <text class="head" x="260" y="88">TYPE</text>
    <text class="head" x="408" y="88">CONSTRAINT / USE</text>
    <line class="line" x1="0" y1="104" x2="620" y2="104"/>
    <line class="line" x1="78" y1="70" x2="78" y2="368"/>
    <line class="line" x1="248" y1="70" x2="248" y2="368"/>
    <line class="line" x1="396" y1="70" x2="396" y2="368"/>
    <rect class="pk" x="22" y="119" width="34" height="18" rx="9"/>
    <text class="badge" x="39" y="132" text-anchor="middle">PK</text>
    <text class="row" x="90" y="132">global_id</text>
    <text class="row" x="260" y="132">VARCHAR(200)</text>
    <text class="row" x="408" y="132">NOT NULL; JaVers GlobalId</text>
    <rect class="pk" x="22" y="153" width="34" height="18" rx="9"/>
    <text class="badge" x="39" y="166" text-anchor="middle">PK</text>
    <text class="row" x="90" y="166">version</text>
    <text class="row" x="260" y="166">LONG</text>
    <text class="row" x="408" y="166">NOT NULL; per-object version</text>
    <rect class="join" x="16" y="187" width="46" height="18" rx="9"/>
    <text class="badge" x="39" y="200" text-anchor="middle">JOIN</text>
    <text class="row" x="90" y="200">commit_id</text>
    <text class="row" x="260" y="200">VARCHAR(50)</text>
    <text class="row" x="408" y="200">NOT NULL; logical FK, indexed</text>
    <rect class="ix" x="22" y="221" width="34" height="18" rx="9"/>
    <text class="badge" x="39" y="234" text-anchor="middle">IX</text>
    <text class="row" x="90" y="234">type</text>
    <text class="row" x="260" y="234">VARCHAR(50)</text>
    <text class="row" x="408" y="234">NOT NULL; snapshot type filter</text>
    <text class="row" x="90" y="268">state</text>
    <text class="row" x="260" y="268">TEXT</text>
    <text class="row" x="408" y="268">NOT NULL; encoded CdoSnapshot</text>
    <text class="row" x="90" y="302">changed_properties</text>
    <text class="row" x="260" y="302">TEXT</text>
    <text class="row" x="408" y="302">NOT NULL; JSON array text</text>
    <rect class="ix" x="22" y="323" width="34" height="18" rx="9"/>
    <text class="badge" x="39" y="336" text-anchor="middle">IX</text>
    <text class="row" x="90" y="336">managed_type</text>
    <text class="row" x="260" y="336">VARCHAR(200)</text>
    <text class="row" x="408" y="336">NOT NULL; class pushdown</text>
    <line class="line" x1="0" y1="368" x2="620" y2="368"/>
    <text class="note" x="24" y="394">Indexes: PK ux_javers_snapshot_global_id_version; IX commit_id/type/managed_type.</text>
  </g>

  <path class="connector schema-line" d="M 650 206 L 650 218 Q 650 226 642 226 L 390 226 Q 382 226 382 234 L 382 250"/>
  <path class="connector schema-line" d="M 910 206 L 910 218 Q 910 226 918 226 L 1170 226 Q 1178 226 1178 234 L 1178 250"/>

  <path class="connector join-line" d="M 868 450 L 788 450 Q 780 450 780 442 L 780 390 Q 780 382 772 382 L 692 382"/>
  <rect class="label-bg" x="692" y="470" width="176" height="28" rx="14"/>
  <text class="note" x="780" y="488" text-anchor="middle">logical join, no FK</text>
  <text class="note" x="838" y="443">0..*</text>
  <text class="note" x="704" y="375">1</text>

  <g id="Summary" transform="translate(82 720)">
    <rect fill="#182331" stroke="#536377" stroke-width="2" width="1396" height="42" rx="12"/>
    <text class="footer" x="698" y="26" text-anchor="middle">Custom table names preserve the same logical columns; SQL pushdown uses commit_id, author, date, version, type, managed_type, skip, and limit before JSON decode.</text>
  </g>
</svg>
