<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="980" viewBox="0 0 2140 980" role="img" aria-label="javers redis repository map">
<defs>
<filter id="shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#64748b" flood-opacity="0.12"/></filter>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563eb"/></marker>
<marker id="arrowUse" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M 0 0 L 11 5.5 L 0 11 Z" fill="#475569"/></marker>
<style>
.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:40px;fill:#183247;font-weight:700}
.subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:16px;fill:#587086}
.lane{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:25px;fill:#183247;font-weight:700}
.label{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#183247;font-weight:700}
.body{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:14px;fill:#475569}
.small{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:14px;fill:#64748b}
.infra{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:24px;fill:#991b1b;font-weight:700}
</style>
</defs>
<rect width="2140" height="980" rx="26" fill="#f7fafc"/>
<rect x="20" y="20" width="2100" height="940" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text class="title" x="54" y="64">javers-persistence-redis Repository Map</text>
<text class="subtitle" x="56" y="94">Two Redis client adapters share the JaVers CDO snapshot contract and binary codec pipeline</text>

<rect x="70" y="130" width="2000" height="220" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="166">Shared JaVers repository contract</text>
<rect x="100" y="205" width="650" height="96" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="425" y="242" text-anchor="middle">AbstractCdoSnapshotRepository&lt;ByteArray&gt;</text>
<text class="body" x="150" y="272">encode/decode CdoSnapshot, shared query fallback</text>
<rect x="800" y="205" width="380" height="96" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="990" y="242" text-anchor="middle">JaversCodecs.LZ4Fory</text>
<text class="body" x="830" y="272">default binary snapshot codec</text>
<rect x="1320" y="205" width="520" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1580" y="242" text-anchor="middle">Contract parity tests</text>
<text class="body" x="1350" y="272">newest-first snapshots, head restore, codec failure safety</text>
<path d="M 750,253 L 800,253" fill="none" stroke="#059669" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 1180,253 L 1320,253" fill="none" stroke="#d97706" stroke-width="1.7" marker-end="url(#arrow)"/>

<rect x="70" y="395" width="980" height="420" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="431">Lettuce adapter</text>
<rect x="100" y="492" width="505" height="112" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="352" y="532" text-anchor="middle">LettuceCdoSnapshotRepository</text>
<text class="body" x="155" y="564">RedisClient + sync commands</text>
<text class="body" x="155" y="583">MULTI/EXEC save path with lock</text>
<rect x="720" y="468" width="285" height="82" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="862" y="504" text-anchor="middle">read commands</text>
<text class="body" x="750" y="530">hkeys, hget, lrange, llen</text>
<rect x="720" y="585" width="285" height="82" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="862" y="621" text-anchor="middle">write commands</text>
<text class="body" x="750" y="647">multi, lpush, hset, exec</text>
<rect x="390" y="712" width="300" height="64" rx="10" fill="#fff1f2" stroke="#ef4444" stroke-width="1.2" filter="url(#shadow)"/>
<g transform="translate(415 723)">
<path d="M 0 10 L 24 0 L 48 10 L 24 20 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
<path d="M 0 21 L 24 11 L 48 21 L 24 31 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
<path d="M 0 32 L 24 22 L 48 32 L 24 42 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1"/>
</g>
<text class="infra" x="575" y="747" text-anchor="middle">Redis keyspace</text>
<text class="body" x="482" y="766">hashes + per-GlobalId lists</text>
<path d="M 605,548 L 720,510" fill="none" stroke="#06b6d4" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 605,548 L 720,626" fill="none" stroke="#f97316" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 1005,509 L 1030,509 L 1030,690 L 645,690 L 645,712" fill="none" stroke="#ef4444" stroke-width="1.4" marker-end="url(#arrowUse)"/>
<path d="M 862,667 L 862,690 L 645,690 L 645,712" fill="none" stroke="#ef4444" stroke-width="1.4" marker-end="url(#arrowUse)"/>

<rect x="1090" y="395" width="980" height="420" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="1116" y="431">Redisson adapter</text>
<rect x="1145" y="492" width="430" height="112" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1360" y="532" text-anchor="middle">RedissonCdoSnapshotRepository</text>
<text class="body" x="1175" y="564">RedissonClient collections</text>
<text class="body" x="1175" y="583">reverse multimap entries on load</text>
<rect x="1740" y="468" width="285" height="82" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1882" y="504" text-anchor="middle">RListMultimap</text>
<text class="body" x="1770" y="530">snapshot bytes per GlobalId</text>
<rect x="1740" y="585" width="285" height="82" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1882" y="621" text-anchor="middle">RMap</text>
<text class="body" x="1770" y="647">CommitId to sequence Long</text>
<rect x="1410" y="712" width="300" height="64" rx="10" fill="#fff1f2" stroke="#ef4444" stroke-width="1.2" filter="url(#shadow)"/>
<g transform="translate(1435 723)">
<path d="M 0 10 L 24 0 L 48 10 L 24 20 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
<path d="M 0 21 L 24 11 L 48 21 L 24 31 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
<path d="M 0 32 L 24 22 L 48 32 L 24 42 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1"/>
</g>
<text class="infra" x="1595" y="747" text-anchor="middle">Redis keyspace</text>
<text class="body" x="1502" y="766">Redisson map + multimap</text>
<path d="M 1575,548 L 1740,510" fill="none" stroke="#06b6d4" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 1575,548 L 1740,626" fill="none" stroke="#f97316" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M 2025,509 L 2050,509 L 2050,690 L 1665,690 L 1665,712" fill="none" stroke="#ef4444" stroke-width="1.4" marker-end="url(#arrowUse)"/>
<path d="M 1882,667 L 1882,690 L 1665,690 L 1665,712" fill="none" stroke="#ef4444" stroke-width="1.4" marker-end="url(#arrowUse)"/>

<path d="M 405,350 L 405,395" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrowUse)"/>
<path d="M 1580,350 L 1580,395" fill="none" stroke="#475569" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#arrowUse)"/>
<text class="small" x="96" y="890">Use this module when Redis is the audit snapshot store. Do not use it as write-behind cache for SQL-backed JaVers audit history.</text>
</svg>
