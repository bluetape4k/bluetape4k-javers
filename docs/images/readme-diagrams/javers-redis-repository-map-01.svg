<text class="title" x="54" y="64">javers-persistence-redis Repository Map</text>
<text class="subtitle" x="56" y="94">Two Redis client adapters share the JaVers CDO snapshot contract and binary codec pipeline</text>

<rect x="70" y="130" width="2000" height="220" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6" />
<text class="lane" x="96" y="166">Shared JaVers repository contract</text>
<rect x="100" y="205" width="650" height="96" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" filter="url(#shadow)" />
<text class="label" x="425" y="242" text-anchor="middle">AbstractCdoSnapshotRepository&lt;ByteArray&gt;</text>
<text class="body" x="150" y="272">encode/decode CdoSnapshot, shared query fallback</text>
<rect x="800" y="205" width="380" height="96" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#shadow)" />
<text class="label" x="990" y="242" text-anchor="middle">JaversCodecs.LZ4Fory</text>
<text class="body" x="830" y="272">default binary snapshot codec</text>
<rect x="1320" y="205" width="520" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#shadow)" />
<text class="label" x="1580" y="242" text-anchor="middle">Contract parity tests</text>
<text class="body" x="1350" y="272">newest-first snapshots, head restore, codec failure safety</text>
<path d="M 750,253 L 800,253" fill="none" stroke="#059669" stroke-width="1.7" marker-end="url(#arrow059669)" />
<path d="M 1180,253 L 1320,253" fill="none" stroke="#d97706" stroke-width="1.7" marker-end="url(#arrowD97706)" />

<rect x="70" y="395" width="980" height="420" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6" />
<text class="lane" x="96" y="431">Lettuce adapter</text>
<rect x="100" y="492" width="505" height="112" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.2" filter="url(#shadow)" />
<text class="label" x="352" y="532" text-anchor="middle">LettuceCdoSnapshotRepository</text>
<text class="body" x="155" y="564">RedisClient + sync commands</text>
<text class="body" x="155" y="583">MULTI/EXEC save path with lock</text>
<rect x="720" y="468" width="285" height="82" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2" filter="url(#shadow)" />
<text class="label" x="862" y="504" text-anchor="middle">read commands</text>
<text class="body" x="750" y="530">hkeys, hget, lrange, llen</text>
<rect x="720" y="585" width="285" height="82" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.2" filter="url(#shadow)" />
<text class="label" x="862" y="621" text-anchor="middle">write commands</text>
<text class="body" x="750" y="647">multi, lpush, hset, exec</text>
<rect x="390" y="712" width="300" height="64" rx="10" fill="#fff1f2" stroke="#ef4444" stroke-width="1.2" filter="url(#shadow)" />
