<path d="M 1882,667 L 1882,680.8 Q 1882,690 1872.8,690 L 1673.8,690 Q 1665,689 1665,697 L 1665,712" fill="none" stroke="#ef4444" stroke-width="1.4" marker-end="url(#arrowEF4444)" />

