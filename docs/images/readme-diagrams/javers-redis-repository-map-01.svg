<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="980" viewBox="0 0 2140 980" role="img" aria-label="javers redis repository map">
<defs>
<filter id="shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000814" flood-opacity="0.28"/></filter>
<marker id="arrowUse" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#536377" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<style>
.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:40px;fill:#f8fafc;font-weight:700}
.subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:16px;fill:#d5dfeb}
.lane{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:25px;fill:#f8fafc;font-weight:700}
.label{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#f8fafc;font-weight:700}
.body{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:14px;fill:#d5dfeb}
.small{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:14px;fill:#d5dfeb}
.infra{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:24px;fill:#f8fafc;font-weight:700}
</style>

<marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4fb8a8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowCyan" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#55c7e8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d0a24c" stroke-dasharray="none" style="stroke-dasharray:none"/></marker></defs>
<rect width="2140" height="980" rx="26" fill="#020617"/>
<rect x="20" y="20" width="2100" height="940" rx="24" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="title" x="54" y="64">javers-persistence-redis Repository Map</text>
<text class="subtitle" x="56" y="94">Two Redis client adapters share the JaVers CDO snapshot contract and binary codec pipeline</text>

<rect x="70" y="130" width="2000" height="220" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="166">Shared JaVers repository contract</text>
<rect class="card" x="100" y="205" width="650" height="96" rx="10" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="425" y="242" text-anchor="middle">AbstractCdoSnapshotRepository&lt;ByteArray&gt;</text>
<text class="body" x="150" y="272">encode/decode CdoSnapshot, shared query fallback</text>
<rect class="card" x="800" y="205" width="380" height="96" rx="10" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="990" y="242" text-anchor="middle">JaversCodecs.LZ4Fory</text>
<text class="body" x="830" y="272">default binary snapshot codec</text>
<rect class="card" x="1320" y="205" width="520" height="96" rx="10" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="1580" y="242" text-anchor="middle">Shared behavior</text>
<text class="body" x="1350" y="272">newest-first reads, restored head by max sequence</text>
<path class="connector" data-source="abstract-repository" data-target="codec" d="M 750,253 L 800,253" fill="none" stroke="#4fb8a8" stroke-width="4" marker-end="url(#arrowTeal)"/>

<rect x="70" y="395" width="980" height="420" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="431">Lettuce adapter</text>
<rect class="card" x="100" y="492" width="505" height="128" rx="10" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="352" y="532" text-anchor="middle">LettuceCdoSnapshotRepository</text>
<text class="body" x="135" y="564">dedicated read + transaction connections</text>
<text class="body" x="135" y="585">locked MULTI/EXEC: commit + projection atomic</text>
<rect class="card" x="720" y="468" width="285" height="82" rx="10" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="862" y="504" text-anchor="middle">read commands</text>
<text class="body" x="750" y="530">hkeys, hget, lrange, llen</text>
<rect class="card" x="720" y="585" width="285" height="82" rx="10" fill="#182331" stroke="#d0a24c" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="862" y="621" text-anchor="middle">write commands</text>
<text class="body" x="750" y="647">multi, lpush, hset, exec</text>
<rect class="card" x="390" y="712" width="300" height="64" rx="10" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#shadow)"/>
<g transform="translate(415 723)">
<image data-bluetape4k-icon="redis/redis-icon" x="-4" y="-6" width="60" height="60" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
</g>
<text class="infra" x="575" y="747" text-anchor="middle">Redis keyspace</text>
<text class="body" x="482" y="766">hashes + per-GlobalId lists</text>
<path class="connector" data-source="lettuce-repository" data-target="read-commands" d="M 605,520 L 720,520" fill="none" stroke="#55c7e8" stroke-width="4" marker-end="url(#arrowCyan)"/>
<path class="connector" data-source="lettuce-repository" data-target="write-commands" d="M 605,585 L 665,585 Q 679,585 679,599 L 679,626 Q 679,640 693,640 L 720,640" fill="none" stroke="#d0a24c" stroke-width="4" marker-end="url(#arrowAmber)"/>
<path class="connector" data-source="read-commands" data-target="lettuce-keyspace" d="M 1005,509 L 1016,509 Q 1030,509 1030,523 L 1030,730 Q 1030,744 1016,744 L 690,744" fill="none" stroke="#55c7e8" stroke-width="4" marker-end="url(#arrowCyan)"/>
<path class="connector" data-source="write-commands" data-target="lettuce-keyspace" d="M 862,667 L 862,682 Q 862,696 848,696 L 694,696 Q 680,696 680,710 L 680,712" fill="none" stroke="#d0a24c" stroke-width="4" marker-end="url(#arrowAmber)"/>

<rect x="1090" y="395" width="980" height="420" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="1116" y="431">Redisson adapter</text>
<rect class="card" x="1145" y="492" width="430" height="128" rx="10" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="1360" y="532" text-anchor="middle">RedissonCdoSnapshotRepository</text>
<text class="body" x="1175" y="564">RListMultimap + RMap collections</text>
<text class="body" x="1175" y="585">best-effort writes; partial snapshot risk</text>
<rect class="card" x="1740" y="468" width="285" height="82" rx="10" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="1882" y="504" text-anchor="middle">RListMultimap</text>
<text class="body" x="1770" y="530">snapshot bytes per GlobalId</text>
<rect class="card" x="1740" y="585" width="285" height="82" rx="10" fill="#182331" stroke="#d0a24c" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="1882" y="621" text-anchor="middle">RMap</text>
<text class="body" x="1770" y="647">CommitId to sequence Long</text>
<rect class="card" x="1410" y="712" width="300" height="64" rx="10" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#shadow)"/>
<g transform="translate(1435 723)">
<image data-bluetape4k-icon="redis/redis-icon" x="-4" y="-6" width="60" height="60" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
</g>
<text class="infra" x="1595" y="747" text-anchor="middle">Redis keyspace</text>
<text class="body" x="1502" y="766">Redisson map + multimap</text>
<path class="connector" data-source="redisson-repository" data-target="snapshot-multimap" d="M 1575,520 L 1740,520" fill="none" stroke="#55c7e8" stroke-width="4" marker-end="url(#arrowCyan)"/>
<path class="connector" data-source="redisson-repository" data-target="sequence-map" d="M 1575,585 L 1665,585 Q 1679,585 1679,599 L 1679,626 Q 1679,640 1693,640 L 1740,640" fill="none" stroke="#d0a24c" stroke-width="4" marker-end="url(#arrowAmber)"/>
<path class="connector" data-source="snapshot-multimap" data-target="redisson-keyspace" d="M 2025,509 L 2036,509 Q 2050,509 2050,523 L 2050,730 Q 2050,744 2036,744 L 1710,744" fill="none" stroke="#55c7e8" stroke-width="4" marker-end="url(#arrowCyan)"/>
<path class="connector" data-source="sequence-map" data-target="redisson-keyspace" d="M 1882,667 L 1882,682 Q 1882,696 1868,696 L 1714,696 Q 1700,696 1700,710 L 1700,712" fill="none" stroke="#d0a24c" stroke-width="4" marker-end="url(#arrowAmber)"/>

<path class="connector" data-source="abstract-repository" data-target="lettuce-repository" d="M 352,301 L 352,492" fill="none" stroke="#536377" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#arrowUse)"/>
<path class="connector" data-source="abstract-repository" data-target="redisson-repository" d="M 700,301 L 700,360 Q 700,374 714,374 L 1346,374 Q 1360,374 1360,388 L 1360,492" fill="none" stroke="#536377" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#arrowUse)"/>
<text class="small" x="96" y="880">Lettuce provides commit/projection transaction boundaries; Redisson favors collection APIs with best-effort multi-structure writes.</text>
<text class="small" x="96" y="906">Use Redis as the audit snapshot store, not as a write-behind cache for SQL-backed JaVers audit history.</text>
</svg>
