<rect x="1090" y="395" width="980" height="420" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6" />
<text class="lane" x="1116" y="431">Redisson adapter</text>
<rect x="1145" y="492" width="430" height="112" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.2" filter="url(#shadow)" />
