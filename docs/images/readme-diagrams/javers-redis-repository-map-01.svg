<rect x="1740" y="585" width="285" height="82" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.2" filter="url(#shadow)" />
<text class="label" x="1882" y="621" text-anchor="middle">RMap</text>
<text class="body" x="1770" y="647">CommitId to sequence Long</text>
<rect x="1410" y="712" width="300" height="64" rx="10" fill="#fff1f2" stroke="#ef4444" stroke-width="1.2" filter="url(#shadow)" />
