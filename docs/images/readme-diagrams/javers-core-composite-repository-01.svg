<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1000" viewBox="0 0 1700 1000" role="img" aria-label="javers-core composite CDO snapshot repository">
<defs>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="2" flood-color="#000814" flood-opacity="0.04"/></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#5b8def" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#4fb8a8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#d0a24c" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowRose" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#d66f7e" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<style>
.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:36px;fill:#f8fafc;font-weight:700}
.subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15px;fill:#d5dfeb}
.lane{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:22px;fill:#f8fafc;font-weight:700}
.label{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:24px;fill:#f8fafc;font-weight:700}
.small{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#d5dfeb}
</style>
</defs>
<rect x="0" y="0" width="1700" height="1000" rx="26" fill="#020617"/>
<rect x="20" y="20" width="1660" height="960" rx="24" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="title" x="54" y="64">Composite CDO Snapshot Repository</text>
<text class="subtitle" x="56" y="94">Reads go to primary; writes persist primary first, then fan out to secondaries in order</text>

<rect x="70" y="132" width="1560" height="805" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="168">Runtime contract</text>

<rect class="card" x="635" y="205" width="300" height="112" rx="14" fill="#223047" stroke="#5b8def" stroke-width="2" filter="url(#softShadow)"/>
<text class="label" x="785" y="235" text-anchor="middle">Application writes</text>
<text class="small" x="661" y="263">javers.commit()</text>
<text class="small" x="661" y="281">persist(commit)</text>
<text class="small" x="661" y="299">saveSnapshot()</text>

<rect class="card" x="1105" y="618" width="300" height="112" rx="14" fill="#182331" stroke="#d0a24c" stroke-width="2" filter="url(#softShadow)"/>
<text class="label" x="1255" y="648" text-anchor="middle">JaVers reads</text>
<text class="small" x="1131" y="676">latest snapshot</text>
<text class="small" x="1131" y="694">state history</text>
<text class="small" x="1131" y="712">JQL snapshots</text>

<rect class="card" x="545" y="392" width="480" height="140" rx="16" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#softShadow)"/>
<text class="label" x="785" y="424" text-anchor="middle">Composite repository</text>
<text class="small" x="581" y="452">primary: CdoSnapshotRepository</text>
<text class="small" x="581" y="470">secondaries: ordered list</text>
<text class="small" x="581" y="488">secondary writes: FAIL_FAST / BEST_EFFORT</text>
<text class="small" x="581" y="506">not a distributed transaction</text>

<rect class="card" x="545" y="612" width="480" height="124" rx="16" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#softShadow)"/>
<image data-bluetape4k-icon="generic/database-server" x="587" y="646" width="64" height="64" href="data:image/svg+xml;base64,"/>
<text class="label" x="705" y="650">Primary repository</text>
<text class="small" x="705" y="678">read/query source of truth</text>
<text class="small" x="705" y="696">Exposed, Redis, or cache</text>

<rect class="card" x="295" y="805" width="360" height="112" rx="16" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#softShadow)"/>
<image data-bluetape4k-icon="redis/redis-icon" x="327" y="826" width="66" height="66" href="data:image/svg+xml;base64,"/>
<text class="label" x="435" y="843">Secondary projection</text>
<text class="small" x="435" y="871">Redis cache/projection target</text>
<text class="small" x="435" y="889">ordered after primary success</text>

<rect class="card" x="915" y="805" width="360" height="112" rx="16" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#softShadow)"/>
<image data-bluetape4k-icon="kafka/apache-kafka-icon" x="950" y="826" width="58" height="58" href="data:image/png;base64,"/>
<text class="label" x="1055" y="843">Secondary stream</text>
<text class="small" x="1055" y="871">Kafka write-only repository</text>
<text class="small" x="1055" y="889">replay with projector module</text>

<path class="connector" d="M 785,317 L 785,392" fill="none" stroke="#5b8def" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
<path class="connector" d="M 785,532 L 785,612" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
<path class="connector" d="M 1105,674 L 1025,674" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrowGreen)"/>
<path class="connector" d="M 685,736 L 685,756 Q 685,770 671,770 L 489,770 Q 475,770 475,784 L 475,805" fill="none" stroke="#d0a24c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)"/>
<path class="connector" d="M 885,736 L 885,756 Q 885,770 899,770 L 1081,770 Q 1095,770 1095,784 L 1095,805" fill="none" stroke="#d66f7e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRose)"/>

<text class="small" x="96" y="965">Primary remains the read source. Secondary write failures are policy-controlled, but the primary may already expose the commit.</text>
</svg>
