<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="980" viewBox="0 0 1840 980" role="img" aria-label="javers-exposed entity hook audit flow">
<defs>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="2" flood-color="#334155" flood-opacity="0.04"/></filter>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563eb" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#059669" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#ef4444" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<style>
.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:38px;fill:#183247;font-weight:700}
.subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15px;fill:#587086}
.lane{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:23px;fill:#183247;font-weight:700}
.label{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:24px;fill:#183247;font-weight:700}
.body{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#475569}
.small{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#587086}
</style>

<marker id="arrowD97706" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#d97706" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowF97316" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#f97316" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrow8B5CF6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#8b5cf6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker></defs>
<rect x="0" y="0" width="1840" height="980" rx="26" fill="#f7fafc"/>
<rect x="20" y="20" width="1800" height="940" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text class="title" x="54" y="64">javers-exposed EntityHook Audit</text>
<text class="subtitle" x="56" y="94">DAO lifecycle changes are mapped to detached audit objects; non-DAO writes are outside this hook</text>

<rect x="70" y="132" width="1698" height="710" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="168">Observed Exposed DAO transaction</text>

<rect x="120" y="305" width="260" height="122" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="250" y="343" text-anchor="middle">DAO Entity</text>
<text class="body" x="145" y="374">Created / Updated / Removed</text>
<text class="body" x="145" y="393">registered by Exposed DAO</text>

<rect x="485" y="285" width="300" height="162" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="635" y="323" text-anchor="middle">EntityHook</text>
<text class="body" x="515" y="355">global subscription</text>
<text class="body" x="515" y="374">close() unsubscribes</text>
<text class="body" x="515" y="393">ignores recursive audit guard</text>
<text class="body" x="515" y="412">uses last registered event only</text>

<rect x="890" y="285" width="300" height="162" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="1040" y="323" text-anchor="middle">Mapping</text>
<text class="body" x="920" y="355">matches configured EntityClass</text>
<text class="body" x="920" y="374">toAuditObject(entity)</text>
<text class="body" x="920" y="393">toAuditId(entityId)</text>
<text class="body" x="920" y="412">author + commit properties</text>

<rect x="1300" y="210" width="310" height="128" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="1455" y="250" text-anchor="middle">Created / Updated</text>
<text class="body" x="1330" y="281">javers.commit(author,</text>
<text class="body" x="1330" y="300">detached audit object, props)</text>

<rect x="1300" y="410" width="310" height="128" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="1455" y="450" text-anchor="middle">Removed</text>
<text class="body" x="1330" y="481">commitShallowDeleteById(</text>
<text class="body" x="1330" y="500">author, globalId, props)</text>

<rect x="1300" y="660" width="310" height="112" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="1455" y="699" text-anchor="middle">Not observed</text>
<text class="body" x="1330" y="730">raw Exposed DSL writes</text>
<text class="body" x="1330" y="749">external DB writes or CDC streams</text>

<rect x="120" y="650" width="310" height="112" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="275" y="689" text-anchor="middle">Application scope</text>
<text class="body" x="150" y="720">subscription must be closed</text>
<text class="body" x="150" y="739">when the app scope ends</text>

<path d="M 380,366 L 485,366" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 785,366 L 890,366" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowD97706)"/>
<path d="M 1190,352 L 1241,352 Q 1255,352 1255,338 L 1255,288 Q 1255,274 1269,274 L 1300,274" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<path d="M 1190,392 L 1241,392 Q 1255,392 1255,406 L 1255,460 Q 1255,474 1269,474 L 1300,474" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)"/>
<path d="M 635,447 L 635,692 Q 635,706 621,706 L 430,706" fill="none" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrowF97316)"/>
<path d="M 1040,447 L 1040,702 Q 1040,716 1054,716 L 1300,716" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow8B5CF6)"/>

<text class="small" x="96" y="900">EntityHook auditing is convenience automation for Exposed DAO entities; use explicit commits or CDC/outbox patterns for other write paths.</text>
</svg>
