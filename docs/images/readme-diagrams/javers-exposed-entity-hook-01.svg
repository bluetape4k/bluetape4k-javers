<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1280" viewBox="0 0 1840 1280" role="img" aria-label="javers-exposed EntityHook audit sequence">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="2" flood-color="#000814" flood-opacity="0.04"/></filter>
  <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b8def" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d0a24c" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrowViolet" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b87d8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4fb8a8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrowCyan" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#55c7e8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrowRose" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d66f7e" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    .title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:36px;fill:#f8fafc;font-weight:700}
    .subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15px;fill:#d5dfeb}
    .participant{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:20px;fill:#f8fafc;font-weight:700}
    .role{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#d5dfeb}
    .frameTitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;fill:#d5dfeb;font-weight:700}
    .message{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;font-weight:700}
    .badgeText{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#f8fafc;font-weight:700}
    .note{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;fill:#d5dfeb}
  </style>
</defs>

<rect x="0" y="0" width="1840" height="1280" rx="26" fill="#020617"/>
<rect class="frame" x="20" y="20" width="1800" height="1240" rx="24" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="title" x="54" y="64">javers-exposed EntityHook Audit Sequence</text>
<text class="subtitle" x="56" y="94">The subscription filters the final DAO lifecycle event, maps it, then commits a detached object or a shallow delete</text>

<rect class="card" x="55" y="142" width="220" height="92" rx="14" fill="#223047" stroke="#5b8def" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="165" y="178" text-anchor="middle">DAO Entity</text>
<text class="role" x="165" y="205" text-anchor="middle">transactional lifecycle</text>

<rect class="card" x="340" y="142" width="220" height="92" rx="14" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="450" y="178" text-anchor="middle">EntityHook</text>
<text class="role" x="450" y="205" text-anchor="middle">global callback registry</text>

<rect class="card" x="625" y="142" width="230" height="92" rx="14" fill="#223047" stroke="#9b87d8" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="740" y="178" text-anchor="middle">Subscription</text>
<text class="role" x="740" y="205" text-anchor="middle">guard and orchestration</text>

<rect class="card" x="905" y="142" width="250" height="92" rx="14" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="1030" y="178" text-anchor="middle">TransactionManager</text>
<text class="role" x="1030" y="205" text-anchor="middle">registered DAO changes</text>

<rect class="card" x="1205" y="142" width="230" height="92" rx="14" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="1320" y="178" text-anchor="middle">Mapping</text>
<text class="role" x="1320" y="205" text-anchor="middle">entity to audit model</text>

<rect class="card" x="1500" y="142" width="220" height="92" rx="14" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="1610" y="178" text-anchor="middle">JaVers</text>
<text class="role" x="1610" y="205" text-anchor="middle">terminal audit commit</text>

<g stroke="#536377" stroke-width="2" stroke-dasharray="8 8">
  <line class="lifeline" x1="165" y1="234" x2="165" y2="1145"/>
  <line class="lifeline" x1="450" y1="234" x2="450" y2="1145"/>
  <line class="lifeline" x1="740" y1="234" x2="740" y2="1145"/>
  <line class="lifeline" x1="1030" y1="234" x2="1030" y2="1145"/>
  <line class="lifeline" x1="1320" y1="234" x2="1320" y2="1145"/>
  <line class="lifeline" x1="1610" y1="234" x2="1610" y2="1145"/>
</g>

<rect class="activation" x="440" y="322" width="20" height="120" rx="8" fill="#223047" stroke="#d0a24c" stroke-width="2"/>
<rect class="activation" x="730" y="407" width="20" height="733" rx="8" fill="#223047" stroke="#9b87d8" stroke-width="2"/>
<rect class="activation" x="1020" y="497" width="20" height="110" rx="8" fill="#223047" stroke="#4fb8a8" stroke-width="2"/>
<rect class="activation" x="1310" y="637" width="20" height="503" rx="8" fill="#223047" stroke="#55c7e8" stroke-width="2"/>
<rect class="activation" x="1600" y="860" width="20" height="280" rx="8" fill="#223047" stroke="#d66f7e" stroke-width="2"/>

<path class="connector callBlue" d="M 165,340 L 440,340" fill="none" stroke="#5b8def" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
<g transform="translate(205 294)"><rect class="label" x="0" y="0" width="210" height="36" rx="18" fill="#172033" stroke="#5b8def" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#5b8def"/><text class="badgeText" x="19" y="22" text-anchor="middle">1</text><text class="message" x="42" y="23" fill="#5b8def">lifecycle change</text></g>

<path class="connector callAmber" d="M 460,425 L 730,425" fill="none" stroke="#d0a24c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
<g transform="translate(495 379)"><rect class="label" x="0" y="0" width="200" height="36" rx="18" fill="#172033" stroke="#d0a24c" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#d0a24c"/><text class="badgeText" x="19" y="22" text-anchor="middle">2</text><text class="message" x="42" y="23" fill="#d0a24c">handle(change)</text></g>

<path class="connector call" d="M 750,520 L 1020,520" fill="none" stroke="#9b87d8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowViolet)"/>
<g transform="translate(785 474)"><rect class="label" x="0" y="0" width="205" height="36" rx="18" fill="#172033" stroke="#9b87d8" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#9b87d8"/><text class="badgeText" x="19" y="22" text-anchor="middle">3</text><text class="message" x="42" y="23" fill="#9b87d8">registeredChanges()</text></g>

<path class="connector callGreen" d="M 1020,585 L 750,585" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowGreen)"/>
<g transform="translate(790 539)"><rect class="label" x="0" y="0" width="195" height="36" rx="18" fill="#172033" stroke="#4fb8a8" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#4fb8a8"/><text class="badgeText" x="19" y="22" text-anchor="middle">4</text><text class="message" x="42" y="23" fill="#4fb8a8">last event check</text></g>

<path class="connector async" d="M 750,660 L 1310,660" fill="none" stroke="#55c7e8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCyan)"/>
<g transform="translate(920 614)"><rect class="label" x="0" y="0" width="220" height="36" rx="18" fill="#172033" stroke="#55c7e8" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#55c7e8"/><text class="badgeText" x="19" y="22" text-anchor="middle">5</text><text class="message" x="42" y="23" fill="#55c7e8">matches(change)</text></g>

<path class="connector callGreen" d="M 1310,720 L 750,720" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowGreen)"/>
<g transform="translate(930 674)"><rect class="label" x="0" y="0" width="200" height="36" rx="18" fill="#172033" stroke="#4fb8a8" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#4fb8a8"/><text class="badgeText" x="19" y="22" text-anchor="middle">6</text><text class="message" x="42" y="23" fill="#4fb8a8">configured mapping</text></g>

<rect class="alt" x="685" y="758" width="990" height="382" rx="18" fill="none" stroke="#536377" stroke-width="2" stroke-dasharray="10 8"/>
<rect x="701" y="770" width="274" height="32" rx="16" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="frameTitle" x="721" y="791">alt Created or Updated DAO event</text>

<path class="connector async" d="M 750,850 L 1310,850" fill="none" stroke="#55c7e8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCyan)"/>
<g transform="translate(990 804)"><rect class="label" x="0" y="0" width="220" height="36" rx="18" fill="#172033" stroke="#55c7e8" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#55c7e8"/><text class="badgeText" x="19" y="22" text-anchor="middle">7</text><text class="message" x="42" y="23" fill="#55c7e8">toAuditObject(change)</text></g>

<path class="connector async" d="M 1310,900 L 750,900" fill="none" stroke="#55c7e8" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowCyan)"/>
<g transform="translate(925 854)"><rect class="label" x="0" y="0" width="210" height="36" rx="18" fill="#172033" stroke="#55c7e8" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#55c7e8"/><text class="badgeText" x="19" y="22" text-anchor="middle">8</text><text class="message" x="42" y="23" fill="#55c7e8">detached audit object</text></g>

<path class="connector callRed" d="M 750,950 L 1600,950" fill="none" stroke="#d66f7e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRose)"/>
<g transform="translate(1080 904)"><rect class="label" x="0" y="0" width="200" height="36" rx="18" fill="#172033" stroke="#d66f7e" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#d66f7e"/><text class="badgeText" x="19" y="22" text-anchor="middle">9</text><text class="message" x="42" y="23" fill="#d66f7e">commit(author, object)</text></g>

<line class="branchDivider" x1="685" y1="975" x2="1675" y2="975" stroke="#536377" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="701" y="987" width="174" height="30" rx="15" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="frameTitle" x="721" y="1008">else Removed event</text>

<path class="connector callRed" d="M 750,1048 L 1310,1048" fill="none" stroke="#d66f7e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRose)"/>
<g transform="translate(920 1002)"><rect class="label" x="0" y="0" width="220" height="36" rx="18" fill="#172033" stroke="#d66f7e" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#d66f7e"/><text class="badgeText" x="19" y="22" text-anchor="middle">10</text><text class="message" x="42" y="23" fill="#d66f7e">toGlobalId(change)</text></g>

<path class="connector callRed" d="M 1310,1095 L 750,1095" fill="none" stroke="#d66f7e" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowRose)"/>
<g transform="translate(930 1052)"><rect class="label" x="0" y="0" width="200" height="34" rx="17" fill="#172033" stroke="#d66f7e" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#d66f7e"/><text class="badgeText" x="18" y="21" text-anchor="middle">11</text><text class="message" x="40" y="22" fill="#d66f7e">GlobalIdDTO</text></g>

<path class="connector callRed" d="M 750,1130 L 1600,1130" fill="none" stroke="#d66f7e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRose)"/>
<g transform="translate(1050 1087)"><rect class="label" x="0" y="0" width="270" height="34" rx="17" fill="#172033" stroke="#d66f7e" stroke-width="2"/><circle cx="18" cy="17" r="13" fill="#d66f7e"/><text class="badgeText" x="18" y="21" text-anchor="middle">12</text><text class="message" x="42" y="22" fill="#d66f7e">commitShallowDeleteById</text></g>

<rect x="90" y="1175" width="1660" height="54" rx="18" fill="#182331" stroke="#536377" stroke-width="2"/>
<text class="note" x="920" y="1208" text-anchor="middle">Close the subscription with the application scope. Raw DSL writes, external database writes, and CDC streams are not observed.</text>
</svg>
