<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1040" viewBox="0 0 1880 1040" role="img" aria-labelledby="title desc">
<title id="title">examples-javers-ktor wiring</title>
<desc id="desc">Explicit Ktor application wiring for routes, command handler, order repository, Exposed database, and JaVers snapshot repository.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#94a3b8" flood-opacity="0.22"/></filter>
  <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#e11d48" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    .title{font-family:"Architects Daughter";font-size:52px;fill:#172033}
    .subtitle,.body,.footer{font-family:"Comic Mono";fill:#475569}
    .subtitle{font-size:18px}.body{font-size:17px}.footer{font-size:15px}
    .lane{font-family:"Architects Daughter";font-size:30px;fill:#172033}
    .label{font-family:"Architects Daughter";font-size:29px;fill:#172033}
    .infra{font-family:"Architects Daughter";font-size:28px;fill:#111827}
    .line{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  </style>

<marker id="arrow4F46E5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#4f46e5" stroke-dasharray="none" style="stroke-dasharray:none"/></marker></defs>

<rect width="1880" height="1040" rx="30" fill="#f8fafc"/>
<rect x="24" y="24" width="1832" height="992" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text class="title" x="60" y="82">examples-javers-ktor Wiring</text>
<text class="subtitle" x="62" y="116">The example wires Ktor, Exposed JDBC, JaVers, and the order repository explicitly.</text>

<rect x="70" y="152" width="390" height="770" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="100" y="196">1. HTTP API</text>
<rect x="112" y="280" width="306" height="122" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="265" y="318" text-anchor="middle">Ktor routes</text>
<text class="body" x="145" y="353">POST /orders</text>
<text class="body" x="145" y="376">GET /orders/{id}</text>
<rect x="106" y="540" width="318" height="126" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="265" y="578" text-anchor="middle">Ktor core</text>
<text class="body" x="136" y="612">JSON error responses</text>
<text class="body" x="136" y="635">/healthz and /readyz</text>

<rect x="525" y="152" width="420" height="770" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="555" y="196">2. Application wiring</text>
<rect x="590" y="250" width="290" height="128" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="735" y="290" text-anchor="middle">javersKtorModule</text>
<text class="body" x="625" y="324">install Ktor core</text>
<text class="body" x="625" y="347">register order routes</text>
<rect x="575" y="555" width="320" height="142" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="735" y="595" text-anchor="middle">createExampleServices</text>
<text class="body" x="610" y="630">create H2 Database</text>
<text class="body" x="610" y="653">create schemas</text>
<text class="body" x="610" y="676">build Javers + repo</text>

<rect x="1010" y="152" width="390" height="770" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="1040" y="196">3. Order module</text>
<rect x="1052" y="270" width="306" height="122" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1205" y="308" text-anchor="middle">OrderCommandHandler</text>
<text class="body" x="1085" y="343">place order</text>
<text class="body" x="1085" y="366">mark paid</text>
<rect x="1050" y="562" width="310" height="136" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1205" y="602" text-anchor="middle">OrderRepository</text>
<text class="body" x="1084" y="637">persist command state</text>
<text class="body" x="1084" y="660">load current order</text>

<rect x="1465" y="152" width="345" height="770" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="1495" y="196">4. Storage / audit</text>
<g transform="translate(1538 278)">
  <rect x="8" y="0" width="220" height="132" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
  <image data-bluetape4k-icon="libraries/exposed" x="34" y="28" width="58" height="58" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
  <text class="infra" x="150" y="76" text-anchor="middle">Exposed</text>
  <text class="infra" x="150" y="100" text-anchor="middle">DB</text>
  <text class="body" x="118" y="122" text-anchor="middle">example_order</text>
</g>
<rect x="1510" y="572" width="256" height="124" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1638" y="612" text-anchor="middle">JaVers audit</text>
<text class="body" x="1548" y="647">jv_commit</text>
<text class="body" x="1548" y="670">jv_snapshot</text>

<path class="line" d="M 418,341 L 534.2,341 Q 545,341 545,330.2 L 545,324.8 Q 545,314 555.8,314 L 590,314" stroke="#2563eb" marker-end="url(#blue)"/>
<path class="line" d="M 735 378 L 735 555" stroke="#4f46e5" marker-end="url(#arrow4F46E5)"/>
<path class="line" d="M 880,314 L 1052,314" stroke="#2563eb" marker-end="url(#blue)"/>
<path class="line" d="M 1205 392 L 1205 562" stroke="#059669" marker-end="url(#green)"/>
<path class="line" d="M 1360,630 L 1416,630 Q 1430,630 1430,616 L 1430,372 Q 1430,358 1444,358 L 1538,358" stroke="#d97706" marker-end="url(#amber)"/>
<path class="line" d="M 1360,646 L 1510,646" stroke="#e11d48" marker-end="url(#rose)"/>
<path class="line" d="M 895,626 L 1050,626" stroke="#059669" marker-end="url(#green)"/>

<text class="footer" x="940" y="944" text-anchor="middle">Example boundary: no Redis projection, no Kafka publication, no production outbox.</text>
<text class="footer" x="940" y="970" text-anchor="middle">Tests run the same module through Ktor testApplication with isolated H2 database names.</text>
</svg>
