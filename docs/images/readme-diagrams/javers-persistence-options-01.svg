<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="820" viewBox="0 0 1700 820" role="img" aria-label="JaVers Persistence Options">
<defs>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="2" flood-color="#334155" flood-opacity="0.04"/></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="7" orient="auto">
<path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563eb" stroke-dasharray="none"/>
</marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="7" orient="auto">
<path d="M 0 0 L 14 7 L 0 14 Z" fill="#059669" stroke-dasharray="none"/>
</marker>
<marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="7" orient="auto">
<path d="M 0 0 L 14 7 L 0 14 Z" fill="#d97706" stroke-dasharray="none"/>
</marker>
<marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="7" orient="auto">
<path d="M 0 0 L 14 7 L 0 14 Z" fill="#7c3aed" stroke-dasharray="none"/>
</marker>
<marker id="arrowRose" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="7" orient="auto">
<path d="M 0 0 L 14 7 L 0 14 Z" fill="#e11d48" stroke-dasharray="none"/>
</marker>
<marker id="arrowCyan" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="7" orient="auto">
<path d="M 0 0 L 14 7 L 0 14 Z" fill="#0891b2" stroke-dasharray="none"/>
</marker>
<style>
.title{font-family:'Architects Daughter', 'Comic Sans MS', cursive;font-size:34px;fill:#183247;font-weight:700}
.subtitle{font-family:'Comic Mono', 'Comic Sans MS', 'DejaVu Sans', sans-serif;font-size:15px;fill:#587086}
.label{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:23px;fill:#183247;font-weight:700}
.small{font-family:'Comic Mono', 'Comic Sans MS', 'DejaVu Sans', sans-serif;font-size:12px;fill:#587086}
.tiny{font-family:'Comic Mono', 'Comic Sans MS', 'DejaVu Sans', sans-serif;font-size:11px;fill:#587086}
.lane{font-family:'Architects Daughter', 'Comic Sans MS', cursive;font-size:21px;fill:#183247;font-weight:700}
</style>
</defs>
<rect x="0" y="0" width="1700" height="820" rx="26" fill="#f7fafc"/>
<rect x="20" y="20" width="1660" height="780" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text class="title" x="54" y="62">JaVers Persistence Options</text>
<text class="subtitle" x="56" y="90">Choose the durable snapshot store and add cache or stream roles deliberately</text>
<rect x="60" y="122" width="1580" height="570" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="84" y="156">Reader contract: one authoritative path, optional supporting adapters</text>
<g transform="translate(0,50)">
<rect x="110" y="300" width="300" height="136" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="260.0" y="328" text-anchor="middle">Application with JaVers</text>
<text class="small" x="132" y="354">diffs objects</text>
<text class="small" x="132" y="372">commits snapshots</text>
<text class="small" x="132" y="390">queries history</text>
<rect x="520" y="180" width="320" height="138" rx="16" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#softShadow)"/>
<path d="M 546,227.0 v44 c0,8 15,13 34,13 s34,-5 34,-13 v-44" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
<ellipse cx="580" cy="227.0" rx="34" ry="13" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
<path d="M 546,250.0 c0,8 15,13 34,13 s34,-5 34,-13" fill="none" stroke="#059669" stroke-width="1.2"/>
<text class="label" x="650" y="211">Exposed JDBC</text>
<text class="small" x="650" y="238">authoritative SQL</text>
<text class="small" x="650" y="256">schema + indexes</text>
<text class="small" x="650" y="274">fast audit reads</text>
<rect x="520" y="430" width="320" height="138" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#softShadow)"/>
<rect x="546" y="464.0" width="70" height="20" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<circle cx="559" cy="474.0" r="3" fill="#d97706"/>
<rect x="546" y="478.0" width="70" height="20" rx="5" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
<circle cx="559" cy="488.0" r="3" fill="#d97706"/>
<rect x="546" y="492.0" width="70" height="20" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<circle cx="559" cy="502.0" r="3" fill="#d97706"/>
<text class="label" x="650" y="461">Redis adapters</text>
<text class="small" x="650" y="488">Lettuce / Redisson</text>
<text class="small" x="650" y="506">snapshot state</text>
<text class="small" x="650" y="524">head + sequence</text>
<rect x="940" y="180" width="320" height="138" rx="16" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.2" filter="url(#softShadow)"/>
<path d="M 986,228.0 L 1024,228.0" stroke="#e11d48" stroke-width="1.2" stroke-linecap="round"/>
<path d="M 986,228.0 L 1005,266.0" stroke="#e11d48" stroke-width="1.2" stroke-linecap="round"/>
<path d="M 1024,228.0 L 1005,266.0" stroke="#e11d48" stroke-width="1.2" stroke-linecap="round"/>
<circle cx="986" cy="228.0" r="12" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
<circle cx="1024" cy="228.0" r="12" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
<circle cx="1005" cy="266.0" r="12" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
<text class="label" x="1066" y="211">Kafka persistence</text>
<text class="small" x="1066" y="238">event stream</text>
<text class="small" x="1066" y="256">projection input</text>
<text class="small" x="1066" y="274">not query store</text>
<rect x="940" y="430" width="320" height="138" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="1100.0" y="458" text-anchor="middle">Cache delegates</text>
<text class="small" x="962" y="484">Caffeine / Cache2k / JCache</text>
<text class="small" x="962" y="502">read acceleration</text>
<text class="small" x="962" y="520">behind primary semantics</text>
<rect x="1380" y="310" width="250" height="150" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="1505.0" y="338" text-anchor="middle">Consumer decision</text>
<text class="small" x="1402" y="364">SQL for queries</text>
<text class="small" x="1402" y="382">Redis for low-latency state</text>
<text class="small" x="1402" y="400">Kafka for audit events</text>
<path d="M 410,368 L 465,368 L 465,249 L 520,249" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<path d="M 410,368 L 465,368 L 465,499 L 520,499" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)"/>
<path d="M 840,249 L 940,249" fill="none" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRose)"/>
<path d="M 840,499 L 940,499" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)" stroke-dasharray="7 5"/>
<path d="M 1260,249 L 1318,249 L 1318,385 L 1380,385" fill="none" stroke="#e11d48" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRose)"/>
<path d="M 1260,499 L 1318,499 L 1318,385 L 1380,385" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)" stroke-dasharray="7 5"/>
<path d="M 840,249 L 890,249 L 890,385 L 1380,385" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
</g>
<text class="small" x="92" y="688">Rule of thumb: Exposed owns SQL query history, Redis owns low-latency snapshot state, Kafka owns event delivery. Cache delegates must not replace primary semantics.</text>
</svg>
