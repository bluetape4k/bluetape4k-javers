<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1040" viewBox="0 0 1880 1040" role="img" aria-label="javers-exposed class diagram">
<defs>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="2" flood-color="#334155" flood-opacity="0.04"/></filter>
<marker id="arrowInherit" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto"><path d="M 12 6.5 L 1 1 L 1 12 Z" fill="#ffffff" stroke="#475569" stroke-width="1.25" stroke-dasharray="none"/></marker>
<marker id="arrowUse" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M 0 0 L 11 5.5 L 0 11 Z" fill="#2563eb" stroke-dasharray="none"/></marker>
<style>
.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:38px;fill:#183247;font-weight:700}
.subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15px;fill:#587086}
.lane{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:23px;fill:#183247;font-weight:700}
.className{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:23px;fill:#183247;font-weight:700}
.stereo{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:11px;fill:#64748b}
.member{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#475569}
.small{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#587086}
</style>
</defs>
<rect x="0" y="0" width="1880" height="1040" rx="26" fill="#f7fafc"/>
<rect x="20" y="20" width="1840" height="1000" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text class="title" x="54" y="64">javers-exposed Class Diagram</text>
<text class="subtitle" x="56" y="94">Repository inheritance, Exposed schema options, and concrete table mappings</text>

<rect x="70" y="132" width="760" height="780" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="168">JaVers repository implementation</text>

<rect x="175" y="212" width="520" height="124" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="stereo" x="435" y="238" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
<text class="className" x="435" y="266" text-anchor="middle">AbstractCdoSnapshotRepository&lt;String&gt;</text>
<path d="M 175,284 H695" stroke="#bae6fd" stroke-width="1"/>
<text class="member" x="198" y="309">+ encode(snapshot), decode(state)</text>
<text class="member" x="198" y="327">+ shared JaVers query fallback</text>

<rect x="165" y="462" width="540" height="196" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="className" x="435" y="496" text-anchor="middle">ExposedCdoSnapshotRepository</text>
<path d="M 165,514 H705" stroke="#fbcfe8" stroke-width="1"/>
<text class="member" x="188" y="539">+ ensureSchema()</text>
<text class="member" x="188" y="557">+ saveSnapshot(snapshot)</text>
<text class="member" x="188" y="575">+ loadSnapshots(globalId)</text>
<text class="member" x="188" y="593">+ getStateHistory(...), getSnapshots(...)</text>
<text class="member" x="188" y="611">- joinedSnapshotQuery(predicate)</text>
<text class="member" x="188" y="629">- inTransaction { ... }</text>

<rect x="235" y="745" width="400" height="96" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="className" x="435" y="782" text-anchor="middle">JaversCodec&lt;String&gt;</text>
<path d="M 235,800 H635" stroke="#bbf7d0" stroke-width="1"/>
<text class="member" x="258" y="822">default: JaversCodecs.String</text>

<rect x="915" y="132" width="890" height="780" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="941" y="168">Schema configuration and table mapping</text>

<rect x="975" y="218" width="355" height="130" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="className" x="1152" y="252" text-anchor="middle">Repository Options</text>
<path d="M 975,270 H1330" stroke="#fde68a" stroke-width="1"/>
<text class="member" x="998" y="296">+ tableNames</text>
<text class="member" x="998" y="314">+ createSchemaOnEnsure</text>
<text class="member" x="998" y="332">+ newSchema()</text>

<rect x="1410" y="218" width="330" height="130" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="className" x="1575" y="252" text-anchor="middle">Table Names</text>
<path d="M 1410,270 H1740" stroke="#cffafe" stroke-width="1"/>
<text class="member" x="1433" y="296">+ commitTableName</text>
<text class="member" x="1433" y="314">+ snapshotTableName</text>

<rect x="1120" y="462" width="440" height="130" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="className" x="1340" y="496" text-anchor="middle">ExposedJaversSchema</text>
<path d="M 1120,514 H1560" stroke="#ddd6fe" stroke-width="1"/>
<text class="member" x="1143" y="540">+ commitTable: CommitTableMapping</text>
<text class="member" x="1143" y="558">+ snapshotTable: CdoSnapshotTableMapping</text>
<text class="member" x="1143" y="576">+ tables: Array&lt;Table&gt;</text>

<rect x="975" y="735" width="360" height="112" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="className" x="1155" y="772" text-anchor="middle">CommitTableMapping</text>
<path d="M 975,790 H1335" stroke="#cbd5e1" stroke-width="1"/>
<text class="member" x="998" y="813">PK commit_id</text>
<text class="member" x="998" y="831">author, commit_date, properties, sequence</text>

<rect x="1420" y="735" width="360" height="112" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="className" x="1600" y="772" text-anchor="middle">CdoSnapshotTableMapping</text>
<path d="M 1420,790 H1780" stroke="#bfdbfe" stroke-width="1"/>
<text class="member" x="1443" y="813">PK global_id + version</text>
<text class="member" x="1443" y="831">commit_id, type, state, changed, managed_type</text>

<path d="M 435,462 L 435,336" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrowInherit)"/>
<path d="M 435,658 L 435,745" fill="none" stroke="#059669" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrowUse)"/>
<path d="M 705,548 L 875,548 L 875,283 L 975,283" fill="none" stroke="#d97706" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrowUse)"/>
<path d="M 1330,283 L 1410,283" fill="none" stroke="#06b6d4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowUse)"/>
<path d="M 1152,348 L 1152,404 L 1340,404 L 1340,462" fill="none" stroke="#8b5cf6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowUse)"/>
<path d="M 1340,592 L 1340,670 L 1155,670 L 1155,735" fill="none" stroke="#475569" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowUse)"/>
<path d="M 1340,592 L 1340,670 L 1600,670 L 1600,735" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowUse)"/>

<text class="small" x="96" y="962">Hollow arrow shows inheritance. Dashed arrows show construction/use dependencies; table mappings own SQL names and keys.</text>
</svg>
