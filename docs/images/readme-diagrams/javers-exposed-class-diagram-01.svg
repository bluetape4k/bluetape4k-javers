<text class="title" x="54" y="64">javers-exposed Class Diagram</text>
<text class="subtitle" x="56" y="94">Repository inheritance, Exposed schema options, and concrete table mappings</text>

<rect x="70" y="132" width="760" height="780" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="168">JaVers repository implementation</text>

<rect class="card" x="175" y="212" width="520" height="124" rx="10" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#softShadow)"/>
<text class="stereo" x="435" y="238" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
<text class="className" x="435" y="266" text-anchor="middle">AbstractCdoSnapshotRepository&lt;String&gt;</text>
<path d="M 175,284 H695" stroke="#536377" stroke-width="1"/>
<text class="member" x="198" y="309">+ encode(snapshot), decode(state)</text>
<text class="member" x="198" y="327">+ shared JaVers query fallback</text>

<rect class="card" x="165" y="462" width="540" height="196" rx="10" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#softShadow)"/>
<text class="className" x="435" y="496" text-anchor="middle">ExposedCdoSnapshotRepository</text>
<path d="M 165,514 H705" stroke="#536377" stroke-width="1"/>
<text class="member" x="188" y="539">+ ensureSchema()</text>
<text class="member" x="188" y="557">+ saveSnapshot(snapshot)</text>
<text class="member" x="188" y="575">+ loadSnapshots(globalId)</text>
<text class="member" x="188" y="593">+ getStateHistory(...), getSnapshots(...)</text>
<text class="member" x="188" y="611">- joinedSnapshotQuery(predicate)</text>
<text class="member" x="188" y="629">- inTransaction { ... }</text>

<rect class="card" x="235" y="745" width="400" height="96" rx="10" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#softShadow)"/>
<text class="className" x="435" y="782" text-anchor="middle">JaversCodec&lt;String&gt;</text>
<path d="M 235,800 H635" stroke="#536377" stroke-width="1"/>
<text class="member" x="258" y="822">default: JaversCodecs.String</text>

<rect x="915" y="132" width="890" height="780" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="941" y="168">Schema configuration and table mapping</text>

<rect class="card" x="975" y="218" width="355" height="130" rx="10" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#softShadow)"/>
<text class="classNameSmall" x="1152" y="252" text-anchor="middle">ExposedCdoSnapshotRepositoryOptions</text>
<path d="M 975,270 H1330" stroke="#536377" stroke-width="1"/>
<text class="member" x="998" y="296">+ tableNames</text>
<text class="member" x="998" y="314">+ createSchemaOnEnsure</text>
<text class="member" x="998" y="332">+ newSchema()</text>

<rect class="card" x="1410" y="218" width="330" height="130" rx="10" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#softShadow)"/>
<text class="classNameSmall" x="1575" y="252" text-anchor="middle">ExposedJaversTableNames</text>
<path d="M 1410,270 H1740" stroke="#536377" stroke-width="1"/>
<text class="member" x="1433" y="296">+ commitTableName</text>
<text class="member" x="1433" y="314">+ snapshotTableName</text>

<rect class="card" x="1120" y="462" width="440" height="130" rx="10" fill="#223047" stroke="#9b87d8" stroke-width="2" filter="url(#softShadow)"/>
<text class="className" x="1340" y="496" text-anchor="middle">ExposedJaversSchema</text>
<path d="M 1120,514 H1560" stroke="#536377" stroke-width="1"/>
<text class="member" x="1143" y="540">+ commitTable: CommitTableMapping</text>
<text class="member" x="1143" y="558">+ snapshotTable: CdoSnapshotTableMapping</text>
<text class="member" x="1143" y="576">+ tables: Array&lt;Table&gt;</text>

<rect class="card" x="975" y="735" width="360" height="130" rx="10" fill="#223047" stroke="#536377" stroke-width="2" filter="url(#softShadow)"/>
<text class="className" x="1155" y="772" text-anchor="middle">CommitTableMapping</text>
<path d="M 975,790 H1335" stroke="#536377" stroke-width="1"/>
<text class="member" x="998" y="813">PK commit_id</text>
<text class="member" x="998" y="831">author, commit_date, commit_date_instant</text>
<text class="member" x="998" y="849">properties, sequence</text>

<rect class="card" x="1420" y="735" width="360" height="130" rx="10" fill="#223047" stroke="#5b8def" stroke-width="2" filter="url(#softShadow)"/>
<text class="className" x="1600" y="772" text-anchor="middle">CdoSnapshotTableMapping</text>
<path d="M 1420,790 H1780" stroke="#536377" stroke-width="1"/>
<text class="member" x="1443" y="813">PK global_id + version</text>
<text class="member" x="1443" y="831">commit_id, type, state</text>
<text class="member" x="1443" y="849">changed_properties, managed_type</text>

