<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-label="javers-ddd save sequence">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="2" flood-color="#000814" flood-opacity="0.04"/></filter>
  <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b8def" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4fb8a8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d0a24c" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrowRose" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d66f7e" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrowViolet" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b87d8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrowCyan" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#55c7e8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    .title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:36px;fill:#f8fafc;font-weight:700}
    .subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15px;fill:#d5dfeb}
    .participant{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:21px;fill:#f8fafc;font-weight:700}
    .role{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#d5dfeb}
    .frameTitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;fill:#d5dfeb;font-weight:700}
    .message{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;font-weight:700}
    .badgeText{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#f8fafc;font-weight:700}
    .note{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;fill:#d5dfeb}
  </style>
</defs>

<rect x="0" y="0" width="1800" height="1200" rx="26" fill="#020617"/>
<rect class="frame" x="20" y="20" width="1760" height="1160" rx="24" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="title" x="54" y="64">javers-ddd Save Sequence</text>
<text class="subtitle" x="56" y="94">Source persistence and the JaVers commit finish before AggregateRepository invokes the domain-event publisher</text>

<rect class="card" x="70" y="142" width="220" height="92" rx="14" fill="#223047" stroke="#5b8def" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="180" y="178" text-anchor="middle">Application</text>
<text class="role" x="180" y="205" text-anchor="middle">caller / transaction owner</text>

<rect class="card" x="355" y="142" width="250" height="92" rx="14" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="480" y="178" text-anchor="middle">AggregateRepository</text>
<text class="role" x="480" y="205" text-anchor="middle">save orchestration</text>

<rect class="card" x="680" y="142" width="220" height="92" rx="14" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="790" y="178" text-anchor="middle">Source Store</text>
<text class="role" x="790" y="205" text-anchor="middle">application state</text>

<rect class="card" x="975" y="142" width="220" height="92" rx="14" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="1085" y="178" text-anchor="middle">JaVers</text>
<text class="role" x="1085" y="205" text-anchor="middle">audit snapshots</text>

<rect class="card" x="1250" y="142" width="250" height="92" rx="14" fill="#223047" stroke="#9b87d8" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="1375" y="178" text-anchor="middle">DomainEventPublisher</text>
<text class="role" x="1375" y="205" text-anchor="middle">synchronous contract</text>

<rect class="card" x="1560" y="142" width="190" height="92" rx="14" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="1655" y="178" text-anchor="middle">Delivery Target</text>
<text class="role" x="1655" y="205" text-anchor="middle">listener / broker</text>

<g stroke="#536377" stroke-width="2" stroke-dasharray="8 8">
  <line class="lifeline" x1="180" y1="234" x2="180" y2="1060"/>
  <line class="lifeline" x1="480" y1="234" x2="480" y2="1060"/>
  <line class="lifeline" x1="790" y1="234" x2="790" y2="1060"/>
  <line class="lifeline" x1="1085" y1="234" x2="1085" y2="1060"/>
  <line class="lifeline" x1="1375" y1="234" x2="1375" y2="1060"/>
  <line class="lifeline" x1="1655" y1="234" x2="1655" y2="1060"/>
</g>

<rect class="activation" x="470" y="320" width="20" height="590" rx="8" fill="#223047" stroke="#d66f7e" stroke-width="2"/>
<rect class="activation" x="780" y="438" width="20" height="105" rx="8" fill="#223047" stroke="#4fb8a8" stroke-width="2"/>
<rect class="activation" x="1075" y="580" width="20" height="105" rx="8" fill="#223047" stroke="#d0a24c" stroke-width="2"/>
<rect class="activation" x="1365" y="785" width="20" height="275" rx="8" fill="#223047" stroke="#9b87d8" stroke-width="2"/>
<rect class="activation" x="1645" y="912" width="20" height="148" rx="8" fill="#223047" stroke="#55c7e8" stroke-width="2"/>

<path class="connector callBlue" d="M 180,340 L 470,340" fill="none" stroke="#5b8def" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
<g transform="translate(245 294)">
  <rect class="label" x="0" y="0" width="250" height="36" rx="18" fill="#172033" stroke="#5b8def" stroke-width="2"/>
  <circle cx="19" cy="18" r="14" fill="#5b8def"/><text class="badgeText" x="19" y="22" text-anchor="middle">1</text>
  <text class="message" x="42" y="23" fill="#5b8def">save(aggregate, author, events)</text>
</g>

<rect x="430" y="385" width="705" height="342" rx="18" fill="none" stroke="#536377" stroke-width="2" stroke-dasharray="10 8"/>
<rect x="446" y="397" width="340" height="34" rx="17" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="frameTitle" x="466" y="419">saveAuditBoundary - override for a shared transaction</text>

<path class="connector callGreen" d="M 490,470 L 780,470" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
<g transform="translate(555 424)">
  <rect class="label" x="0" y="0" width="186" height="36" rx="18" fill="#172033" stroke="#4fb8a8" stroke-width="2"/>
  <circle cx="19" cy="18" r="14" fill="#4fb8a8"/><text class="badgeText" x="19" y="22" text-anchor="middle">2</text>
  <text class="message" x="42" y="23" fill="#4fb8a8">persist(aggregate)</text>
</g>

<path class="connector callGreen" d="M 780,535 L 490,535" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowGreen)"/>
<g transform="translate(586 489)">
  <rect class="label" x="0" y="0" width="148" height="36" rx="18" fill="#172033" stroke="#4fb8a8" stroke-width="2"/>
  <circle cx="19" cy="18" r="14" fill="#4fb8a8"/><text class="badgeText" x="19" y="22" text-anchor="middle">3</text>
  <text class="message" x="42" y="23" fill="#4fb8a8">saved aggregate</text>
</g>

<path class="connector callAmber" d="M 490,615 L 1075,615" fill="none" stroke="#d0a24c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
<g transform="translate(650 569)">
  <rect class="label" x="0" y="0" width="302" height="36" rx="18" fill="#172033" stroke="#d0a24c" stroke-width="2"/>
  <circle cx="19" cy="18" r="14" fill="#d0a24c"/><text class="badgeText" x="19" y="22" text-anchor="middle">4</text>
  <text class="message" x="42" y="23" fill="#d0a24c">commit(author, saved, event properties)</text>
</g>

<path class="connector callAmber" d="M 1075,677 L 490,677" fill="none" stroke="#d0a24c" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowAmber)"/>
<g transform="translate(700 631)">
  <rect class="label" x="0" y="0" width="162" height="36" rx="18" fill="#172033" stroke="#d0a24c" stroke-width="2"/>
  <circle cx="19" cy="18" r="14" fill="#d0a24c"/><text class="badgeText" x="19" y="22" text-anchor="middle">5</text>
  <text class="message" x="42" y="23" fill="#d0a24c">commit stored</text>
</g>

<path class="connector call" d="M 490,810 L 1365,810" fill="none" stroke="#9b87d8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowViolet)"/>
<g transform="translate(820 764)">
  <rect class="label" x="0" y="0" width="226" height="36" rx="18" fill="#172033" stroke="#9b87d8" stroke-width="2"/>
  <circle cx="19" cy="18" r="14" fill="#9b87d8"/><text class="badgeText" x="19" y="22" text-anchor="middle">6</text>
  <text class="message" x="42" y="23" fill="#9b87d8">publishAll(events)</text>
</g>

<rect class="alt" x="1225" y="830" width="500" height="240" rx="18" fill="none" stroke="#536377" stroke-width="2" stroke-dasharray="10 8"/>
<rect x="1241" y="842" width="356" height="32" rx="16" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="frameTitle" x="1261" y="863">alt Spring transaction synchronization is active</text>

<path class="connector callRed" d="M 1385,930 L 1645,930" fill="none" stroke="#d66f7e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRose)"/>
<g transform="translate(1415 884)">
  <rect class="label" x="0" y="0" width="210" height="34" rx="17" fill="#172033" stroke="#d66f7e" stroke-width="2"/>
  <circle cx="18" cy="17" r="13" fill="#d66f7e"/><text class="badgeText" x="18" y="21" text-anchor="middle">7</text>
  <text class="message" x="40" y="22" fill="#d66f7e">afterCommit: publish</text>
</g>

<line class="branchDivider" x1="1225" y1="958" x2="1725" y2="958" stroke="#536377" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="1241" y="970" width="175" height="30" rx="15" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="frameTitle" x="1261" y="991">else publish immediately</text>

<path class="connector async" d="M 1385,1045 L 1645,1045" fill="none" stroke="#55c7e8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowCyan)"/>
<g transform="translate(1420 1002)">
  <rect class="label" x="0" y="0" width="198" height="34" rx="17" fill="#172033" stroke="#55c7e8" stroke-width="2"/>
  <circle cx="18" cy="17" r="13" fill="#55c7e8"/><text class="badgeText" x="18" y="21" text-anchor="middle">8</text>
  <text class="message" x="40" y="22" fill="#55c7e8">publish(event)</text>
</g>

<rect x="110" y="1090" width="1580" height="54" rx="18" fill="#182331" stroke="#536377" stroke-width="2"/>
<text class="note" x="900" y="1123" text-anchor="middle">Immediate delivery helper, not a durable outbox: use an outbox for replay, exactly-once recovery, or cross-service delivery guarantees.</text>
</svg>
