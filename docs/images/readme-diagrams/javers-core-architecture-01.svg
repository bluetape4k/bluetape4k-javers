<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900" role="img" aria-label="javers-core module architecture">
<defs>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="2" flood-color="#000814" flood-opacity="0.04"/></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#5b8def" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#4fb8a8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<style>
.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:36px;fill:#f8fafc;font-weight:700}
.subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15px;fill:#d5dfeb}
.lane{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:22px;fill:#f8fafc;font-weight:700}
.label{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:22px;fill:#f8fafc;font-weight:700}
.small{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#d5dfeb}
</style>
</defs>
<rect x="0" y="0" width="1680" height="900" rx="26" fill="#020617"/>
<rect x="20" y="20" width="1640" height="860" rx="24" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="title" x="54" y="64">javers-core Architecture</text>
<text class="subtitle" x="56" y="94">Shared Kotlin APIs, snapshot codecs, repository contracts, and local repository implementations</text>

<rect x="70" y="132" width="1540" height="148" rx="18" fill="#182331" stroke="#9b87d8" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="168">Use from application code</text>
<rect class="card" x="130" y="198" width="320" height="56" rx="14" fill="#223047" stroke="#5b8def" stroke-width="2" filter="url(#softShadow)"/>
<text class="label" x="290" y="222" text-anchor="middle">Kotlin services</text>
<text class="small" x="150" y="240">compare, commit, query history</text>
<rect class="card" x="680" y="198" width="320" height="56" rx="14" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#softShadow)"/>
<text class="label" x="840" y="222" text-anchor="middle">JaVers runtime</text>
<text class="small" x="700" y="240">JaversBuilder, JQL, shadows</text>
<rect class="card" x="1230" y="198" width="320" height="56" rx="14" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#softShadow)"/>
<text class="label" x="1390" y="222" text-anchor="middle">Repository topology</text>
<text class="small" x="1250" y="240">core cache or external adapter</text>

<rect x="70" y="340" width="1540" height="268" rx="18" fill="#182331" stroke="#4fb8a8" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="376">javers-core public surface</text>
<rect class="card" x="130" y="430" width="270" height="104" rx="14" fill="#223047" stroke="#5b8def" stroke-width="2" filter="url(#softShadow)"/>
<text class="label" x="265" y="460" text-anchor="middle">Kotlin extensions</text>
<text class="small" x="150" y="486">latestSnapshotOrNull</text>
<text class="small" x="150" y="504">typed mapping helpers</text>
<rect class="card" x="505" y="430" width="270" height="104" rx="14" fill="#223047" stroke="#9b87d8" stroke-width="2" filter="url(#softShadow)"/>
<text class="label" x="640" y="460" text-anchor="middle">Codec family</text>
<text class="small" x="525" y="486">String JSON default</text>
<text class="small" x="525" y="504">Kryo / Fory / compression</text>
<rect class="card" x="880" y="430" width="270" height="104" rx="14" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#softShadow)"/>
<text class="label" x="1015" y="460" text-anchor="middle">Repository base</text>
<text class="small" x="900" y="486">CdoSnapshotRepository</text>
<text class="small" x="900" y="504">query filtering + head restore</text>
<rect class="card" x="1255" y="430" width="270" height="104" rx="14" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#softShadow)"/>
<text class="label" x="1390" y="460" text-anchor="middle">Dispatch + metadata</text>
<text class="small" x="1275" y="486">JaversDispatcher</text>
<text class="small" x="1275" y="504">Snowflake commit ids</text>

<rect x="70" y="668" width="1540" height="132" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="704">Repository implementations and downstream modules</text>
<rect class="card" x="160" y="730" width="310" height="52" rx="14" fill="#223047" stroke="#9b87d8" stroke-width="2" filter="url(#softShadow)"/>
<text class="label" x="315" y="762" text-anchor="middle">Cache repositories</text>
<rect class="card" x="685" y="730" width="310" height="52" rx="14" fill="#223047" stroke="#536377" stroke-width="2" filter="url(#softShadow)"/>
<text class="label" x="840" y="762" text-anchor="middle">Composite repository</text>
<rect class="card" x="1210" y="730" width="310" height="52" rx="14" fill="#223047" stroke="#55c7e8" stroke-width="2" stroke-dasharray="7 5" filter="url(#softShadow)"/>
<text class="label" x="1365" y="762" text-anchor="middle">Exposed / Redis / Kafka</text>

<path class="connector" d="M 450,226 L 680,226" fill="none" stroke="#5b8def" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
<path class="connector" d="M 1000,226 L 1230,226" fill="none" stroke="#5b8def" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
<path class="connector" d="M 290,254 L 290,430" fill="none" stroke="#5b8def" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
<path class="connector" d="M 840,254 L 840,316 Q 840,330 826,330 L 654,330 Q 640,330 640,344 L 640,430" fill="none" stroke="#5b8def" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
<path class="connector" d="M 1390,254 L 1390,316 Q 1390,330 1376,330 L 1029,330 Q 1015,330 1015,344 L 1015,430" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<path class="connector" d="M 970,534 L 970,614 Q 970,628 956,628 L 329,628 Q 315,628 315,642 L 315,730" fill="none" stroke="#5b8def" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
<path class="connector" d="M 1015,534 L 1015,642 Q 1015,656 1001,656 L 854,656 Q 840,656 840,670 L 840,730" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<path class="connector" d="M 1060,534 L 1060,614 Q 1060,628 1074,628 L 1351,628 Q 1365,628 1365,642 L 1365,730" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrowGreen)"/>

<text class="small" x="96" y="850">Use javers-core for shared APIs and repository primitives; add adapter modules only when the runtime audit topology requires them.</text>
</svg>
