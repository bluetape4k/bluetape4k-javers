<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900" role="img" aria-label="javers-core module architecture">
<defs>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="2" flood-color="#334155" flood-opacity="0.04"/></filter>
<marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="7" orient="auto"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563eb"/></marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="7" orient="auto"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#059669"/></marker>
<style>
.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:36px;fill:#183247;font-weight:700}
.subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15px;fill:#587086}
.lane{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:22px;fill:#183247;font-weight:700}
.label{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:18px;fill:#183247;font-weight:700}
.small{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#587086}
</style>
</defs>
<rect x="0" y="0" width="1680" height="900" rx="26" fill="#f7fafc"/>
<rect x="20" y="20" width="1640" height="860" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text class="title" x="54" y="64">javers-core Architecture</text>
<text class="subtitle" x="56" y="94">Shared Kotlin APIs, snapshot codecs, repository contracts, and local repository implementations</text>

<rect x="70" y="132" width="1540" height="148" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="168">Use from application code</text>
<rect x="130" y="198" width="320" height="56" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="290" y="222" text-anchor="middle">Kotlin services</text>
<text class="small" x="150" y="240">compare, commit, query history</text>
<rect x="680" y="198" width="320" height="56" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="840" y="222" text-anchor="middle">JaVers runtime</text>
<text class="small" x="700" y="240">JaversBuilder, JQL, shadows</text>
<rect x="1230" y="198" width="320" height="56" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="1390" y="222" text-anchor="middle">Repository topology</text>
<text class="small" x="1250" y="240">core cache or external adapter</text>

<rect x="70" y="340" width="1540" height="268" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="376">javers-core public surface</text>
<rect x="130" y="430" width="270" height="104" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="265" y="460" text-anchor="middle">Kotlin extensions</text>
<text class="small" x="150" y="486">latestSnapshotOrNull</text>
<text class="small" x="150" y="504">typed mapping helpers</text>
<rect x="505" y="430" width="270" height="104" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="640" y="460" text-anchor="middle">Codec family</text>
<text class="small" x="525" y="486">String JSON default</text>
<text class="small" x="525" y="504">Kryo / Fory / compression</text>
<rect x="880" y="430" width="270" height="104" rx="14" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="1015" y="460" text-anchor="middle">Repository base</text>
<text class="small" x="900" y="486">CdoSnapshotRepository</text>
<text class="small" x="900" y="504">query filtering + head restore</text>
<rect x="1255" y="430" width="270" height="104" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="1390" y="460" text-anchor="middle">Dispatch + metadata</text>
<text class="small" x="1275" y="486">JaversDispatcher</text>
<text class="small" x="1275" y="504">Snowflake commit ids</text>

<rect x="70" y="668" width="1540" height="132" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="704">Repository implementations and downstream modules</text>
<rect x="160" y="730" width="310" height="52" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="315" y="762" text-anchor="middle">Cache repositories</text>
<rect x="685" y="730" width="310" height="52" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="840" y="762" text-anchor="middle">Composite repository</text>
<rect x="1210" y="730" width="310" height="52" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="7 5" filter="url(#softShadow)"/>
<text class="label" x="1365" y="762" text-anchor="middle">Exposed / Redis / Kafka</text>

<path d="M 450,226 L 680,226" fill="none" stroke="#2563eb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
<path d="M 1000,226 L 1230,226" fill="none" stroke="#2563eb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
<path d="M 290,254 L 290,430" fill="none" stroke="#2563eb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
<path d="M 840,254 L 840,330 L 640,330 L 640,430" fill="none" stroke="#2563eb" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
<path d="M 1390,254 L 1390,330 L 1015,330 L 1015,430" fill="none" stroke="#059669" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<path d="M 1015,534 L 1015,628" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 620,628 L 1365,628" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 620,628 L 620,756 L 470,756" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowBlue)"/>
<path d="M 840,628 L 840,730" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<path d="M 1365,628 L 1365,730" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrowGreen)"/>

<text class="small" x="96" y="850">Use javers-core for shared APIs and repository primitives; add adapter modules only when the runtime audit topology requires them.</text>
</svg>
