<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080" role="img" aria-label="javers-exposed persistence flow">
<defs>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="2" flood-color="#334155" flood-opacity="0.04"/></filter>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563eb" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#059669" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#d97706" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="11" refY="6" orient="auto" viewBox="0 0 12 12" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#ef4444" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<style>
.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:38px;fill:#183247;font-weight:700}
.subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15px;fill:#587086}
.lane{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:23px;fill:#183247;font-weight:700}
.label{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:24px;fill:#183247;font-weight:700}
.body{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#475569}
.small{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#587086}
</style>
</defs>
<rect x="0" y="0" width="1900" height="1080" rx="26" fill="#f7fafc"/>
<rect x="20" y="20" width="1860" height="1040" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text class="title" x="54" y="64">javers-exposed Persistence Flow</text>
<text class="subtitle" x="56" y="94">Exposed transaction writes, SQL metadata pushdown, and JaVers decode fallback</text>

<rect x="64" y="132" width="1772" height="396" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="90" y="168">Write path: commit metadata and encoded snapshot rows</text>

<rect x="115" y="245" width="270" height="118" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="250" y="282" text-anchor="middle">JaVers commit</text>
<text class="body" x="140" y="310">commit(author, object)</text>
<text class="body" x="140" y="329">produces CdoSnapshot</text>

<rect x="500" y="230" width="330" height="148" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.2" filter="url(#softShadow)"/>
<image data-bluetape4k-icon="libraries/exposed" x="530" y="248" width="50" height="50" href="data:image/svg+xml;base64,"/>
<text class="label" x="600" y="268">Exposed repository</text>
<text class="body" x="530" y="310">saveSnapshot(snapshot)</text>
<text class="body" x="530" y="329">encode full snapshot JSON</text>
<text class="body" x="530" y="348">run inside Exposed transaction</text>

<rect x="945" y="214" width="295" height="128" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="1092" y="252" text-anchor="middle">Commit metadata</text>
<text class="body" x="970" y="282">insert if absent</text>
<text class="body" x="970" y="301">author, dates, properties</text>
<text class="body" x="970" y="320">sequence for head restore</text>

<rect x="945" y="376" width="295" height="128" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="1092" y="414" text-anchor="middle">Snapshot row</text>
<text class="body" x="970" y="444">global_id + version</text>
<text class="body" x="970" y="463">state = encoded payload</text>
<text class="body" x="970" y="482">type, changed, managed_type</text>

<rect x="1390" y="250" width="315" height="176" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2" filter="url(#softShadow)"/>
<image data-bluetape4k-icon="generic/database-server" x="1429" y="282" width="70" height="70" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
<text class="label" x="1578" y="296" text-anchor="middle">SQL audit tables</text>
<text class="body" x="1525" y="329">javers_commit</text>
<text class="body" x="1525" y="348">javers_snapshot</text>
<text class="body" x="1525" y="367">custom names via options</text>

<path d="M 385,304 L 500,304" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 830,304 L 889.6,304 Q 900,304 900,293.6 L 900,288.4 Q 900,278 910.4,278 L 945,278" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)"/>
<path d="M 830,304 L 886,304 Q 900,304 900,318 L 900,426 Q 900,440 914,440 L 945,440" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<path d="M 1240,278 L 1301.2,278 Q 1314,278 1314,290.8 L 1314,297.2 Q 1314,310 1326.8,310 L 1390,310" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)"/>
<path d="M 1240,440 L 1306,440 Q 1320,440 1320,426 L 1320,382 Q 1320,368 1334,368 L 1390,368" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>

<rect x="64" y="575" width="1772" height="396" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="90" y="611">Read path: SQL pushdown first, shared in-memory filtering when needed</text>

<rect x="115" y="690" width="270" height="118" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="250" y="727" text-anchor="middle">JaVers query</text>
<text class="body" x="140" y="755">getSnapshots(...)</text>
<text class="body" x="140" y="774">getStateHistory(...)</text>

<rect x="500" y="675" width="330" height="148" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="665" y="713" text-anchor="middle">Pushdown decision</text>
<text class="body" x="530" y="745">exact ids/version/author/date/type</text>
<text class="body" x="530" y="764">skip + limit applied in SQL</text>
<text class="body" x="530" y="783">complex filters stay in memory</text>

<rect x="945" y="655" width="295" height="128" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="1092" y="693" text-anchor="middle">Joined SQL query</text>
<text class="body" x="970" y="723">snapshot join commit</text>
<text class="body" x="970" y="742">order by sequence desc</text>
<text class="body" x="970" y="761">decode only selected rows</text>

<rect x="945" y="820" width="295" height="104" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="1092" y="858" text-anchor="middle">Fallback filter</text>
<text class="body" x="970" y="889">changed props, commit props,</text>
<text class="body" x="970" y="908">aggregates, ranges, snapshot limit</text>

<rect x="1390" y="706" width="315" height="128" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#softShadow)"/>
<text class="label" x="1548" y="745" text-anchor="middle">CdoSnapshot result</text>
<text class="body" x="1420" y="776">decoded through codec</text>
<text class="body" x="1420" y="795">returned to JaVers query engine</text>

<path d="M 385,749 L 500,749" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 830,736 L 945,736" fill="none" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowGreen)"/>
<path d="M 830,786 L 874,786 Q 888,786 888,800 L 888,858 Q 888,872 902,872 L 945,872" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)"/>
<path d="M 1240,719 L 1301,719 Q 1315,719 1315,733 L 1315,746 Q 1315,760 1329,760 L 1390,760" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowAmber)"/>
<path d="M 1240,872 L 1326,872 Q 1340,872 1340,858 L 1340,809 Q 1340,795 1354,795 L 1390,795" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowRed)"/>

<text class="small" x="96" y="1020">The SQL store is the durable JaVers audit source of truth; Redis/cache strategies belong to read models or an explicit composite repository.</text>
</svg>
