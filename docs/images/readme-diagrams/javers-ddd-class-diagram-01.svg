<text class="title" x="54" y="64">javers-ddd Class Diagram</text>
<text class="subtitle" x="56" y="94">Aggregate contracts, repository base behavior, commit-property helpers, and publisher adapters</text>

<rect x="70" y="132" width="805" height="780" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="168">Aggregate and JaVers contract</text>

<rect class="card" x="120" y="220" width="275" height="118" rx="10" fill="#223047" stroke="#5b8def" stroke-width="2" filter="url(#softShadow)"/>
<text class="stereo" x="257" y="246" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
<text class="className" x="257" y="272" text-anchor="middle">AggregateRoot&lt;ID&gt;</text>
<path d="M 120,288 H395" stroke="#223047" stroke-width="1"/>
<text class="member" x="140" y="313">+ id: ID</text>

<rect class="card" x="480" y="198" width="330" height="162" rx="10" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#softShadow)"/>
<text class="stereo" x="645" y="224" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
<text class="className" x="645" y="250" text-anchor="middle">DomainEvent</text>
<path d="M 480,266 H810" stroke="#536377" stroke-width="1"/>
<text class="member" x="500" y="291">+ aggregateId: Any</text>
<text class="member" x="500" y="309">+ occurredOn: Instant</text>
<text class="member" x="500" y="327">+ attributes: Map&lt;String, String&gt;</text>

<rect class="card" x="278" y="455" width="410" height="194" rx="10" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#softShadow)"/>
<text class="stereo" x="483" y="481" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
<text class="className" x="483" y="507" text-anchor="middle">AggregateRepository&lt;T, ID&gt;</text>
<path d="M 278,523 H688" stroke="#536377" stroke-width="1"/>
<text class="member" x="298" y="548">+ save(aggregate, author)</text>
<text class="member" x="298" y="566">+ save(aggregate, author, event/events)</text>
<text class="member" x="298" y="584">+ load(id), loadHistory(id)</text>
<text class="member" x="298" y="602"># persist(aggregate), findById(id)</text>
<text class="member" x="298" y="620">- loadLatestShadow(id)</text>
<text class="member" x="298" y="638"># saveAuditBoundary(block)</text>

<rect class="card" x="310" y="735" width="345" height="104" rx="10" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#softShadow)"/>
<text class="className" x="482" y="768" text-anchor="middle">DomainEvent properties</text>
<path d="M 310,785 H655" stroke="#536377" stroke-width="1"/>
<text class="member" x="330" y="809">+ toJaversProperties()</text>
<text class="member" x="330" y="827">domainEventType, aggregateId, occurredOn</text>

<rect x="930" y="132" width="860" height="780" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="956" y="168">Publisher contract and adapters</text>

<rect class="card" x="1190" y="205" width="340" height="130" rx="10" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#softShadow)"/>
<text class="stereo" x="1360" y="231" text-anchor="middle">&lt;&lt;fun interface&gt;&gt;</text>
<text class="className" x="1360" y="257" text-anchor="middle">DomainEventPublisher</text>
<path d="M 1190,273 H1530" stroke="#536377" stroke-width="1"/>
<text class="member" x="1210" y="298">+ publish(event)</text>
<text class="member" x="1210" y="316">+ publishAll(events)</text>

<text class="small" x="980" y="376">Built-in publishers</text>
<rect class="card" x="980" y="430" width="220" height="96" rx="10" fill="#223047" stroke="#536377" stroke-width="2" filter="url(#softShadow)"/>
<text class="className" x="1090" y="466" text-anchor="middle">Noop</text>
<text class="className" x="1090" y="488" text-anchor="middle">Publisher</text>
<path d="M 980,504 H1200" stroke="#536377" stroke-width="1"/>
<text class="member" x="1000" y="522">drops events</text>

<rect class="card" x="1250" y="430" width="220" height="96" rx="10" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#softShadow)"/>
<text class="className" x="1360" y="466" text-anchor="middle">Function</text>
<text class="className" x="1360" y="488" text-anchor="middle">Publisher</text>
<path d="M 1250,504 H1470" stroke="#536377" stroke-width="1"/>
<text class="member" x="1270" y="522">(DomainEvent) -&gt; Unit</text>

<rect class="card" x="1520" y="430" width="220" height="96" rx="10" fill="#223047" stroke="#9b87d8" stroke-width="2" filter="url(#softShadow)"/>
<text class="className" x="1630" y="466" text-anchor="middle">Composite</text>
<text class="className" x="1630" y="488" text-anchor="middle">Publisher</text>
<path d="M 1520,504 H1740" stroke="#536377" stroke-width="1"/>
<text class="member" x="1540" y="522">ordered fan-out</text>

<text class="small" x="980" y="566">Integration adapters - same contract repeated for clarity</text>
<rect class="card" x="1190" y="575" width="340" height="130" rx="10" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#softShadow)"/>
<text class="stereo" x="1360" y="601" text-anchor="middle">&lt;&lt;fun interface&gt;&gt;</text>
<text class="className" x="1360" y="627" text-anchor="middle">DomainEventPublisher</text>
<path d="M 1190,643 H1530" stroke="#536377" stroke-width="1"/>
<text class="member" x="1210" y="668">+ publish(event)</text>
<text class="member" x="1210" y="686">+ publishAll(events)</text>

<rect class="card" x="980" y="780" width="220" height="96" rx="10" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#softShadow)"/>
<text class="className" x="1090" y="816" text-anchor="middle">Spring Event</text>
<text class="className" x="1090" y="838" text-anchor="middle">Adapter</text>
<path d="M 980,854 H1200" stroke="#536377" stroke-width="1"/>
