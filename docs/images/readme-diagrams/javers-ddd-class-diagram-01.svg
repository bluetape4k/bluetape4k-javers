<rect class="card" x="1520" y="780" width="220" height="96" rx="10" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#softShadow)"/>
<text class="className" x="1630" y="816" text-anchor="middle">NATS</text>
<text class="className" x="1630" y="838" text-anchor="middle">Adapter</text>
<path d="M 1520,854 H1740" stroke="#536377" stroke-width="1"/>
