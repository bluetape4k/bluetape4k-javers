<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="980" viewBox="0 0 2140 980" role="img" aria-label="javers kafka repository map">
<defs>
<filter id="shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000814" flood-opacity="0.28"/></filter>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b8def" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="soft" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#536377" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<style>
.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:40px;fill:#f8fafc;font-weight:700}
.subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:16px;fill:#d5dfeb}
.lane{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:25px;fill:#f8fafc;font-weight:700}
.label{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#f8fafc;font-weight:700}
.body{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:14px;fill:#d5dfeb}
.small{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:14px;fill:#d5dfeb}
.infra{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:24px;fill:#f8fafc;font-weight:700}
</style>

<marker id="arrow059669" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4fb8a8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrowD97706" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d0a24c" stroke-dasharray="none" style="stroke-dasharray:none"/></marker></defs>
<rect width="2140" height="980" rx="26" fill="#020617"/>
<rect x="20" y="20" width="2100" height="940" rx="24" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="title" x="54" y="64">javers-persistence-kafka Repository Map</text>
<text class="subtitle" x="56" y="94">Write-only Kafka snapshot publishers plus explicit read-side projection into a durable repository</text>

<rect x="70" y="130" width="2000" height="220" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="166">Shared snapshot event contract</text>
<rect class="card" x="95" y="205" width="610" height="96" rx="10" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="400" y="242" text-anchor="middle">AbstractCdoSnapshotRepository&lt;String&gt;</text>
<text class="body" x="145" y="272">shared codec and persistence hooks</text>
<rect class="card" x="760" y="205" width="410" height="96" rx="10" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="965" y="242" text-anchor="middle">JaversCodecs.String</text>
<text class="body" x="790" y="272">encoded snapshot JSON becomes the record value</text>
<rect class="card" x="1320" y="205" width="560" height="96" rx="10" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="1600" y="242" text-anchor="middle">CdoSnapshotEvent&lt;String&gt;</text>
<text class="body" x="1350" y="272">metadata in process, payload on Kafka wire</text>
<path class="connector" d="M 705,253 L 760,253" fill="none" stroke="#4fb8a8" stroke-width="4" marker-end="url(#arrow059669)"/>
<path class="connector" d="M 1170,253 L 1320,253" fill="none" stroke="#d0a24c" stroke-width="4" marker-end="url(#arrowD97706)"/>

<rect x="70" y="395" width="960" height="420" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="431">Publisher adapters</text>
<rect class="card" x="100" y="480" width="500" height="136" rx="10" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="350" y="532" text-anchor="middle">KafkaCdoSnapshotRepository</text>
<text class="body" x="135" y="564">Spring KafkaTemplate</text>
<text class="body" x="135" y="583">sendDefault(key, payload)</text>
<text class="body" x="135" y="602">write-only; reads return empty / false / 0</text>
<rect class="card" x="100" y="648" width="550" height="136" rx="10" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="375" y="700" text-anchor="middle">VanillaKafkaCdoSnapshotRepository</text>
<text class="body" x="135" y="732">Apache Producer or producerOf(...)</text>
<text class="body" x="135" y="751">topic, timeout, flush, close ownership</text>
<text class="body" x="135" y="770">write-only; reads return empty / false / 0</text>
<rect class="card" x="720" y="542" width="285" height="108" rx="10" fill="#182331" stroke="#d0a24c" stroke-width="2" filter="url(#shadow)"/>
<g transform="translate(725 559)">
<image data-bluetape4k-icon="kafka/apache-kafka-icon" x="8" y="4" width="70" height="70" preserveAspectRatio="xMidYMid meet" href="data:image/png;base64,"/>
</g>
<text class="infra" x="902" y="584" text-anchor="middle">Kafka topic</text>
<text class="body" x="802" y="620">key = GlobalId or mapper</text>
<text class="body" x="802" y="639">value = encoded payload</text>
<path class="connector" d="M 600,548 L 680,548 Q 694,548 694,562 L 694,566 Q 694,580 708,580 L 720,580" fill="none" stroke="#5b8def" stroke-width="4" marker-end="url(#arrow)"/>
<path class="connector" d="M 650,716 L 680,716 Q 694,716 694,702 L 694,644 Q 694,630 708,630 L 720,630" fill="none" stroke="#5b8def" stroke-width="4" marker-end="url(#arrow)"/>

<rect x="1110" y="395" width="960" height="420" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="1136" y="431">Projection adapter</text>
<rect class="card" x="1150" y="525" width="390" height="122" rx="10" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="1345" y="565" text-anchor="middle">KafkaCdoSnapshotProjector</text>
<text class="body" x="1180" y="596">poll topic, decode payload</text>
<text class="body" x="1180" y="615">sort by partition and offset</text>
<rect class="card" x="1685" y="500" width="330" height="82" rx="10" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="1850" y="536" text-anchor="middle">Read repository</text>
<text class="body" x="1715" y="562">Redis / Exposed / Caffeine</text>
<rect class="card" x="1685" y="635" width="330" height="82" rx="10" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#shadow)"/>
<text class="label" x="1850" y="671" text-anchor="middle">Replay options</text>
<text class="body" x="1715" y="697">skip existing, commit offsets</text>
<path class="connector" d="M 1540,541 L 1685,541" fill="none" stroke="#4fb8a8" stroke-width="4" marker-end="url(#arrow059669)"/>
<path class="connector" d="M 1540,615 L 1650,615 Q 1664,615 1664,629 L 1664,662 Q 1664,676 1678,676 L 1685,676" fill="none" stroke="#d0a24c" stroke-width="4" marker-end="url(#arrowD97706)"/>
<path class="connector" d="M 1600,301 L 1600,340 Q 1600,354 1586,354 L 1360,354 Q 1346,354 1346,368 L 1346,525" fill="none" stroke="#536377" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#soft)"/>

<text class="small" x="96" y="890">Kafka repositories publish audit events only; historical reads require a projection or another read-capable JaVers repository.</text>
</svg>
