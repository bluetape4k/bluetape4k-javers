<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1400" viewBox="0 0 1800 1400" role="img" aria-label="javers kafka publish sequence">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="2" flood-color="#000814" flood-opacity="0.18"/></filter>
  <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b8def"/></marker>
  <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4fb8a8"/></marker>
  <marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d0a24c"/></marker>
  <marker id="arrowRose" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d66f7e"/></marker>
  <marker id="arrowViolet" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b87d8"/></marker>
  <style>
    .title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:36px;fill:#f8fafc;font-weight:700}
    .subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15px;fill:#d5dfeb}
    .participant{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:21px;fill:#f8fafc;font-weight:700}
    .role{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#d5dfeb}
    .frameTitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;fill:#d5dfeb;font-weight:700}
    .message{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;font-weight:700}
    .badgeText{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#f8fafc;font-weight:700}
    .note{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;fill:#d5dfeb}
  </style>
</defs>

<rect width="1800" height="1400" rx="26" fill="#020617"/>
<rect class="frame" x="20" y="20" width="1760" height="1360" rx="24" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="title" x="54" y="64">javers-persistence-kafka Publish Sequence</text>
<text class="subtitle" x="56" y="94">Each JaVers snapshot is encoded, published synchronously, and accepted only after Kafka acknowledges the record</text>

<rect class="card" x="70" y="140" width="220" height="92" rx="14" fill="#223047" stroke="#5b8def" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="180" y="176" text-anchor="middle">JaVers</text>
<text class="role" x="180" y="203" text-anchor="middle">snapshot commit loop</text>

<rect class="card" x="350" y="140" width="270" height="92" rx="14" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="485" y="176" text-anchor="middle">Kafka Repository</text>
<text class="role" x="485" y="203" text-anchor="middle">Spring or vanilla adapter</text>

<rect class="card" x="690" y="140" width="240" height="92" rx="14" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="810" y="176" text-anchor="middle">Codec + Event</text>
<text class="role" x="810" y="203" text-anchor="middle">JSON payload + metadata</text>

<rect class="card" x="1030" y="140" width="270" height="92" rx="14" fill="#223047" stroke="#9b87d8" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="1165" y="176" text-anchor="middle">Snapshot Publisher</text>
<text class="role" x="1165" y="203" text-anchor="middle">KafkaTemplate or Producer</text>

<rect class="card" x="1430" y="140" width="250" height="92" rx="14" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="1555" y="176" text-anchor="middle">Kafka Broker</text>
<text class="role" x="1555" y="203" text-anchor="middle">topic acknowledgement</text>

<g stroke="#536377" stroke-width="2" stroke-dasharray="8 8">
  <line class="lifeline" x1="180" y1="232" x2="180" y2="1270"/>
  <line class="lifeline" x1="485" y1="232" x2="485" y2="1270"/>
  <line class="lifeline" x1="810" y1="232" x2="810" y2="1270"/>
  <line class="lifeline" x1="1165" y1="232" x2="1165" y2="1270"/>
  <line class="lifeline" x1="1555" y1="232" x2="1555" y2="1270"/>
</g>

<rect class="activation" x="475" y="310" width="20" height="910" rx="8" fill="#223047" stroke="#d66f7e" stroke-width="2"/>
<rect class="activation" x="800" y="405" width="20" height="112" rx="8" fill="#223047" stroke="#4fb8a8" stroke-width="2"/>
<rect class="activation" x="1155" y="585" width="20" height="625" rx="8" fill="#223047" stroke="#9b87d8" stroke-width="2"/>
<rect class="activation" x="1545" y="675" width="20" height="430" rx="8" fill="#223047" stroke="#d0a24c" stroke-width="2"/>

<path class="connector callBlue" d="M 180,330 L 475,330" fill="none" stroke="#5b8def" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
<g transform="translate(240 282)"><rect class="label" x="0" y="0" width="220" height="36" rx="18" fill="#172033" stroke="#5b8def" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#5b8def"/><text class="badgeText" x="19" y="22" text-anchor="middle">1</text><text class="message" x="42" y="23" fill="#5b8def">saveSnapshot(snapshot)</text></g>

<path class="connector callGreen" d="M 495,430 L 800,430" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
<g transform="translate(560 382)"><rect class="label" x="0" y="0" width="190" height="36" rx="18" fill="#172033" stroke="#4fb8a8" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#4fb8a8"/><text class="badgeText" x="19" y="22" text-anchor="middle">2</text><text class="message" x="42" y="23" fill="#4fb8a8">encode(snapshot)</text></g>

<path class="connector returnGreen" d="M 800,505 L 495,505" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowGreen)"/>
<g transform="translate(535 457)"><rect class="label" x="0" y="0" width="240" height="36" rx="18" fill="#172033" stroke="#4fb8a8" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#4fb8a8"/><text class="badgeText" x="19" y="22" text-anchor="middle">3</text><text class="message" x="42" y="23" fill="#4fb8a8">event(metadata, payload)</text></g>

<path class="connector callViolet" d="M 495,610 L 1155,610" fill="none" stroke="#9b87d8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowViolet)"/>
<g transform="translate(720 562)"><rect class="label" x="0" y="0" width="250" height="36" rx="18" fill="#172033" stroke="#9b87d8" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#9b87d8"/><text class="badgeText" x="19" y="22" text-anchor="middle">4</text><text class="message" x="42" y="23" fill="#9b87d8">publish(event, key)</text></g>

<path class="connector callAmber" d="M 1175,690 L 1545,690" fill="none" stroke="#d0a24c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
<g transform="translate(1240 642)"><rect class="label" x="0" y="0" width="240" height="36" rx="18" fill="#172033" stroke="#d0a24c" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#d0a24c"/><text class="badgeText" x="19" y="22" text-anchor="middle">5</text><text class="message" x="42" y="23" fill="#d0a24c">send(key, event.payload)</text></g>

<rect class="alt" x="430" y="735" width="1185" height="500" rx="18" fill="none" stroke="#536377" stroke-width="2" stroke-dasharray="10 8"/>
<rect x="446" y="747" width="400" height="34" rx="17" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="frameTitle" x="466" y="769">alt broker acknowledgement arrives before timeout</text>

<path class="connector returnAmber" d="M 1545,825 L 1175,825" fill="none" stroke="#d0a24c" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowAmber)"/>
<g transform="translate(1285 777)"><rect class="label" x="0" y="0" width="165" height="36" rx="18" fill="#172033" stroke="#d0a24c" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#d0a24c"/><text class="badgeText" x="19" y="22" text-anchor="middle">6</text><text class="message" x="42" y="23" fill="#d0a24c">acknowledged</text></g>

<path class="connector returnViolet" d="M 1155,895 L 495,895" fill="none" stroke="#9b87d8" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowViolet)"/>
<g transform="translate(740 847)"><rect class="label" x="0" y="0" width="190" height="36" rx="18" fill="#172033" stroke="#9b87d8" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#9b87d8"/><text class="badgeText" x="19" y="22" text-anchor="middle">7</text><text class="message" x="42" y="23" fill="#9b87d8">publish complete</text></g>

<path class="connector returnBlue" d="M 475,965 L 180,965" fill="none" stroke="#5b8def" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/>
<g transform="translate(245 917)"><rect class="label" x="0" y="0" width="190" height="36" rx="18" fill="#172033" stroke="#5b8def" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#5b8def"/><text class="badgeText" x="19" y="22" text-anchor="middle">8</text><text class="message" x="42" y="23" fill="#5b8def">snapshot accepted</text></g>

<line class="branchDivider" x1="430" y1="990" x2="1615" y2="990" stroke="#536377" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="446" y="1002" width="300" height="32" rx="16" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="frameTitle" x="466" y="1023">else send, timeout, or interruption fails</text>

<path class="connector failureAmber" d="M 1545,1080 L 1175,1080" fill="none" stroke="#d0a24c" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowAmber)"/>
<g transform="translate(1260 1034)"><rect class="label" x="0" y="0" width="215" height="36" rx="18" fill="#172033" stroke="#d0a24c" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#d0a24c"/><text class="badgeText" x="19" y="22" text-anchor="middle">9</text><text class="message" x="42" y="23" fill="#d0a24c">timeout / send failure</text></g>

<path class="connector failureRose" d="M 1155,1145 L 495,1145" fill="none" stroke="#d66f7e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRose)"/>
<g transform="translate(730 1099)"><rect class="label" x="0" y="0" width="205" height="36" rx="18" fill="#172033" stroke="#d66f7e" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#d66f7e"/><text class="badgeText" x="19" y="22" text-anchor="middle">10</text><text class="message" x="42" y="23" fill="#d66f7e">RuntimeException</text></g>

<path class="connector failureRose" d="M 475,1205 L 180,1205" fill="none" stroke="#d66f7e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRose)"/>
<g transform="translate(230 1159)"><rect class="label" x="0" y="0" width="225" height="36" rx="18" fill="#172033" stroke="#d66f7e" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#d66f7e"/><text class="badgeText" x="19" y="22" text-anchor="middle">11</text><text class="message" x="42" y="23" fill="#d66f7e">propagate; no advance</text></g>

<rect x="90" y="1290" width="1620" height="58" rx="18" fill="#182331" stroke="#536377" stroke-width="2"/>
<text class="note" x="900" y="1315" text-anchor="middle">Spring selects an explicit or default topic; vanilla may flush after ACK. Interrupted waits restore the flag; logs expose only key fingerprint and length.</text>
<text class="note" x="900" y="1336" text-anchor="middle">A multi-snapshot commit can publish a prefix before failure, so consumers and projections must tolerate retries.</text>
</svg>
