<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-label="javers kafka projection sequence">
<defs>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="2" flood-color="#000814" flood-opacity="0.18"/></filter>
  <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5b8def"/></marker>
  <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4fb8a8"/></marker>
  <marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d0a24c"/></marker>
  <marker id="arrowRose" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d66f7e"/></marker>
  <marker id="arrowViolet" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b87d8"/></marker>
  <style>
    .title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:36px;fill:#f8fafc;font-weight:700}
    .subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15px;fill:#d5dfeb}
    .participant{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:21px;fill:#f8fafc;font-weight:700}
    .role{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#d5dfeb}
    .frameTitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;fill:#d5dfeb;font-weight:700}
    .message{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;font-weight:700}
    .badgeText{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:12px;fill:#f8fafc;font-weight:700}
    .note{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:13px;fill:#d5dfeb}
  </style>
</defs>

<rect width="1800" height="1500" rx="26" fill="#020617"/>
<rect class="frame" x="20" y="20" width="1760" height="1460" rx="24" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="title" x="54" y="64">javers-persistence-kafka Projection Sequence</text>
<text class="subtitle" x="56" y="94">A deterministic replay decodes Kafka payloads, skips matching snapshots when configured, and commits offsets only after the batch completes</text>

<rect class="card" x="65" y="140" width="220" height="92" rx="14" fill="#223047" stroke="#5b8def" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="175" y="176" text-anchor="middle">Application</text>
<text class="role" x="175" y="203" text-anchor="middle">replay coordinator</text>

<rect class="card" x="340" y="140" width="285" height="92" rx="14" fill="#223047" stroke="#d66f7e" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="482" y="176" text-anchor="middle">Snapshot Projector</text>
<text class="role" x="482" y="203" text-anchor="middle">deterministic batch orchestration</text>

<rect class="card" x="700" y="140" width="230" height="92" rx="14" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="815" y="176" text-anchor="middle">Kafka Consumer</text>
<text class="role" x="815" y="203" text-anchor="middle">poll and offsets</text>

<rect class="card" x="1040" y="140" width="250" height="92" rx="14" fill="#223047" stroke="#4fb8a8" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="1165" y="176" text-anchor="middle">Codec + Converter</text>
<text class="role" x="1165" y="203" text-anchor="middle">JSON to CdoSnapshot</text>

<rect class="card" x="1410" y="140" width="300" height="92" rx="14" fill="#223047" stroke="#9b87d8" stroke-width="2" filter="url(#softShadow)"/>
<text class="participant" x="1560" y="176" text-anchor="middle">Projection Repository</text>
<text class="role" x="1560" y="203" text-anchor="middle">read-capable JaVers storage</text>

<g stroke="#536377" stroke-width="2" stroke-dasharray="8 8">
  <line class="lifeline" x1="175" y1="232" x2="175" y2="1360"/>
  <line class="lifeline" x1="482" y1="232" x2="482" y2="1360"/>
  <line class="lifeline" x1="815" y1="232" x2="815" y2="1360"/>
  <line class="lifeline" x1="1165" y1="232" x2="1165" y2="1360"/>
  <line class="lifeline" x1="1560" y1="232" x2="1560" y2="1360"/>
</g>

<rect class="activation" x="472" y="310" width="20" height="1015" rx="8" fill="#223047" stroke="#d66f7e" stroke-width="2"/>
<rect class="activation" x="805" y="400" width="20" height="920" rx="8" fill="#223047" stroke="#d0a24c" stroke-width="2"/>
<rect class="activation" x="1155" y="600" width="20" height="105" rx="8" fill="#223047" stroke="#4fb8a8" stroke-width="2"/>
<rect class="activation" x="1550" y="760" width="20" height="275" rx="8" fill="#223047" stroke="#9b87d8" stroke-width="2"/>

<path class="connector callBlue" d="M 175,330 L 472,330" fill="none" stroke="#5b8def" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
<g transform="translate(235 282)"><rect class="label" x="0" y="0" width="205" height="36" rx="18" fill="#172033" stroke="#5b8def" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#5b8def"/><text class="badgeText" x="19" y="22" text-anchor="middle">1</text><text class="message" x="42" y="23" fill="#5b8def">projectOnce()</text></g>

<path class="connector callAmber" d="M 492,420 L 805,420" fill="none" stroke="#d0a24c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
<g transform="translate(565 372)"><rect class="label" x="0" y="0" width="180" height="36" rx="18" fill="#172033" stroke="#d0a24c" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#d0a24c"/><text class="badgeText" x="19" y="22" text-anchor="middle">2</text><text class="message" x="42" y="23" fill="#d0a24c">poll(timeout)</text></g>

<path class="connector returnAmber" d="M 805,495 L 492,495" fill="none" stroke="#d0a24c" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowAmber)"/>
<g transform="translate(555 447)"><rect class="label" x="0" y="0" width="200" height="36" rx="18" fill="#172033" stroke="#d0a24c" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#d0a24c"/><text class="badgeText" x="19" y="22" text-anchor="middle">3</text><text class="message" x="42" y="23" fill="#d0a24c">polled records</text></g>

<rect class="alt" x="430" y="535" width="1180" height="555" rx="18" fill="none" stroke="#536377" stroke-width="2" stroke-dasharray="10 8"/>
<rect x="446" y="547" width="385" height="34" rx="17" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="frameTitle" x="466" y="569">loop records sorted by partition, then offset</text>

<path class="connector callGreen" d="M 492,625 L 1155,625" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
<g transform="translate(735 577)"><rect class="label" x="0" y="0" width="220" height="36" rx="18" fill="#172033" stroke="#4fb8a8" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#4fb8a8"/><text class="badgeText" x="19" y="22" text-anchor="middle">4</text><text class="message" x="42" y="23" fill="#4fb8a8">decode(record.value)</text></g>

<path class="connector returnGreen" d="M 1155,695 L 492,695" fill="none" stroke="#4fb8a8" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowGreen)"/>
<g transform="translate(755 647)"><rect class="label" x="0" y="0" width="180" height="36" rx="18" fill="#172033" stroke="#4fb8a8" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#4fb8a8"/><text class="badgeText" x="19" y="22" text-anchor="middle">5</text><text class="message" x="42" y="23" fill="#4fb8a8">CdoSnapshot</text></g>

<path class="connector callViolet" d="M 492,780 L 1550,780" fill="none" stroke="#9b87d8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowViolet)"/>
<g transform="translate(840 732)"><rect class="label" x="0" y="0" width="335" height="36" rx="18" fill="#172033" stroke="#9b87d8" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#9b87d8"/><text class="badgeText" x="19" y="22" text-anchor="middle">6</text><text class="message" x="42" y="23" fill="#9b87d8">if enabled: loadSnapshots(globalId)</text></g>

<path class="connector returnViolet" d="M 1550,850 L 492,850" fill="none" stroke="#9b87d8" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowViolet)"/>
<g transform="translate(860 802)"><rect class="label" x="0" y="0" width="295" height="36" rx="18" fill="#172033" stroke="#9b87d8" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#9b87d8"/><text class="badgeText" x="19" y="22" text-anchor="middle">7</text><text class="message" x="42" y="23" fill="#9b87d8">matching commit + version?</text></g>

<rect class="alt" x="455" y="875" width="1130" height="195" rx="16" fill="none" stroke="#536377" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="471" y="887" width="550" height="32" rx="16" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="frameTitle" x="491" y="908">alt skipExistingSnapshots and matching snapshot exists: increment skipped</text>
<line class="branchDivider" x1="455" y1="930" x2="1585" y2="930" stroke="#536377" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="471" y="942" width="205" height="30" rx="15" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="frameTitle" x="491" y="963">else project snapshot</text>

<path class="connector callRose" d="M 492,1010 L 1550,1010" fill="none" stroke="#d66f7e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowRose)"/>
<g transform="translate(875 962)"><rect class="label" x="0" y="0" width="255" height="36" rx="18" fill="#172033" stroke="#d66f7e" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#d66f7e"/><text class="badgeText" x="19" y="22" text-anchor="middle">8</text><text class="message" x="42" y="23" fill="#d66f7e">projectSnapshot(snapshot)</text></g>

<rect class="alt" x="430" y="1110" width="800" height="220" rx="18" fill="none" stroke="#536377" stroke-width="2" stroke-dasharray="10 8"/>
<rect x="446" y="1122" width="620" height="34" rx="17" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="frameTitle" x="466" y="1144">alt non-empty batch and commitOffsetsAfterProjection after every record succeeds</text>

<path class="connector callAmber" d="M 492,1210 L 805,1210" fill="none" stroke="#d0a24c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowAmber)"/>
<g transform="translate(555 1162)"><rect class="label" x="0" y="0" width="195" height="36" rx="18" fill="#172033" stroke="#d0a24c" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#d0a24c"/><text class="badgeText" x="19" y="22" text-anchor="middle">9</text><text class="message" x="42" y="23" fill="#d0a24c">commitSync()</text></g>

<path class="connector returnAmber" d="M 805,1280 L 492,1280" fill="none" stroke="#d0a24c" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowAmber)"/>
<g transform="translate(565 1232)"><rect class="label" x="0" y="0" width="175" height="36" rx="18" fill="#172033" stroke="#d0a24c" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#d0a24c"/><text class="badgeText" x="19" y="22" text-anchor="middle">10</text><text class="message" x="42" y="23" fill="#d0a24c">committed</text></g>

<path class="connector returnBlue" d="M 472,1340 L 175,1340" fill="none" stroke="#5b8def" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrowBlue)"/>
<g transform="translate(220 1292)"><rect class="label" x="0" y="0" width="235" height="36" rx="18" fill="#172033" stroke="#5b8def" stroke-width="2"/><circle cx="19" cy="18" r="14" fill="#5b8def"/><text class="badgeText" x="19" y="22" text-anchor="middle">11</text><text class="message" x="42" y="23" fill="#5b8def">projection result</text></g>

<rect x="90" y="1390" width="1620" height="58" rx="18" fill="#182331" stroke="#536377" stroke-width="2"/>
<text class="note" x="900" y="1415" text-anchor="middle">Any decode or projection failure propagates before commitSync, leaving the polled offsets unchanged for retry.</text>
<text class="note" x="900" y="1436" text-anchor="middle">replayUntilIdle repeats projectOnce until the configured number of consecutive empty polls; consumer ownership controls close behavior.</text>
</svg>
