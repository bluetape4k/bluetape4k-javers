<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1120" viewBox="0 0 1960 1120" role="img" aria-labelledby="title desc">
<title id="title">examples-javers-ktor request audit flow</title>
<desc id="desc">Ktor order request paths for command writes, current order reads, and JaVers history reads.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#94a3b8" flood-opacity="0.22"/></filter>
  <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker>
  <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669"/></marker>
  <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#d97706"/></marker>
  <marker id="rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#e11d48"/></marker>
  <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker>
  <style>
    .title{font-family:"Architects Daughter";font-size:52px;fill:#172033}
    .subtitle,.body,.footer{font-family:"Comic Mono";fill:#475569}
    .subtitle{font-size:18px}.body{font-size:17px}.footer{font-size:15px}
    .lane{font-family:"Architects Daughter";font-size:30px;fill:#172033}
    .label{font-family:"Architects Daughter";font-size:29px;fill:#172033}
    .infra{font-family:"Architects Daughter";font-size:28px;fill:#111827}
    .line{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .dash{stroke-dasharray:8 7}
  </style>

<marker id="arrow0284C7" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#0284c7" stroke-dasharray="none"/></marker></defs>

<rect width="1960" height="1120" rx="30" fill="#f8fafc"/>
<rect x="24" y="24" width="1912" height="1072" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text class="title" x="60" y="82">examples-javers-ktor Request / Audit Flow</text>
<text class="subtitle" x="62" y="116">Writes update the command table and JaVers audit; reads choose the table or snapshot history.</text>

<rect x="74" y="155" width="410" height="820" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="104" y="199">1. HTTP requests</text>
<rect x="118" y="260" width="324" height="112" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="280" y="299" text-anchor="middle">Command write</text>
<text class="body" x="154" y="334">POST /orders</text>
<text class="body" x="154" y="357">POST /orders/{id}/paid</text>
<rect x="118" y="500" width="324" height="100" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="280" y="539" text-anchor="middle">Current order read</text>
<text class="body" x="154" y="574">GET /orders/{id}</text>
<rect x="118" y="720" width="324" height="100" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="280" y="759" text-anchor="middle">Audit history read</text>
<text class="body" x="154" y="794">GET /orders/{id}/history</text>

<rect x="555" y="155" width="455" height="820" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="585" y="199">2. Ktor application</text>
<rect x="615" y="260" width="335" height="112" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="782" y="299" text-anchor="middle">orderRoutes</text>
<text class="body" x="648" y="334">deserialize request body</text>
<text class="body" x="648" y="357">return JSON responses</text>
<rect x="625" y="465" width="315" height="122" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="782" y="505" text-anchor="middle">OrderCommandHandler</text>
<text class="body" x="660" y="540">place aggregate</text>
<text class="body" x="660" y="563">mark aggregate paid</text>
<rect x="625" y="695" width="315" height="122" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="782" y="735" text-anchor="middle">OrderRepository</text>
<text class="body" x="660" y="770">load current order</text>
<text class="body" x="660" y="793">load snapshot history</text>

<rect x="1080" y="155" width="420" height="820" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="1110" y="199">3. Command state</text>
<rect x="1132" y="255" width="318" height="128" rx="10" fill="#dcfce7" stroke="#059669" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1291" y="295" text-anchor="middle">save aggregate</text>
<text class="body" x="1166" y="330">insert / update order row</text>
<text class="body" x="1166" y="353">then commit snapshot</text>
<g transform="translate(1190 515)">
  <path d="M 0 30 C 0 12 210 12 210 30 L 210 142 C 210 160 0 160 0 142 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.4" filter="url(#shadow)"/>
  <path d="M 0 30 C 0 48 210 48 210 30" fill="none" stroke="#d97706" stroke-width="1.4"/>
  <text class="infra" x="105" y="82" text-anchor="middle">Exposed DB</text>
  <text class="body" x="105" y="113" text-anchor="middle">example_order</text>
</g>

<rect x="1570" y="155" width="315" height="820" rx="18" fill="#f8fafc" stroke="#b6c7dc" stroke-width="1.2" stroke-dasharray="8 7"/>
<text class="lane" x="1600" y="199">4. JaVers audit</text>
<rect x="1605" y="300" width="245" height="128" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1728" y="340" text-anchor="middle">snapshot commit</text>
<text class="body" x="1640" y="375">author</text>
<text class="body" x="1640" y="398">domain event type</text>
<rect x="1605" y="645" width="245" height="128" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.2" filter="url(#shadow)"/>
<text class="label" x="1728" y="685" text-anchor="middle">JaVers snapshots</text>
<text class="body" x="1640" y="720">version + commit id</text>
<text class="body" x="1640" y="743">changed properties</text>

<path class="line" d="M 442 316 L 590 316 L 615 316" stroke="#2563eb" marker-end="url(#blue)"/>
<path class="line" d="M 782 372 L 782 465" stroke="#2563eb" marker-end="url(#blue)"/>
<path class="line" d="M 940 526 L 1038 526 L 1038 319 L 1132 319" stroke="#059669" marker-end="url(#green)"/>
<path class="line" d="M 1291 383 L 1291 515" stroke="#d97706" marker-end="url(#amber)"/>
<path class="line" d="M 1450 319 L 1535 319 L 1535 364 L 1605 364" stroke="#e11d48" marker-end="url(#rose)"/>

<path class="line" d="M 442 550 L 520 550 L 520 720 L 625 720" stroke="#0284c7" marker-end="url(#arrow0284C7)"/>
<path class="line" d="M 940 742 L 1070 742 L 1070 595 L 1190 595" stroke="#d97706" marker-end="url(#amber)"/>

<path class="line" d="M 442 770 L 610 770 L 625 770" stroke="#7c3aed" marker-end="url(#purple)"/>
<path class="line" d="M 940 790 L 1120 790 L 1120 875 L 1538 875 L 1538 709 L 1605 709" stroke="#7c3aed" marker-end="url(#purple)"/>

<text class="footer" x="980" y="1032" text-anchor="middle">History limit is bounded to 1..100; missing orders return bluetape4k JSON API errors.</text>
</svg>
