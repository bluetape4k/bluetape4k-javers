<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="920" viewBox="0 0 1680 920" role="img" aria-label="javers redis key layout">
<defs>
<filter id="shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000814" flood-opacity="0.28"/></filter>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#536377" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<style>
.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:40px;fill:#f8fafc;font-weight:700}
.subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:16px;fill:#d5dfeb}
.lane{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:25px;fill:#f8fafc;font-weight:700}
.label{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#f8fafc;font-weight:700}
.head{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:14.5px;fill:#d5dfeb;font-weight:700}
.row{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15.5px;fill:#f8fafc}
.note{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15px;fill:#d5dfeb}
.badge{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:11px;fill:#f8fafc;font-weight:700}
.infra{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:21px;fill:#f8fafc;font-weight:700}
</style>
</defs>
<rect width="1680" height="920" rx="26" fill="#020617"/>
<rect x="20" y="20" width="1640" height="880" rx="24" fill="#172033" stroke="#536377" stroke-width="2"/>
<text class="title" x="54" y="64">javers-persistence-redis Key Layout</text>
<text class="subtitle" x="56" y="94">Redis keys and collection types used by Lettuce and Redisson repositories</text>

<rect x="70" y="132" width="740" height="610" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="168">Lettuce keys</text>
<rect class="card" x="118" y="212" width="640" height="450" rx="10" fill="#223047" stroke="#d0a24c" stroke-width="2" filter="url(#shadow)"/>
<g transform="translate(145 227)">
<image data-bluetape4k-icon="redis/redis-icon" x="-4" y="-4" width="66" height="66" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
</g>
<text class="infra" x="218" y="251">Redis keyspace</text>
<text class="label" x="562" y="250" text-anchor="middle">javers:{name}:*</text>
<path d="M 118,276 H758" stroke="#536377" stroke-width="2"/>
<text class="head" x="148" y="308">TYPE</text><text class="head" x="250" y="308">KEY</text><text class="head" x="470" y="308">VALUE</text>
<path d="M 118,326 H758" stroke="#536377" stroke-width="2"/>
<path d="M 230,288 V540" stroke="#536377" stroke-width="2"/>
<path d="M 450,288 V540" stroke="#536377" stroke-width="2"/>
<rect x="145" y="346" width="52" height="20" rx="10" fill="#4fb8a8"/><text class="badge" x="171" y="360" text-anchor="middle">HASH</text>
<text class="row" x="250" y="360">globalId:set</text>
<text class="row" x="470" y="360">GlobalId -> latest snapshot version</text>
<rect x="145" y="414" width="52" height="20" rx="10" fill="#4fb8a8"/><text class="badge" x="171" y="428" text-anchor="middle">HASH</text>
<text class="row" x="250" y="428">sequence:set</text>
<text class="row" x="470" y="428">CommitId -> sequence</text>
<rect x="145" y="482" width="52" height="20" rx="10" fill="#5b8def"/><text class="badge" x="171" y="496" text-anchor="middle">LIST</text>
<text class="row" x="250" y="496">snapshot:{globalId}</text>
<text class="row" x="470" y="496">LPUSH encoded snapshot bytes</text>
<path d="M 148,540 H728" stroke="#536377" stroke-width="2"/>
<text class="note" x="148" y="572">saveSnapshot: MULTI -> LPUSH + HSET globalId:set -> EXEC</text>
<text class="note" x="148" y="598">persistCommit also HSETs sequence:set inside the same transaction.</text>
<text class="note" x="148" y="624">loadHeadId selects the CommitId with the highest sequence.</text>

<rect x="870" y="132" width="740" height="610" rx="18" fill="#182331" stroke="#536377" stroke-width="2" stroke-dasharray="8 6"/>
<text class="lane" x="896" y="168">Redisson objects</text>
<rect class="card" x="918" y="212" width="640" height="450" rx="10" fill="#223047" stroke="#55c7e8" stroke-width="2" filter="url(#shadow)"/>
<g transform="translate(945 227)">
<image data-bluetape4k-icon="redis/redis-icon" x="-4" y="-4" width="66" height="66" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,"/>
</g>
<text class="infra" x="1018" y="251">Redis objects</text>
<text class="label" x="1362" y="250" text-anchor="middle">javers:{name}:*</text>
<path d="M 918,276 H1558" stroke="#536377" stroke-width="2"/>
<text class="head" x="948" y="308">TYPE</text><text class="head" x="1070" y="308">NAME</text><text class="head" x="1255" y="308">VALUE</text>
<path d="M 918,326 H1558" stroke="#536377" stroke-width="2"/>
<path d="M 1050,288 V486" stroke="#536377" stroke-width="2"/>
<path d="M 1235,288 V486" stroke="#536377" stroke-width="2"/>
<rect x="945" y="346" width="76" height="20" rx="10" fill="#5b8def"/><text class="badge" x="983" y="360" text-anchor="middle">MULTIMAP</text>
<text class="row" x="1070" y="360">snapshot</text>
<text class="row" x="1255" y="360">GlobalId -> list of snapshot bytes</text>
<rect x="945" y="414" width="52" height="20" rx="10" fill="#4fb8a8"/><text class="badge" x="971" y="428" text-anchor="middle">MAP</text>
<text class="row" x="1070" y="428">sequence</text>
<text class="row" x="1255" y="428">CommitId -> sequence Long</text>
<path d="M 948,486 H1528" stroke="#536377" stroke-width="2"/>
<text class="note" x="948" y="520">saveSnapshot: snapshots.put(globalId, encoded bytes)</text>
<text class="note" x="948" y="546">loadSnapshots: getAll(globalId), decode, then reverse newest-first.</text>
<text class="note" x="948" y="572">Default snapshot codec: JaversCodecs.LZ4Fory.</text>
<text class="note" x="948" y="598">Redisson stores the byte arrays with LZ4ForyComposite.</text>

<path class="connector" data-source="lettuce-layout" data-target="shared-invariant" d="M 438,662 L 438,758 Q 438,772 452,772 L 606,772 Q 620,772 620,786 L 620,792" fill="none" stroke="#536377" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path class="connector" data-source="redisson-layout" data-target="shared-invariant" d="M 1238,662 L 1238,758 Q 1238,772 1224,772 L 1074,772 Q 1060,772 1060,786 L 1060,792" fill="none" stroke="#536377" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect class="card" x="350" y="792" width="980" height="54" rx="12" fill="#223047" stroke="#536377" stroke-width="2"/>
<text class="note" x="840" y="825" text-anchor="middle">Both layouts restore the JaVers head from the highest CommitId sequence under repository-scoped names.</text>
</svg>
