<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="920" viewBox="0 0 1680 920" role="img" aria-label="javers redis key layout">
<defs>
<filter id="shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#64748b" flood-opacity="0.12"/></filter>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#475569"/></marker>
<style>
.title{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:40px;fill:#183247;font-weight:700}
.subtitle{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:16px;fill:#587086}
.lane{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:25px;fill:#183247;font-weight:700}
.label{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:27px;fill:#183247;font-weight:700}
.head{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:14.5px;fill:#64748b;font-weight:700}
.row{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15.5px;fill:#334155}
.note{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:15px;fill:#64748b}
.badge{font-family:'Comic Mono','Comic Sans MS','DejaVu Sans',sans-serif;font-size:11px;fill:#ffffff;font-weight:700}
.infra{font-family:'Architects Daughter','Comic Sans MS',cursive;font-size:21px;fill:#991b1b;font-weight:700}
</style>
</defs>
<rect width="1680" height="920" rx="26" fill="#f7fafc"/>
<rect x="20" y="20" width="1640" height="880" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text class="title" x="54" y="64">javers-persistence-redis Key Layout</text>
<text class="subtitle" x="56" y="94">Redis keys and collection types used by Lettuce and Redisson repositories</text>

<rect x="70" y="132" width="740" height="610" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="96" y="168">Lettuce keys</text>
<rect x="118" y="212" width="640" height="450" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.3" filter="url(#shadow)"/>
<g transform="translate(145 227)">
<path d="M 0 12 L 28 0 L 56 12 L 28 24 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
<path d="M 0 24 L 28 12 L 56 24 L 28 36 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
<path d="M 0 36 L 28 24 L 56 36 L 28 48 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1"/>
</g>
<text class="infra" x="218" y="251">Redis keyspace</text>
<text class="label" x="562" y="250" text-anchor="middle">javers:{name}:*</text>
<path d="M 118,276 H758" stroke="#fed7aa" stroke-width="1"/>
<text class="head" x="148" y="308">TYPE</text><text class="head" x="250" y="308">KEY</text><text class="head" x="470" y="308">VALUE</text>
<path d="M 118,326 H758" stroke="#fed7aa" stroke-width="1"/>
<path d="M 230,288 V540" stroke="#fed7aa" stroke-width="1"/>
<path d="M 450,288 V540" stroke="#fed7aa" stroke-width="1"/>
<rect x="145" y="346" width="52" height="20" rx="10" fill="#0f766e"/><text class="badge" x="171" y="360" text-anchor="middle">HASH</text>
<text class="row" x="250" y="360">globalId:set</text>
<text class="row" x="470" y="360">GlobalId -> latest version marker</text>
<rect x="145" y="414" width="52" height="20" rx="10" fill="#0f766e"/><text class="badge" x="171" y="428" text-anchor="middle">HASH</text>
<text class="row" x="250" y="428">sequence:set</text>
<text class="row" x="470" y="428">CommitId -> sequence</text>
<rect x="145" y="482" width="52" height="20" rx="10" fill="#2563eb"/><text class="badge" x="171" y="496" text-anchor="middle">LIST</text>
<text class="row" x="250" y="496">snapshot:{globalId}</text>
<text class="row" x="470" y="496">LPUSH encoded snapshot bytes</text>
<path d="M 148,540 H728" stroke="#fed7aa" stroke-width="1"/>
<text class="note" x="148" y="572">saveSnapshot: MULTI -> LPUSH snapshot -> HSET globalId:set -> EXEC</text>
<text class="note" x="148" y="598">loadHeadId scans sequence:set and selects the highest sequence.</text>

<rect x="870" y="132" width="740" height="610" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8 6"/>
<text class="lane" x="896" y="168">Redisson objects</text>
<rect x="918" y="212" width="640" height="450" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3" filter="url(#shadow)"/>
<g transform="translate(945 227)">
<path d="M 0 12 L 28 0 L 56 12 L 28 24 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
<path d="M 0 24 L 28 12 L 56 24 L 28 36 Z" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
<path d="M 0 36 L 28 24 L 56 36 L 28 48 Z" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1"/>
</g>
<text class="infra" x="1018" y="251">Redis objects</text>
<text class="label" x="1362" y="250" text-anchor="middle">javers:{name}:*</text>
<path d="M 918,276 H1558" stroke="#bfdbfe" stroke-width="1"/>
<text class="head" x="948" y="308">TYPE</text><text class="head" x="1070" y="308">NAME</text><text class="head" x="1255" y="308">VALUE</text>
<path d="M 918,326 H1558" stroke="#bfdbfe" stroke-width="1"/>
<path d="M 1050,288 V486" stroke="#bfdbfe" stroke-width="1"/>
<path d="M 1235,288 V486" stroke="#bfdbfe" stroke-width="1"/>
<rect x="945" y="346" width="76" height="20" rx="10" fill="#2563eb"/><text class="badge" x="983" y="360" text-anchor="middle">MULTIMAP</text>
<text class="row" x="1070" y="360">snapshot</text>
<text class="row" x="1255" y="360">GlobalId -> list of snapshot bytes</text>
<rect x="945" y="414" width="52" height="20" rx="10" fill="#0f766e"/><text class="badge" x="971" y="428" text-anchor="middle">MAP</text>
<text class="row" x="1070" y="428">sequence</text>
<text class="row" x="1255" y="428">CommitId -> sequence Long</text>
<path d="M 948,486 H1528" stroke="#bfdbfe" stroke-width="1"/>
<text class="note" x="948" y="520">saveSnapshot: snapshots.put(globalId, encoded bytes)</text>
<text class="note" x="948" y="546">loadSnapshots: getAll(globalId), decode, then reverse newest-first.</text>
<text class="note" x="948" y="572">Codec: Redisson LZ4/Fory composite for stored byte arrays.</text>

<path d="M 438,662 L 438,772 L 840,772 L 840,792" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M 1238,662 L 1238,772 L 840,772 L 840,792" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="350" y="792" width="980" height="54" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.1"/>
<text class="note" x="840" y="825" text-anchor="middle">Both layouts persist snapshots and CommitId sequence metadata under repository-scoped Redis names.</text>
</svg>
