<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape4k JaVers module composition</title>
  <desc id="desc">Current 0.2.0 module composition including core, DDD, Exposed, Redis, Kafka, example, and BOM modules.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas{fill:#F7FAFC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:44px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:18px;fill:#536476;font-weight:400}
      .band-title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:26px;fill:#22344A;font-weight:400}
      .module{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:23px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#627184;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .band{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
    </style>
  </defs>
  <rect class="canvas" width="1500" height="620"/>
  <rect class="frame" x="34" y="28" width="1432" height="564" rx="26"/>
  <text class="title" x="72" y="84">Bluetape4k JaVers module composition</text>
  <text class="subtitle" x="76" y="116">0.2.0 source-backed modules and their release role.</text>

  <rect class="band" x="76" y="152" width="1348" height="102" rx="18"/>
  <text class="band-title" x="106" y="188">Foundation</text>
  <g transform="translate(326,172)">
    <rect class="card" x="0" y="0" width="300" height="62" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="module" x="150" y="28" text-anchor="middle">javers-core</text>
    <text class="detail" x="150" y="49" text-anchor="middle">extensions, codecs, repository SPI</text>
  </g>
  <g transform="translate(660,172)">
    <rect class="card" x="0" y="0" width="300" height="62" rx="12" fill="#F7F1E7" stroke="#B88A44"/>
    <text class="module" x="150" y="28" text-anchor="middle">bluetape4k-javers-bom</text>
    <text class="detail" x="150" y="49" text-anchor="middle">aligned consumer dependency set</text>
  </g>

  <rect class="band" x="76" y="278" width="1348" height="126" rx="18"/>
  <text class="band-title" x="106" y="324">Libraries</text>
  <g transform="translate(326,306)">
    <rect class="card" x="0" y="0" width="300" height="72" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="module" x="150" y="30" text-anchor="middle">javers-ddd</text>
    <text class="detail" x="150" y="52" text-anchor="middle">aggregate and domain-event helpers</text>
  </g>
  <g transform="translate(660,306)">
    <rect class="card" x="0" y="0" width="300" height="72" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
    <text class="module" x="150" y="30" text-anchor="middle">javers-exposed</text>
    <text class="detail" x="150" y="52" text-anchor="middle">Exposed JDBC CDO snapshot storage</text>
  </g>
  <g transform="translate(994,306)">
    <rect class="card" x="0" y="0" width="300" height="72" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="module" x="150" y="30" text-anchor="middle">persistence adapters</text>
    <text class="detail" x="150" y="52" text-anchor="middle">Redis and Kafka repository modules</text>
  </g>

  <rect class="band" x="76" y="428" width="1348" height="102" rx="18"/>
  <text class="band-title" x="106" y="464">Example</text>
  <g transform="translate(326,448)">
    <rect class="card" x="0" y="0" width="420" height="62" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="module" x="210" y="28" text-anchor="middle">examples/javers-exposed-ddd</text>
    <text class="detail" x="210" y="49" text-anchor="middle">CQRS command side, Kafka event, Redis projection</text>
  </g>
  <text class="small" x="750" y="566" text-anchor="middle">Published artifacts exclude example modules; all labels are generated from the current 0.2.0 module layout.</text>
</svg>
