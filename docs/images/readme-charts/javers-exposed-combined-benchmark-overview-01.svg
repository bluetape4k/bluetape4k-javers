<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
  <title id="title">JaVers Exposed combined benchmark overview</title>
  <desc id="desc">Horizontal bar chart comparing audit-query latency from the Envers comparison with commit metadata query latency converted from throughput to milliseconds per operation. Lower values are better.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas{fill:#F7FAFC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:42px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:18px;fill:#536476;font-weight:400}
      .axis{stroke:#C9D7E4;stroke-width:2}
      .tick{stroke:#E4ECF3;stroke-width:1.5}
      .tick-label{font-family:"Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:14px;fill:#6B7B8D}
      .label{font-family:"Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:15px;fill:#35465A}
      .value{font-family:"Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:14px;fill:#314255;font-weight:600}
      .legend{font-family:"Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:15px;fill:#35465A}
      .note{font-family:"Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:13px;fill:#627184}
      .plot{fill:#FBFDFE;stroke:#DCE7F0;stroke-width:2;filter:url(#shadow)}
    </style>
  </defs>
  <rect class="canvas" width="1500" height="680"/>
  <rect class="frame" x="34" y="28" width="1432" height="624" rx="26"/>
  <text class="title" x="72" y="84">JaVers Exposed combined benchmark overview</text>
  <text class="subtitle" x="76" y="116">Audit-query and metadata-query latency, milliseconds per operation, lower is better.</text>

  <g transform="translate(76,138)">
    <rect x="0" y="0" width="1348" height="70" rx="18" fill="#F3F7FB" stroke="#D7E2EC" stroke-width="2"/>
    <g transform="translate(28,22)">
      <rect width="18" height="18" rx="4" fill="#4A90E2"/>
      <text class="legend" x="28" y="15">Audit workflow benchmark</text>
    </g>
    <g transform="translate(350,22)">
      <rect width="18" height="18" rx="4" fill="#54A66B"/>
      <text class="legend" x="28" y="15">Commit metadata baseline</text>
    </g>
    <g transform="translate(710,22)">
      <rect width="18" height="18" rx="4" fill="#D6A63F"/>
      <text class="legend" x="28" y="15">Best metadata-index smoke variant</text>
    </g>
  </g>

  <g transform="translate(76,230)">
    <rect class="plot" x="0" y="0" width="1348" height="440" rx="18"/>
    <line class="axis" x1="420" y1="380" x2="1320" y2="380"/>
    <g>
      <line class="tick" x1="420" y1="34" x2="420" y2="380"/>
      <text class="tick-label" x="420" y="406" text-anchor="middle">0</text>
      <line class="tick" x1="697" y1="34" x2="697" y2="380"/>
      <text class="tick-label" x="697" y="406" text-anchor="middle">4</text>
      <line class="tick" x1="974" y1="34" x2="974" y2="380"/>
      <text class="tick-label" x="974" y="406" text-anchor="middle">8</text>
      <line class="tick" x1="1251" y1="34" x2="1251" y2="380"/>
      <text class="tick-label" x="1251" y="406" text-anchor="middle">12</text>
      <line class="tick" x1="1320" y1="34" x2="1320" y2="380"/>
      <text class="tick-label" x="1320" y="406" text-anchor="middle">13</text>
    </g>

    <text class="label" x="42" y="56">Hibernate Envers audit-query</text>
    <rect x="420" y="40" width="864" height="18" rx="5" fill="#4A90E2"/>
    <text class="value" x="1296" y="54">12.483</text>

    <text class="label" x="42" y="94">JaVers in-memory audit-query</text>
    <rect x="420" y="78" width="869" height="18" rx="5" fill="#4A90E2"/>
    <text class="value" x="1301" y="92">12.559</text>

    <text class="label" x="42" y="132">JaVers + Exposed repository audit-query</text>
    <rect x="420" y="116" width="53" height="18" rx="5" fill="#4A90E2"/>
    <text class="value" x="485" y="130">0.763</text>

    <text class="label" x="42" y="170">JaVers + Exposed DDD audit-query</text>
    <rect x="420" y="154" width="49" height="18" rx="5" fill="#4A90E2"/>
    <text class="value" x="481" y="168">0.704</text>

    <text class="label" x="42" y="224">Metadata baseline author query</text>
    <rect x="420" y="208" width="75" height="18" rx="5" fill="#54A66B"/>
    <text class="value" x="507" y="222">1.090</text>

    <text class="label" x="42" y="262">Metadata baseline date-range query</text>
    <rect x="420" y="246" width="76" height="18" rx="5" fill="#54A66B"/>
    <text class="value" x="508" y="260">1.091</text>

    <text class="label" x="42" y="316">Best indexed author query</text>
    <rect x="420" y="300" width="73" height="18" rx="5" fill="#D6A63F"/>
    <text class="value" x="505" y="314">1.057</text>

    <text class="label" x="42" y="354">Best indexed date-range query</text>
    <rect x="420" y="338" width="75" height="18" rx="5" fill="#D6A63F"/>
    <text class="value" x="507" y="352">1.083</text>

    <text class="note" x="750" y="432" text-anchor="middle">Metadata benchmark values are converted from ops/s with 1000 / throughput; benchmark scopes are related but not identical.</text>
  </g>
</svg>
