<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640" role="img" aria-labelledby="title desc">
  <title id="title">JaVers Exposed commit metadata index evaluation</title>
  <desc id="desc">Grouped horizontal bar chart comparing baseline, author index, commit_date index, and both indexes for insert, author query, and date range query throughput in operations per second. Higher values are better.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas{fill:#F7FAFC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:42px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:18px;fill:#536476;font-weight:400}
      .axis{stroke:#C9D7E4;stroke-width:2}
      .tick{stroke:#E4ECF3;stroke-width:1.5}
      .tick-label{font-family:"Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:14px;fill:#6B7B8D}
      .scenario{font-family:"Architects Daughter","Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:25px;fill:#22344A;font-weight:400}
      .label{font-family:"Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:15px;fill:#35465A}
      .value{font-family:"Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:14px;fill:#314255;font-weight:600}
      .legend{font-family:"Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:15px;fill:#35465A}
      .note{font-family:"Comic Sans MS","Comic Sans","Comic Neue",sans-serif;font-size:13px;fill:#627184}
      .plot{fill:#FBFDFE;stroke:#DCE7F0;stroke-width:2;filter:url(#shadow)}
    </style>
  </defs>
  <rect class="canvas" width="1500" height="640"/>
  <rect class="frame" x="34" y="28" width="1432" height="584" rx="26"/>
  <text class="title" x="72" y="84">JaVers Exposed commit metadata index evaluation</text>
  <text class="subtitle" x="76" y="116">2026-06-08 kotlinx-benchmark / JMH smoke, PostgreSQL + HikariCP, throughput ops/s, higher is better.</text>

  <g transform="translate(76,138)">
    <rect x="0" y="0" width="1348" height="70" rx="18" fill="#F3F7FB" stroke="#D7E2EC" stroke-width="2"/>
    <g transform="translate(28,22)">
      <rect width="18" height="18" rx="4" fill="#4A90E2"/>
      <text class="legend" x="28" y="15">Baseline</text>
    </g>
    <g transform="translate(250,22)">
      <rect width="18" height="18" rx="4" fill="#54A66B"/>
      <text class="legend" x="28" y="15">Author index</text>
    </g>
    <g transform="translate(510,22)">
      <rect width="18" height="18" rx="4" fill="#C76093"/>
      <text class="legend" x="28" y="15">commit_date index</text>
    </g>
    <g transform="translate(828,22)">
      <rect width="18" height="18" rx="4" fill="#D6A63F"/>
      <text class="legend" x="28" y="15">Author + commit_date indexes</text>
    </g>
  </g>

  <g transform="translate(76,230)">
    <rect class="plot" x="0" y="0" width="1348" height="410" rx="18"/>
    <line class="axis" x1="420" y1="354" x2="1320" y2="354"/>
    <g>
      <line class="tick" x1="420" y1="34" x2="420" y2="354"/>
      <text class="tick-label" x="420" y="380" text-anchor="middle">0</text>
      <line class="tick" x1="645" y1="34" x2="645" y2="354"/>
      <text class="tick-label" x="645" y="380" text-anchor="middle">250</text>
      <line class="tick" x1="870" y1="34" x2="870" y2="354"/>
      <text class="tick-label" x="870" y="380" text-anchor="middle">500</text>
      <line class="tick" x1="1095" y1="34" x2="1095" y2="354"/>
      <text class="tick-label" x="1095" y="380" text-anchor="middle">750</text>
      <line class="tick" x1="1320" y1="34" x2="1320" y2="354"/>
      <text class="tick-label" x="1320" y="380" text-anchor="middle">1000</text>
    </g>

    <text class="scenario" x="42" y="58">insert</text>
    <text class="label" x="212" y="45">Baseline</text>
    <rect x="420" y="30" width="433" height="18" rx="5" fill="#4A90E2"/>
    <text class="value" x="865" y="44">481.4</text>
    <text class="label" x="212" y="69">Author index</text>
    <rect x="420" y="54" width="440" height="18" rx="5" fill="#54A66B"/>
    <text class="value" x="872" y="68">488.6</text>
    <text class="label" x="212" y="93">commit_date index</text>
    <rect x="420" y="78" width="449" height="18" rx="5" fill="#C76093"/>
    <text class="value" x="881" y="92">499.3</text>
    <text class="label" x="212" y="117">Both indexes</text>
    <rect x="420" y="102" width="467" height="18" rx="5" fill="#D6A63F"/>
    <text class="value" x="899" y="116">518.6</text>

    <text class="scenario" x="42" y="170">author-query</text>
    <text class="label" x="212" y="157">Baseline</text>
    <rect x="420" y="142" width="826" height="18" rx="5" fill="#4A90E2"/>
    <text class="value" x="1258" y="156">917.5</text>
    <text class="label" x="212" y="181">Author index</text>
    <rect x="420" y="166" width="816" height="18" rx="5" fill="#54A66B"/>
    <text class="value" x="1248" y="180">907.1</text>
    <text class="label" x="212" y="205">commit_date index</text>
    <rect x="420" y="190" width="838" height="18" rx="5" fill="#C76093"/>
    <text class="value" x="1270" y="204">931.2</text>
    <text class="label" x="212" y="229">Both indexes</text>
    <rect x="420" y="214" width="851" height="18" rx="5" fill="#D6A63F"/>
    <text class="value" x="1283" y="228">945.9</text>

    <text class="scenario" x="42" y="282">date-range</text>
    <text class="label" x="212" y="269">Baseline</text>
    <rect x="420" y="254" width="825" height="18" rx="5" fill="#4A90E2"/>
    <text class="value" x="1257" y="268">916.5</text>
    <text class="label" x="212" y="293">Author index</text>
    <rect x="420" y="278" width="814" height="18" rx="5" fill="#54A66B"/>
    <text class="value" x="1246" y="292">904.7</text>
    <text class="label" x="212" y="317">commit_date index</text>
    <rect x="420" y="302" width="831" height="18" rx="5" fill="#C76093"/>
    <text class="value" x="1263" y="316">923.2</text>
    <text class="label" x="212" y="341">Both indexes</text>
    <rect x="420" y="326" width="786" height="18" rx="5" fill="#D6A63F"/>
    <text class="value" x="1218" y="340">873.8</text>

    <text class="note" x="750" y="402" text-anchor="middle">Candidate indexes are benchmark-only; smoke results are mixed, so production schema defaults remain unchanged.</text>
  </g>
</svg>
