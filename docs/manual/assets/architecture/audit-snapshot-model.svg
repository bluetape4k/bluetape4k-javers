  <text x="498" y="693" text-anchor="start" font-family="Architects Daughter, monospace" font-size="25" font-weight="700" fill="#eef6ff">Repository SPI</text>

  <text x="498" y="726" text-anchor="start" font-family="Comic Mono, monospace" font-size="18" font-weight="400" fill="#a9bfd2">encode / decode</text>
<text x="498" y="753" text-anchor="start" font-family="Comic Mono, monospace" font-size="18" font-weight="400" fill="#a9bfd2">query + head contract</text>
</g>

