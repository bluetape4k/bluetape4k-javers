  <rect width="1600" height="1040" fill="#07111f"/>
  <rect class="frame" x="36" y="32" width="1528" height="976" rx="32" fill="none" stroke="#31506c" stroke-width="2"/>
  <text class="title" x="76" y="92" text-anchor="start" font-family="Architects Daughter, monospace" font-size="42" font-weight="700" fill="#eef6ff">Audit snapshot model</text>
  <text class="subtitle" x="78" y="128" text-anchor="start" font-family="Comic Mono, monospace" font-size="18" font-weight="400" fill="#a9bfd2">A commit records an operation; snapshots preserve state for change and shadow queries.</text>
  <g class="card-group" data-card="Domain object">
  <rect class="card" x="92" y="238" width="280" height="190" rx="22" fill="#11263b" stroke="#55c7e8" stroke-width="2.5"/>
