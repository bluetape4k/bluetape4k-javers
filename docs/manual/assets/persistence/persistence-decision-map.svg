<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Persistence decision map</title>
  <desc id="desc">Select one primary responsibility; composition and recovery remain application concerns.</desc>
