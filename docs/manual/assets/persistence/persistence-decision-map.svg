<path class="connector" data-source="kafka" data-target="always" d="M 1260 765 H 1285 Q 1299 765 1299 751 V 599 Q 1299 585 1313 585 H 1325" fill="none" stroke="#ef8297" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-rose-14)"/>
