<path class="connector" data-source="snapshot-table" data-target="update" d="M 1120 508 H 1180 Q 1194 508 1194 494 V 370 Q 1194 356 1208 356 H 1250" fill="none" stroke="#e7b85c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber-14)"/>
<path class="connector" data-source="update" data-target="head" d="M 1385 412 V 612 Q 1385 636 1361 636 H 674 Q 650 636 650 660 V 670" fill="none" stroke="#ef8297" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-rose-14)"/>
<path class="connector" data-source="load" data-target="head" d="M 820 758 H 700" fill="none" stroke="#9fbd72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-olive-14)"/>
<path class="connector" data-source="snapshot-table" data-target="load" d="M 970 596 V 670" fill="none" stroke="#e7b85c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber-14)"/>
<g class="label-pill">
  <rect x="726" y="203" width="152" height="34" rx="17" fill="#07111f" stroke="#b69af5" stroke-width="2"/>
  <text x="802.0" y="226" text-anchor="middle" font-family="Comic Mono, monospace" font-size="15" font-weight="700" fill="#b69af5">tx per snapshot</text>
</g>

<g class="label-pill">
  <rect x="1135" y="438" width="152" height="34" rx="17" fill="#07111f" stroke="#ef8297" stroke-width="2"/>
  <text x="1211.0" y="461" text-anchor="middle" font-family="Comic Mono, monospace" font-size="15" font-weight="700" fill="#ef8297">after snapshots</text>
</g>

  <g class="legend"><g class="label-pill">
  <rect x="78" y="904" width="510" height="34" rx="17" fill="#07111f" stroke="#ef8297" stroke-width="2"/>
  <text x="333.0" y="927" text-anchor="middle" font-family="Comic Mono, monospace" font-size="15" font-weight="700" fill="#ef8297">Important: this is not one atomic database transaction</text>
</g>
</g>
