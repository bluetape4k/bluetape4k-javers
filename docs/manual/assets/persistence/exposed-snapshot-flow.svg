  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ef8297" stroke="#ef8297" stroke-width="0.6"/>
</marker>

<marker id="arrow-rose-16" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
  <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ef8297" stroke="#ef8297" stroke-width="0.6"/>
</marker>

