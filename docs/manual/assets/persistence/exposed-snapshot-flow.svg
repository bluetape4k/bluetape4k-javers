<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Exposed snapshot flow</title>
  <desc id="desc">Each snapshot write and the final sequence update use separate Exposed transactions.</desc>
